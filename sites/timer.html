<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Timer</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reddit+Mono&display=swap">

  <style>
    :root {
      --bg-color: #1a1a1a;
      --bg-color-finished: #4b4352;
      --text-color: rgba(255, 255, 255, 0.87);
    }

    :root[data-theme="light"] {
      --bg-color: #f0f0f0;
      --bg-color-finished: #f4f0ff;
      --text-color: #000000;
    }

    body {
      position: relative;
      min-height: 100vh;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-color);
      color: var(--text-color);
      transition: all 0.1s ease;
    }

    body.finished {
      background: var(--bg-color-finished);
    }

    .timer-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }

    #countdown-timer {
      font-size: 6rem;
      color: var(--text-color);
      transition: opacity 0.1s ease;
      font-family: 'Reddit Mono', monospace;
    }

    body.paused #countdown-timer {
      opacity: 0.4;
    }

    @keyframes timer-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    body.finished #countdown-timer {
      animation: timer-pulse 1s ease-in-out infinite;
    }

    #time-input {
      font-size: 6rem;
      font-family: 'Reddit Mono', monospace;
      color: var(--text-color);
      background: transparent;
      border: none;
      border-bottom: 2px solid var(--text-color);
      outline: none;
      text-align: center;
      width: 8ch;
      opacity: 0.7;
      display: none;
    }

    #reset-button {
      position: absolute;
      bottom: 20px;
      right: 20px;
      width: 44px;
      height: 44px;
      min-width: 44px;
      max-width: 44px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--text-color);
      color: var(--bg-color);
      opacity: 0;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
      font-size: 1.2rem;
      padding: 0;
      border: none;
      transition: all 0.1s ease;
      flex-shrink: 0;
    }

    #theme-toggle {
      position: absolute;
      bottom: 20px;
      right: 74px;
      width: 44px;
      height: 44px;
      min-width: 44px;
      max-width: 44px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--text-color);
      color: var(--bg-color);
      opacity: 0;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
      font-size: 1.5rem;
      padding: 0;
      border: none;
      transition: all 0.1s ease;
      flex-shrink: 0;
    }

    body:hover #reset-button,
    body:hover #theme-toggle {
      opacity: 1;
    }

    #reset-button:hover,
    #theme-toggle:hover {
      transform: scale(1.1);
    }

    [data-tooltip] {
      position: relative;
    }

    [data-tooltip]::after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: 52px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--text-color);
      color: var(--bg-color);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-family: 'Reddit Mono', monospace;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
    }

    [data-tooltip]:hover::after {
      opacity: 1;
    }

    #duration-label {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.9rem;
      color: var(--text-color);
      opacity: 0.5;
      font-family: 'Reddit Mono', monospace;
    }

    .volume-container {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0;
      transition: opacity 0.1s ease;
    }

    body:hover .volume-container {
      opacity: 1;
    }

    .volume-container label {
      font-size: 0.9rem;
      color: var(--text-color);
      opacity: 0.7;
      font-family: 'Reddit Mono', monospace;
      white-space: nowrap;
    }

    #volume-slider {
      width: 150px;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
      cursor: pointer;
    }

    #volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      background: var(--text-color);
      border-radius: 50%;
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    #volume-slider::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    #volume-slider::-moz-range-thumb {
      width: 16px;
      height: 16px;
      background: var(--text-color);
      border-radius: 50%;
      cursor: pointer;
      border: none;
      transition: transform 0.1s ease;
    }

    #volume-slider::-moz-range-thumb:hover {
      transform: scale(1.2);
    }

    :root[data-theme="light"] #volume-slider {
      background: rgba(0, 0, 0, 0.2);
    }
  </style>
</head>

<body>
  <div class="timer-container">
    <div id="countdown-timer">00:00</div>
    <input type="text" id="time-input" placeholder="mm:ss">
  </div>
  <button id="reset-button" data-tooltip="reset (r)" onclick="resetTimer()">↻</button>
  <button id="theme-toggle" data-tooltip="theme" onclick="toggleTheme()">◑</button>
  <div id="duration-label"></div>
  <div class="volume-container">
    <label for="volume-slider">Volume:</label>
    <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="1">
  </div>
  <audio id="bell-audio" src="bell.mp3" preload="auto"></audio>
  <canvas id="pip-canvas" style="display: none;"></canvas>

  <script>
    const STORAGE_THEME = 'timer_theme';
    const STORAGE_VOLUME = 'timer_volume';

    let durationSeconds = 0;
    let startTime = null;          // wall-clock ms the current running segment began
    let accumulatedSeconds = 0;    // elapsed seconds carried over from prior segments
    let paused = false;
    let finished = false;
    let interval = null;
    let editMode = false;
    let pipWindow = null;
    let pipVideo = null;
    let canvas = null;
    let ctx = null;
    let volumeDebounceTimer = null;

    function pad(n) {
      return String(n).padStart(2, '0');
    }

    function getDurationFromParams() {
      const params = new URLSearchParams(window.location.search);
      const hasMinutes = params.has('minutes');
      const hasSeconds = params.has('seconds');
      if (!hasMinutes && !hasSeconds) return 5 * 60;
      const m = hasMinutes ? parseInt(params.get('minutes')) : 0;
      const s = hasSeconds ? parseInt(params.get('seconds')) : 0;
      const total = (Number.isFinite(m) ? m : 0) * 60 + (Number.isFinite(s) ? s : 0);
      return total > 0 ? total : 5 * 60;
    }

    durationSeconds = getDurationFromParams();

    function updateDurationLabel() {
      const h = Math.floor(durationSeconds / 3600);
      const m = Math.floor((durationSeconds % 3600) / 60);
      const s = durationSeconds % 60;
      const parts = [];
      if (h > 0) parts.push(`${h} hour${h !== 1 ? 's' : ''}`);
      if (m > 0) parts.push(`${m} minute${m !== 1 ? 's' : ''}`);
      if (s > 0) parts.push(`${s} second${s !== 1 ? 's' : ''}`);
      document.getElementById('duration-label').textContent =
        parts.length ? parts.join(' ') : '0 seconds';
    }

    updateDurationLabel();

    function loadInitialTheme() {
      try {
        const saved = localStorage.getItem(STORAGE_THEME);
        if (saved === 'light' || saved === 'dark') {
          setTheme(saved);
          return;
        }
      } catch (_) { /* ignore */ }
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      setTheme(prefersDark ? 'dark' : 'light');
    }

    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      const toggle = document.getElementById('theme-toggle');
      toggle.textContent = theme === 'light' ? '◐' : '◑';
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'light' ? 'dark' : 'light';
      setTheme(next);
      try {
        localStorage.setItem(STORAGE_THEME, next);
      } catch (_) { /* ignore */ }
    }

    loadInitialTheme();

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
      try {
        if (localStorage.getItem(STORAGE_THEME) != null) return;
      } catch (_) { /* ignore */ }
      setTheme(e.matches ? 'dark' : 'light');
    });

    initializePIP();
    document.addEventListener('visibilitychange', handleVisibilityChange);
    loadState();
    loadVolume();
    setupVolumeSlider();

    window.addEventListener('popstate', () => {
      durationSeconds = getDurationFromParams();
      updateDurationLabel();
      loadState();
    });

    document.addEventListener('keydown', (e) => {
      const inInput = document.activeElement && document.activeElement.tagName === 'INPUT';
      if (e.key === 'Enter') {
        if (!inInput) {
          e.preventDefault();
          enterEditMode();
        }
      } else if (e.key === 'Escape') {
        if (editMode) exitEditMode(false);
      } else if (e.key === ' ') {
        if (!inInput) {
          e.preventDefault();
          togglePause();
        }
      } else if (e.key === 'r' || e.key === 'R') {
        if (e.metaKey || e.ctrlKey) return;
        if (!inInput) {
          e.preventDefault();
          resetTimer();
        }
      }
    });

    // --- Timer state ---

    function getElapsed(now) {
      if (finished) return durationSeconds;
      if (paused || startTime === null) return accumulatedSeconds;
      return accumulatedSeconds + (now - startTime) / 1000;
    }

    function getRemaining(now) {
      return Math.max(0, durationSeconds - getElapsed(now));
    }

    function saveState() {
      const prefix = `timer_${durationSeconds}_`;
      if (finished) {
        localStorage.setItem(prefix + 'finished', '1');
        localStorage.setItem(prefix + 'accumulatedSeconds', String(accumulatedSeconds));
        localStorage.removeItem(prefix + 'startTime');
        localStorage.removeItem(prefix + 'paused');
        return;
      }
      localStorage.removeItem(prefix + 'finished');
      if (paused) {
        localStorage.setItem(prefix + 'paused', '1');
        localStorage.setItem(prefix + 'accumulatedSeconds', String(accumulatedSeconds));
        localStorage.removeItem(prefix + 'startTime');
        return;
      }
      localStorage.removeItem(prefix + 'paused');
      localStorage.setItem(prefix + 'accumulatedSeconds', String(accumulatedSeconds));
      if (startTime !== null) {
        localStorage.setItem(prefix + 'startTime', String(startTime));
      } else {
        localStorage.removeItem(prefix + 'startTime');
      }
    }

    function loadState() {
      clearInterval(interval);
      interval = null;
      document.body.classList.remove('finished', 'paused');

      const prefix = `timer_${durationSeconds}_`;
      const savedFinished = localStorage.getItem(prefix + 'finished');
      const savedPaused = localStorage.getItem(prefix + 'paused');
      const savedStart = localStorage.getItem(prefix + 'startTime');
      const savedAccum = localStorage.getItem(prefix + 'accumulatedSeconds');
      const accum = savedAccum != null ? parseFloat(savedAccum) : 0;

      if (savedFinished === '1') {
        finished = true;
        paused = false;
        startTime = null;
        accumulatedSeconds = durationSeconds;
        document.body.classList.add('finished');
        updateDisplay(0);
        return;
      }

      if (savedPaused === '1') {
        finished = false;
        paused = true;
        startTime = null;
        accumulatedSeconds = Number.isFinite(accum) ? accum : 0;
        document.body.classList.add('paused');
        updateDisplay(getRemaining(Date.now()));
        return;
      }

      if (savedStart != null) {
        const st = parseInt(savedStart, 10);
        if (Number.isFinite(st)) {
          finished = false;
          paused = false;
          startTime = st;
          accumulatedSeconds = Number.isFinite(accum) ? accum : 0;
          interval = setInterval(updateTimer, 100);
          updateTimer();
          return;
        }
      }

      startFresh();
    }

    function startFresh() {
      clearInterval(interval);
      finished = false;
      paused = false;
      accumulatedSeconds = 0;
      startTime = Date.now();
      document.body.classList.remove('finished', 'paused');
      interval = setInterval(updateTimer, 100);
      saveState();
      updateTimer();
    }

    function updateTimer() {
      const now = Date.now();
      const remaining = getRemaining(now);
      if (remaining <= 0 && !finished) {
        finishTimer();
        return;
      }
      updateDisplay(remaining);
    }

    function finishTimer() {
      finished = true;
      paused = false;
      startTime = null;
      accumulatedSeconds = durationSeconds;
      clearInterval(interval);
      interval = null;
      document.body.classList.remove('paused');
      document.body.classList.add('finished');
      saveState();
      updateDisplay(0);
      playBell();
    }

    function pauseTimer() {
      if (paused || finished || startTime === null) return;
      const now = Date.now();
      accumulatedSeconds += (now - startTime) / 1000;
      startTime = null;
      paused = true;
      clearInterval(interval);
      interval = null;
      document.body.classList.add('paused');
      saveState();
      updateDisplay(getRemaining(now));
    }

    function resumeTimer() {
      if (!paused || finished) return;
      startTime = Date.now();
      paused = false;
      document.body.classList.remove('paused');
      interval = setInterval(updateTimer, 100);
      saveState();
      updateTimer();
    }

    function togglePause() {
      if (finished) return;
      if (paused) resumeTimer();
      else pauseTimer();
    }

    function resetTimer() {
      startFresh();
    }

    function updateDisplay(remainingSeconds) {
      const totalSecs = finished ? 0 : Math.max(0, Math.ceil(remainingSeconds));
      const h = Math.floor(totalSecs / 3600);
      const m = Math.floor((totalSecs % 3600) / 60);
      const s = totalSecs % 60;
      const timeString = h > 0
        ? `${pad(h)}:${pad(m)}:${pad(s)}`
        : `${pad(m)}:${pad(s)}`;
      document.getElementById('countdown-timer').textContent = timeString;

      if (pipWindow && canvas && ctx) {
        updatePIPCanvas(timeString);
      }
    }

    function changeDuration(newSeconds) {
      clearInterval(interval);
      interval = null;
      durationSeconds = newSeconds;
      updateDurationLabel();

      const m = Math.floor(newSeconds / 60);
      const s = newSeconds % 60;
      const params = new URLSearchParams();
      if (m > 0) params.set('minutes', String(m));
      if (s > 0) params.set('seconds', String(s));
      const search = params.toString() ? `?${params.toString()}` : '';
      history.pushState(null, '', window.location.pathname + search);

      loadState();
    }

    // --- Edit mode (type a new timer length) ---

    function enterEditMode() {
      if (editMode) return;
      editMode = true;
      const countdownEl = document.getElementById('countdown-timer');
      const inputEl = document.getElementById('time-input');
      const h = Math.floor(durationSeconds / 3600);
      const m = Math.floor((durationSeconds % 3600) / 60);
      const s = durationSeconds % 60;
      inputEl.value = h > 0
        ? `${pad(h)}:${pad(m)}:${pad(s)}`
        : `${pad(m)}:${pad(s)}`;
      countdownEl.style.display = 'none';
      inputEl.style.display = 'block';
      inputEl.focus();
      inputEl.select();
      inputEl.addEventListener('keydown', handleInputKey);
      inputEl.addEventListener('blur', handleInputBlur);
    }

    function handleInputKey(e) {
      if (e.key === 'Enter') {
        e.stopPropagation();
        exitEditMode(true);
      } else if (e.key === 'Escape') {
        e.stopPropagation();
        exitEditMode(false);
      }
    }

    function handleInputBlur() {
      exitEditMode(false);
    }

    function exitEditMode(confirm) {
      if (!editMode) return;
      editMode = false;
      const countdownEl = document.getElementById('countdown-timer');
      const inputEl = document.getElementById('time-input');
      inputEl.removeEventListener('keydown', handleInputKey);
      inputEl.removeEventListener('blur', handleInputBlur);
      countdownEl.style.display = '';
      inputEl.style.display = 'none';

      if (confirm) {
        const parsed = parseTimeInput(inputEl.value);
        if (parsed > 0) changeDuration(parsed);
      }
    }

    function parseTimeInput(value) {
      value = value.trim();
      if (value.includes(':')) {
        const parts = value.split(':').map(x => parseInt(x, 10) || 0);
        if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
        if (parts.length === 2) return parts[0] * 60 + parts[1];
        return parts[0];
      }
      const num = parseFloat(value);
      if (!isNaN(num) && num > 0) return Math.round(num * 60);
      return 0;
    }

    // --- Bell sound ---

    function playBell() {
      const audio = document.getElementById('bell-audio');
      audio.currentTime = 0;
      audio.play().catch(err => {
        console.error('Error playing bell:', err);
      });
    }

    function loadVolume() {
      const savedVolume = localStorage.getItem(STORAGE_VOLUME);
      if (savedVolume !== null) {
        const volume = parseFloat(savedVolume);
        if (Number.isFinite(volume)) {
          document.getElementById('bell-audio').volume = volume;
          document.getElementById('volume-slider').value = volume;
        }
      }
    }

    function saveVolume(volume) {
      localStorage.setItem(STORAGE_VOLUME, volume.toString());
    }

    function setupVolumeSlider() {
      const slider = document.getElementById('volume-slider');
      const audio = document.getElementById('bell-audio');

      slider.addEventListener('input', (e) => {
        const volume = parseFloat(e.target.value);
        audio.volume = volume;
        saveVolume(volume);

        if (volumeDebounceTimer) clearTimeout(volumeDebounceTimer);
        volumeDebounceTimer = setTimeout(() => {
          playBell();
        }, 300);
      });
    }

    // --- Picture-in-picture ---

    function initializePIP() {
      canvas = document.getElementById('pip-canvas');
      ctx = canvas.getContext('2d');

      const dpr = window.devicePixelRatio || 1;
      canvas.width = 400 * dpr;
      canvas.height = 200 * dpr;
      canvas.style.width = '400px';
      canvas.style.height = '200px';
      ctx.scale(dpr, dpr);
    }

    function handleVisibilityChange() {
      if (document.hidden && 'pictureInPictureEnabled' in document) {
        enterPIP();
      } else if (!document.hidden && pipWindow) {
        exitPIP();
      }
    }

    async function enterPIP() {
      if (!canvas || pipWindow) return;

      try {
        updatePIPCanvas(document.getElementById('countdown-timer').textContent);

        pipVideo = document.createElement('video');
        pipVideo.srcObject = canvas.captureStream(30);
        pipVideo.muted = true;

        await new Promise((resolve) => {
          pipVideo.addEventListener('loadedmetadata', resolve, { once: true });
          pipVideo.play();
        });

        pipWindow = await pipVideo.requestPictureInPicture();

        pipVideo.addEventListener('leavepictureinpicture', () => {
          pipWindow = null;
          pipVideo = null;
        }, { once: true });

        pipWindow.addEventListener('resize', () => {
          const dpr = window.devicePixelRatio || 1;
          canvas.width = pipWindow.width * dpr;
          canvas.height = pipWindow.height * dpr;
          canvas.style.width = pipWindow.width + 'px';
          canvas.style.height = pipWindow.height + 'px';
          ctx.scale(dpr, dpr);
          updatePIPCanvas(document.getElementById('countdown-timer').textContent);
        });

      } catch (error) {
        console.error('Failed to enter PIP mode:', error);
      }
    }

    function exitPIP() {
      if (pipWindow) {
        document.exitPictureInPicture();
        pipWindow = null;
        pipVideo = null;
      }
    }

    function updatePIPCanvas(timeString) {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const bgColor = finished
        ? (currentTheme === 'light' ? '#f4f0ff' : '#4b4352')
        : (currentTheme === 'light' ? '#f0f0f0' : '#1a1a1a');
      const textColor = currentTheme === 'light' ? '#000000' : 'rgba(255, 255, 255, 0.87)';

      const logicalWidth = parseInt(canvas.style.width) || 400;
      const logicalHeight = parseInt(canvas.style.height) || 200;

      ctx.fillStyle = bgColor;
      ctx.fillRect(0, 0, logicalWidth, logicalHeight);

      ctx.fillStyle = textColor;
      ctx.font = 'bold 84px "Reddit Mono", monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(timeString, logicalWidth / 2, logicalHeight / 2);
    }
  </script>
</body>

</html>
