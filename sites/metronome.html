<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metronome</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reddit+Mono&display=swap">

  <style>
    :root {
      --bg-color: #1a1a1a;
      --popover-bg: #2a2a2a;
      --text-color: rgba(255, 255, 255, 0.87);
      --border-color: rgba(255, 255, 255, 0.35);
      --section-track: transparent;
      --section-fill: rgba(255, 255, 255, 0.07);
      --section-divider: rgba(255, 255, 255, 0.1);
    }

    :root[data-theme="light"] {
      --bg-color: #f0f0f0;
      --popover-bg: #e3e3e3;
      --text-color: #000000;
      --border-color: rgba(0, 0, 0, 0.28);
      --section-track: transparent;
      --section-fill: rgba(0, 0, 0, 0.045);
      --section-divider: rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: row;
      min-height: 100dvh;
      height: 100dvh;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    .control-section {
      position: relative;
      flex-shrink: 0;
      background: var(--section-track);
      overflow: hidden;
      cursor: pointer;
      touch-action: none;
    }

    #main-area {
      flex: 1 1 0;
      min-width: 0;
      position: relative;
      border-right: 1px solid transparent;
      transition: none;
    }

    body:hover #main-area,
    body.popover-open #main-area {
      border-right-color: var(--section-divider);
    }

    #right-panel {
      display: flex;
      flex-direction: row;
      flex-shrink: 0;
      opacity: 0;
      transition: none;
    }

    body:hover #right-panel,
    body.popover-open #right-panel { opacity: 1; }

    /* Count-volume slider lives between bpm and main volume in #right-panel.
       Only visible when count mode is on. */
    #count-volume-section {
      flex: 0 0 clamp(40px, 6vw, 72px);
      height: 100%;
      border-right: 1px solid var(--section-divider);
      display: none;
    }
    body.count-mode #count-volume-section { display: block; }

    #bpm-section {
      flex: 0 0 clamp(40px, 6vw, 72px);
      height: 100%;
      border-right: 1px solid var(--section-divider);
    }

    #volume-section {
      flex: 0 0 clamp(40px, 6vw, 72px);
      height: 100%;
    }

    .fill {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      top: auto;
      width: 100%;
      height: 0%;
      background: var(--section-fill);
      z-index: 0;
      pointer-events: none;
    }

    .readout {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      z-index: 1;
      font-family: 'Reddit Mono', monospace;
      font-size: clamp(1.75rem, 6vmin, 3.5rem);
      font-weight: 600;
      text-align: center;
      pointer-events: none;
      line-height: 1.2;
      padding: 0 0.5rem;
      text-shadow:
        0 0 20px var(--bg-color),
        0 0 8px var(--bg-color),
        0 1px 2px var(--bg-color);
    }

    #main-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.25em;
    }

    #bpm-readout {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: clamp(4rem, 30vmin, 18rem);
      width: auto;
    }

    #bpm-section .readout,
    #count-volume-section .readout,
    #volume-section .readout {
      font-size: clamp(0.85rem, 2.5vw, 1.5rem);
      color: rgba(128, 128, 128, 0.7);
    }

    @keyframes bpm-blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .bpm-cursor {
      display: inline-block;
      width: 0;
      overflow: visible;
      position: relative;
    }
    .bpm-cursor::after {
      content: '';
      position: absolute;
      left: 0;
      top: 10%;
      height: 80%;
      width: 3px;
      background: currentColor;
      transform: translateX(-50%);
      animation: bpm-blink 1s step-end infinite;
    }

    .readout {
      transition: none;
    }

    body:not(.running) #bpm-readout {
      opacity: 0.35;
    }

    #visual-toggle,
    #bg-tint-toggle {
      position: fixed;
      left: 8px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(128, 128, 128, 0.25);
      color: rgba(128, 128, 128, 0.75);
      opacity: 0;
      cursor: pointer;
      font-size: 1.25rem;
      padding: 0;
      border: 1.5px solid transparent;
      transition: none;
      z-index: 10;
    }

    #visual-toggle  { bottom: 8px; }
    #bg-tint-toggle { bottom: 60px; }

    body:hover #visual-toggle,
    body:hover #bg-tint-toggle,
    body.popover-open #visual-toggle,
    body.popover-open #bg-tint-toggle { opacity: 1; }
    #visual-toggle:hover,
    #bg-tint-toggle:hover { transform: scale(1.08); }
    #visual-toggle:focus,
    #bg-tint-toggle:focus { outline: none; }
    #visual-toggle.active {
      background: var(--bg-color);
      color: var(--text-color);
      border-color: var(--text-color);
    }
    #bg-tint-toggle.active {
      background: var(--bg-color);
      color: var(--text-color);
      border-color: var(--border-color);
    }

    body.visual-mode #bpm-readout {
      transition: color 0.04s ease;
    }

    body[data-visual="1"] #bpm-readout.beat-dim { color: #808080; }
    body[data-visual="2"] #bpm-readout.beat-dim { color: #b8b8b8; }
    body[data-visual="3"] #bpm-readout.beat-dim { color: #7aaaf5; }
    body[data-visual="4"] #bpm-readout.beat-dim { color: #f57a7a; }

    body.bg-tint-mode {
      transition: background-color 0.18s ease-out;
    }
    body.bg-tint-mode[data-visual="1"].beat-dim { background-color: color-mix(in srgb, var(--bg-color) 82%, #808080); }
    body.bg-tint-mode[data-visual="2"].beat-dim { background-color: color-mix(in srgb, var(--bg-color) 82%, #b8b8b8); }
    body.bg-tint-mode[data-visual="3"].beat-dim { background-color: color-mix(in srgb, var(--bg-color) 82%, #7aaaf5); }
    body.bg-tint-mode[data-visual="4"].beat-dim { background-color: color-mix(in srgb, var(--bg-color) 82%, #f57a7a); }

    #jazz-toggle,
    #eighths-toggle,
    #sixteenths-toggle,
    #count-toggle {
      position: fixed;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(128, 128, 128, 0.25);
      color: rgba(128, 128, 128, 0.75);
      opacity: 0;
      cursor: pointer;
      font-size: 1.25rem;
      padding: 0;
      border: 1.5px solid transparent;
      transition: none;
      z-index: 10;
    }

    #sixteenths-toggle {
      left: 8px;
      top: 8px;
      font-size: 1.1rem;
    }

    #eighths-toggle {
      left: 60px;
      top: 8px;
    }

    #jazz-toggle {
      left: 112px;
      top: 8px;
    }

    #count-toggle {
      left: 8px;
      top: 60px;
      font-size: 1rem;
    }

    body:hover #jazz-toggle,
    body:hover #eighths-toggle,
    body:hover #sixteenths-toggle,
    body:hover #count-toggle,
    body.popover-open #jazz-toggle,
    body.popover-open #eighths-toggle,
    body.popover-open #sixteenths-toggle,
    body.popover-open #count-toggle {
      opacity: 1;
    }

    #jazz-toggle:hover,
    #eighths-toggle:hover,
    #sixteenths-toggle:hover,
    #count-toggle:hover {
      transform: scale(1.08);
    }

    #jazz-toggle:focus,
    #eighths-toggle:focus,
    #sixteenths-toggle:focus,
    #count-toggle:focus {
      outline: none;
    }

    #jazz-toggle.active,
    #eighths-toggle.active,
    #sixteenths-toggle.active,
    #count-toggle.active {
      background: var(--bg-color);
      color: var(--text-color);
      border-color: var(--text-color);
      transition: none;   /* snap to dim-active state without an opacity flash */
    }

    #count-input {
      position: fixed;
      left: 58px;
      top: 68px;
      width: 30px;
      height: 28px;
      padding: 0;
      font-family: 'Reddit Mono', monospace;
      font-size: 0.85rem;
      font-weight: 500;
      text-align: center;
      background: rgba(128, 128, 128, 0.22);
      color: rgba(128, 128, 128, 0.95);
      border: none;
      border-radius: 14px;
      outline: none;
      display: none;
      z-index: 10;
      opacity: 0;
      transition: none;
      -webkit-appearance: none;
      appearance: none;
    }

    #count-input::-webkit-outer-spin-button,
    #count-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    #count-input:focus {
      background: var(--bg-color);
      color: var(--text-color);
      box-shadow: 0 0 0 1.5px rgba(128, 128, 128, 0.55);
    }

    body.count-mode #count-input { display: block; }
    body:hover.count-mode #count-input,
    body.count-mode.popover-open #count-input,
    body.count-mode #count-input:focus { opacity: 1; }

    /* Count settings gear button — same recipe as the count toggle but
       smaller; shown only when count mode is on. */
    #count-settings-btn {
      position: fixed;
      left: 172px;
      top: 67px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(128, 128, 128, 0.25);
      color: rgba(128, 128, 128, 0.75);
      cursor: pointer;
      font-size: 0.95rem;
      padding: 0;
      border: 1.5px solid transparent;
      transition: none;
      opacity: 0;
      z-index: 10;
    }
    body.count-mode #count-settings-btn { display: inline-flex; }
    body:hover.count-mode:not(.popover-open) #count-settings-btn { opacity: 1; }
    #count-settings-btn:hover { transform: scale(1.08); }
    #count-settings-btn:focus { outline: none; }
    body.popover-open #count-settings-btn {
      background: var(--bg-color);
      color: var(--text-color);
      border-color: var(--text-color);
      opacity: 0.3;
      transition: none;
    }

    /* Quick subdivision mute buttons — only shown in count mode, sitting in the
       same row just past the gear. A struck-through dimmed state = muted. */
    .sub-mute-btn {
      position: fixed;
      top: 67px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(128, 128, 128, 0.25);
      color: rgba(128, 128, 128, 0.75);
      cursor: pointer;
      font-family: 'Reddit Mono', monospace;
      font-size: 0.8rem;
      padding: 0;
      border: 1.5px solid transparent;
      transition: none;
      opacity: 0;
      z-index: 10;
    }
    #mute-and-btn  { left: 96px; }
    #mute-eeah-btn { left: 134px; font-size: 0.7rem; }
    body.count-mode .sub-mute-btn { display: inline-flex; }
    body:hover.count-mode:not(.popover-open) .sub-mute-btn { opacity: 1; }
    .sub-mute-btn:hover { transform: scale(1.08); }
    .sub-mute-btn:focus { outline: none; }
    body.count-mode .sub-mute-btn.muted {
      background: var(--bg-color);
      color: var(--text-color);
      border-color: var(--text-color);
      transition: none;
    }
    body:hover.count-mode:not(.popover-open) .sub-mute-btn.muted { opacity: 0.3; }

    /* Scrim that dims the rest of the app and absorbs background clicks. */
    #count-scrim {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      z-index: 15;
    }
    #count-scrim[hidden] { display: none; }

    /* Popover */
    #count-popover {
      position: fixed;
      left: 140px;
      top: 8px;
      width: 560px;
      max-height: calc(100vh - 16px);
      overflow-y: auto;
      display: flex;
      flex-direction: row;
      gap: 16px;
      align-items: flex-start;
      z-index: 25;
      background: var(--popover-bg);
      border: 1px solid var(--section-divider);
      border-radius: 8px;
      padding: 12px;
      font-family: 'Reddit Mono', monospace;
      font-size: 0.78rem;
      color: var(--text-color);
    }
    #count-popover[hidden] { display: none; }
    .popover-col {
      flex: 1 1 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }
    #count-popover.dragging { user-select: none; }
    #count-popover .offset-cell input:not(:focus) { cursor: ew-resize; }

    .popover-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 10px;
    }
    .popover-row:last-child { margin-bottom: 0; }

    .popover-row > label {
      font-size: 0.7rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      opacity: 0.55;
    }
    #count-popover select {
      background: rgba(128, 128, 128, 0.18);
      color: var(--text-color);
      border: 1px solid var(--section-divider);
      border-radius: 4px;
      padding: 4px 6px;
      font-family: 'Reddit Mono', monospace;
      font-size: 0.78rem;
      outline: none;
      cursor: pointer;
    }
    #count-popover select:focus { box-shadow: 0 0 0 1.5px rgba(128, 128, 128, 0.55); }

    #count-offsets-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }
    .offset-cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .offset-cell .offset-label {
      font-size: 0.68rem;
      opacity: 0.6;
      background: none;
      border: none;
      color: inherit;
      cursor: pointer;
      padding: 1px 4px;
      border-radius: 3px;
      font-family: inherit;
      transition: none;
    }
    .offset-cell .offset-label:hover { opacity: 1; background: rgba(128, 128, 128, 0.18); }
    .offset-cell .offset-label:focus { outline: none; }
    .offset-cell.muted .offset-label {
      text-decoration: line-through;
      opacity: 0.3;
    }
    .offset-cell.muted input {
      opacity: 0.35;
    }
    .offset-cell input {
      width: 100%;
      padding: 3px 2px;
      font-family: 'Reddit Mono', monospace;
      font-size: 0.78rem;
      text-align: center;
      background: rgba(128, 128, 128, 0.18);
      color: var(--text-color);
      border: 1px solid var(--section-divider);
      border-radius: 4px;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
    }
    .offset-cell input::-webkit-outer-spin-button,
    .offset-cell input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .offset-cell input:focus { box-shadow: 0 0 0 1.5px rgba(128, 128, 128, 0.55); }
    .offset-cell input:not(:focus) { cursor: ew-resize; }
    .offset-cell input.scrubbing { cursor: ew-resize; }

    .offset-histogram {
      display: block;
      width: 100%;
      height: 18px;
      margin-top: 3px;
      background: rgba(128, 128, 128, 0.08);
      border-radius: 2px;
    }
    .offset-cell.muted .offset-histogram { opacity: 0.35; }

    .offset-reset {
      background: none;
      border: none;
      color: inherit;
      cursor: pointer;
      font-size: 0.7rem;
      padding: 0;
      margin-top: 2px;
      opacity: 0;
      visibility: hidden;
      font-family: 'Reddit Mono', monospace;
      transition: none;
    }
    .offset-cell.dirty .offset-reset { visibility: visible; opacity: 0.55; }
    .offset-reset:hover { opacity: 1 !important; }
    .offset-reset:focus { outline: none; }
    .offset-cell.dirty input { box-shadow: inset 0 -2px 0 rgba(122, 170, 245, 0.6); }

    .popover-actions {
      flex-direction: row !important;
      gap: 8px;
      justify-content: flex-end;
    }
    .popover-actions button {
      background: rgba(128, 128, 128, 0.18);
      color: var(--text-color);
      border: 1px solid var(--section-divider);
      border-radius: 4px;
      padding: 4px 10px;
      font-family: 'Reddit Mono', monospace;
      font-size: 0.74rem;
      cursor: pointer;
      transition: none;
    }
    .popover-actions button:hover { background: rgba(128, 128, 128, 0.32); }
    .popover-actions button:focus { outline: none; box-shadow: 0 0 0 1.5px rgba(128, 128, 128, 0.55); }

    body.count-drop-target #count-popover {
      box-shadow: 0 0 0 2px rgba(122, 170, 245, 0.65);
    }

    .popover-hint {
      font-size: 0.66rem;
      opacity: 0.45;
      line-height: 1.4;
    }

    #count-sub-offsets-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .slider-label {
      display: flex !important;
      justify-content: space-between;
      align-items: center;
      text-transform: none !important;
      letter-spacing: normal !important;
      font-size: 0.7rem !important;
    }
    .slider-label > span:last-child {
      font-family: 'Reddit Mono', monospace;
      opacity: 0.85;
    }

    .sub-volume-grid {
      display: grid;
      grid-template-columns: 28px 1fr 38px;
      gap: 4px 8px;
      align-items: center;
    }
    .sub-vol-label {
      font-family: 'Reddit Mono', monospace;
      font-size: 0.72rem;
      opacity: 0.75;
      text-align: right;
    }
    .sub-vol-readout {
      font-family: 'Reddit Mono', monospace;
      font-size: 0.7rem;
      opacity: 0.65;
      text-align: right;
    }
    .sub-vol-slider,
    #count-pitch-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      border-radius: 2px;
      background: rgba(128, 128, 128, 0.25);
      outline: none;
      cursor: pointer;
    }
    .sub-vol-slider::-webkit-slider-thumb,
    #count-pitch-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--text-color);
      cursor: pointer;
      border: none;
    }
    .sub-vol-slider::-moz-range-thumb,
    #count-pitch-slider::-moz-range-thumb {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--text-color);
      cursor: pointer;
      border: none;
    }

    body[data-visual="1"] #visual-toggle { border-color: #808080; }
    body[data-visual="2"] #visual-toggle { border-color: #b8b8b8; }
    body[data-visual="3"] #visual-toggle { border-color: #7aaaf5; }
    body[data-visual="4"] #visual-toggle { border-color: #f57a7a; }

    #visual-eye { filter: grayscale(1); }
    #bg-tint-icon { filter: grayscale(1); }

    body:hover #jazz-toggle.active,
    body:hover #eighths-toggle.active,
    body:hover #sixteenths-toggle.active,
    body:hover #count-toggle.active {
      opacity: 0.3;
    }

    .hint {
      position: fixed;
      bottom: calc(10vh + 16px);
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Reddit Mono', monospace;
      font-size: 0.75rem;
      color: var(--text-color);
      opacity: 0;
      pointer-events: none;
      white-space: nowrap;
    }

    body:hover .hint {
      opacity: 0.45;
    }

    #stopwatch-hint {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Reddit Mono', monospace;
      font-size: clamp(1rem, 4vmin, 2rem);
      color: var(--text-color);
      opacity: 0.3;
      pointer-events: none;
      white-space: nowrap;
    }
  </style>
</head>

<body>
  <div id="main-area">
    <div id="bpm-readout" class="readout">120</div>
    <div id="stopwatch-hint">00:00</div>
  </div>
  <div id="right-panel">
    <div id="bpm-section" class="control-section" aria-label="Tempo: drag vertically">
      <div id="bpm-fill" class="fill" aria-hidden="true"></div>
      <div id="bpm-strip-readout" class="readout">120 BPM</div>
    </div>
    <div id="count-volume-section" class="control-section" aria-label="Count volume: drag vertically">
      <div id="count-volume-fill" class="fill" aria-hidden="true"></div>
      <div id="count-volume-readout" class="readout">75%</div>
    </div>
    <div id="volume-section" class="control-section" aria-label="Volume: drag vertically">
      <div id="volume-fill" class="fill" aria-hidden="true"></div>
      <div id="volume-readout" class="readout">100%</div>
    </div>
  </div>

  <!-- <span class="hint">Space — start / stop · T — tap tempo</span> -->
  <button type="button" id="bg-tint-toggle" onclick="toggleBgTint()" title="Tint background on the off beat"><span id="bg-tint-icon">🖼️</span></button>
  <button type="button" id="visual-toggle" onclick="toggleVisual()" title="Visual beat mode"><span id="visual-eye">💡</span></button>
  <button type="button" id="jazz-toggle" onclick="toggleJazz()" title="Jazz mode: accent 2 & 4">♩</button>
  <button type="button" id="eighths-toggle" onclick="toggleEighths()" title="Eighths offbeat">♪</button>
  <button type="button" id="sixteenths-toggle" onclick="toggleSixteenths()" title="Sixteenths (e &amp; a)">♬</button>
  <button type="button" id="count-toggle" onclick="toggleCount()" title="Count beats out loud">🔢</button>
  <input type="text" id="count-input" inputmode="numeric" maxlength="2" value="4" aria-label="Beats per measure">
  <button type="button" id="count-settings-btn" onclick="toggleCountPopover()" aria-label="Count settings" title="Count settings">⚙</button>
  <button type="button" id="mute-and-btn" class="sub-mute-btn" onclick="toggleMuteAnd()" aria-label="Mute the &amp; count" title="Mute / unmute the &quot;&amp;&quot; count">&amp;</button>
  <button type="button" id="mute-eeah-btn" class="sub-mute-btn" onclick="toggleMuteEeAh()" aria-label="Mute the e and a counts" title="Mute / unmute the &quot;e&quot; and &quot;a&quot; counts">e a</button>

  <div id="count-scrim" hidden aria-hidden="true"></div>
  <div id="count-popover" hidden role="dialog" aria-label="Count settings">
    <div class="popover-col">
      <div class="popover-row">
        <label for="count-voice-select">Voice</label>
        <select id="count-voice-select"></select>
      </div>
      <div class="popover-row">
        <label for="count-source-select">Source</label>
        <select id="count-source-select">
          <option value="digit">Individual digits</option>
          <option value="seq">Split from sentence</option>
        </select>
      </div>
      <div class="popover-row">
        <label>Beat lead-in (ms)</label>
        <div id="count-offsets-grid"></div>
      </div>
    </div>
    <div class="popover-col">
      <div class="popover-row">
        <label>Subdivision lead-in (ms)</label>
        <div id="count-sub-offsets-grid"></div>
      </div>
      <div class="popover-row">
        <label class="slider-label">
          <span>Voice pitch / speed</span>
          <span id="count-pitch-readout">100%</span>
        </label>
        <input type="range" id="count-pitch-slider" min="50" max="200" value="100" step="1">
      </div>
      <div class="popover-row">
        <label>Subdivision volumes</label>
        <div class="sub-volume-grid">
          <span class="sub-vol-label">e</span>
          <input type="range" class="sub-vol-slider" data-sub="e" min="0" max="100" value="100">
          <span class="sub-vol-readout" data-sub="e">100%</span>
          <span class="sub-vol-label">and</span>
          <input type="range" class="sub-vol-slider" data-sub="and" min="0" max="100" value="100">
          <span class="sub-vol-readout" data-sub="and">100%</span>
          <span class="sub-vol-label">a</span>
          <input type="range" class="sub-vol-slider" data-sub="a" min="0" max="100" value="100">
          <span class="sub-vol-readout" data-sub="a">100%</span>
        </div>
      </div>
      <div class="popover-row popover-actions">
        <button type="button" id="count-reset-btn" title="Clear all saved tuning and reload built-in defaults">Reset</button>
        <button type="button" id="count-export-btn">Export…</button>
        <button type="button" id="count-import-btn">Import…</button>
        <input type="file" id="count-import-input" accept="application/json,.json" hidden>
      </div>
      <div class="popover-row popover-hint">
        Lead-in: how early the audio starts before the beat (blue line =
        beat, red = click). Drag a value to scrub, ↻ resets, click a label
        to mute. Drop a JSON anywhere to import.
      </div>
    </div>
  </div>
  <audio id="click-audio" src="click.mp3" preload="auto"></audio>
  <audio id="click-soft-audio" src="click-soft.mp3" preload="auto"></audio>

  <script>
    const BPM_MIN = 40;
    const BPM_MAX = 200;
    const STORAGE_BPM = 'metronome_bpm';
    const STORAGE_VOLUME = 'metronome_volume';
    const STORAGE_STOPWATCH = 'metronome_stopwatch_start';
    const STORAGE_JAZZ = 'metronome_jazz';
    const STORAGE_EIGHTHS = 'metronome_eighths';
    const STORAGE_SIXTEENTHS = 'metronome_sixteenths';
    const STORAGE_VISUAL = 'metronome_visual';
    const STORAGE_BG_TINT = 'metronome_bg_tint';
    const STORAGE_COUNT = 'metronome_count';
    const STORAGE_COUNT_MAX = 'metronome_count_max';
    const STORAGE_COUNT_VOLUME = 'metronome_count_volume';
    const COUNT_MIN = 1;
    const COUNT_MAX_LIMIT = 32;

    const bpmSection = document.getElementById('bpm-section');
    const volumeSection = document.getElementById('volume-section');
    const bpmFill = document.getElementById('bpm-fill');
    const volumeFill = document.getElementById('volume-fill');
    const bpmReadout = document.getElementById('bpm-readout');
    const bpmStripReadout = document.getElementById('bpm-strip-readout');
    const volumeReadout = document.getElementById('volume-readout');
    const countVolumeSection = document.getElementById('count-volume-section');
    const countVolumeFill = document.getElementById('count-volume-fill');
    const countVolumeReadout = document.getElementById('count-volume-readout');

    let bpm = 120;
    let volumePct = 100;
    let countVolumePct = 75;
    let running = false;

    let nextClickTime = 0;
    let scheduleRaf = null;

    let beatNumber = 1;
    let jazzMode = false;
    let eighthsMode = false;
    let sixteenthsMode = false;
    let subIndex = 0;   // 0 = main beat; 1..N-1 = subdivision slots within the beat
    let visualMode = 0;
    let nextVisualTime = 0;
    let visualPhase = false;
    let bgTintMode = false;
    let countMode = false;
    let countMax = 4;

    function clickNowSec() {
      return performance.now() / 1000;
    }

    let dragTarget = null;

    let tapTempoTimes = [];
    const TAP_TEMPO_TIMEOUT_MS = 2000;
    const TAP_TEMPO_MAX_SAMPLES = 8;

    let bpmTypingBuffer = '';
    let bpmTypingTimer = null;
    const BPM_TYPING_COMMIT_MS = 1500;

    function commitTypedBpm() {
      if (bpmTypingTimer != null) {
        clearTimeout(bpmTypingTimer);
        bpmTypingTimer = null;
      }
      if (bpmTypingBuffer.length > 0) {
        const val = parseInt(bpmTypingBuffer, 10);
        bpmTypingBuffer = '';
        if (Number.isFinite(val) && val >= BPM_MIN && val <= BPM_MAX) {
          setBpm(val);
          persistBpm();
        } else {
          setBpm(bpm); // restore display if out of range
        }
      }
    }

    function showBpmTyping() {
      bpmReadout.innerHTML = `${bpmTypingBuffer}<span class="bpm-cursor"></span>`;
      if (bpmTypingTimer != null) clearTimeout(bpmTypingTimer);
      bpmTypingTimer = setTimeout(commitTypedBpm, BPM_TYPING_COMMIT_MS);
    }

    function handleBpmDigit(digit) {
      bpmTypingBuffer += digit;
      if (bpmTypingBuffer.length > 3) bpmTypingBuffer = bpmTypingBuffer.slice(-3);
      showBpmTyping();
    }

    function handleBpmBackspace() {
      if (bpmTypingBuffer.length === 0) return;
      bpmTypingBuffer = bpmTypingBuffer.slice(0, -1);
      if (bpmTypingBuffer.length === 0) {
        if (bpmTypingTimer != null) { clearTimeout(bpmTypingTimer); bpmTypingTimer = null; }
        setBpm(bpm);
      } else {
        showBpmTyping();
      }
    }

    function clamp(v, lo, hi) {
      return Math.min(hi, Math.max(lo, v));
    }

    function loadStoredBpm() {
      try {
        const raw = localStorage.getItem(STORAGE_BPM);
        if (raw == null) return null;
        const n = parseFloat(raw);
        if (!Number.isFinite(n)) return null;
        return clamp(n, BPM_MIN, BPM_MAX);
      } catch (_) {
        return null;
      }
    }

    function loadStoredVolume() {
      try {
        const raw = localStorage.getItem(STORAGE_VOLUME);
        if (raw == null) return null;
        const n = parseFloat(raw);
        if (!Number.isFinite(n)) return null;
        return clamp(n, 0, 100);
      } catch (_) {
        return null;
      }
    }

    function persistBpm() {
      try {
        localStorage.setItem(STORAGE_BPM, String(bpm));
      } catch (_) {
        /* ignore */
      }
    }

    function persistVolume() {
      try {
        localStorage.setItem(STORAGE_VOLUME, String(volumePct));
      } catch (_) {
        /* ignore */
      }
    }

    function isTypingTarget(el) {
      if (!el || !el.tagName) return false;
      const tag = el.tagName;
      return tag === 'INPUT' || tag === 'TEXTAREA' || el.isContentEditable;
    }

    function handleTapTempo() {
      const now = performance.now();
      if (
        tapTempoTimes.length &&
        now - tapTempoTimes[tapTempoTimes.length - 1] > TAP_TEMPO_TIMEOUT_MS
      ) {
        tapTempoTimes = [];
      }
      tapTempoTimes.push(now);
      if (tapTempoTimes.length > TAP_TEMPO_MAX_SAMPLES) {
        tapTempoTimes.shift();
      }
      if (tapTempoTimes.length < 2) return;

      const intervals = [];
      for (let i = 1; i < tapTempoTimes.length; i++) {
        intervals.push(tapTempoTimes[i] - tapTempoTimes[i - 1]);
      }
      const avgMs = intervals.reduce((a, b) => a + b, 0) / intervals.length;
      if (avgMs < 1) return;

      const nextBpm = Math.round(60000 / avgMs);
      setBpm(nextBpm);
      persistBpm();
      startMetronome();
    }

    function bpmFromClientY(clientY) {
      const r = bpmSection.getBoundingClientRect();
      const t = r.height <= 0 ? 0.5 : (r.bottom - clientY) / r.height;
      return BPM_MIN + clamp(t, 0, 1) * (BPM_MAX - BPM_MIN);
    }

    function volumeFromClientY(clientY) {
      const r = volumeSection.getBoundingClientRect();
      const t = r.height <= 0 ? 1 : (r.bottom - clientY) / r.height;
      return clamp(t, 0, 1) * 100;
    }

    function setBpm(next, fromDrag) {
      if (fromDrag && bpmTypingBuffer.length > 0) {
        bpmTypingBuffer = '';
        if (bpmTypingTimer != null) { clearTimeout(bpmTypingTimer); bpmTypingTimer = null; }
      }
      bpm = clamp(next, BPM_MIN, BPM_MAX);
      bpmReadout.textContent = `${Math.round(bpm)}`;
      bpmStripReadout.textContent = `${Math.round(bpm)}`;
      const frac = (bpm - BPM_MIN) / (BPM_MAX - BPM_MIN);
      bpmFill.style.height = `${clamp(frac, 0, 1) * 100}%`;
    }

    function setVolumePct(next) {
      volumePct = clamp(next, 0, 100);
      volumeReadout.textContent = `${Math.round(volumePct)}%`;
      volumeFill.style.height = `${volumePct}%`;
      document.getElementById('click-audio').volume = volumePct / 100;
      document.getElementById('click-soft-audio').volume = volumePct / 100;
    }

    function setCountVolumePct(next) {
      countVolumePct = clamp(next, 0, 100);
      countVolumeReadout.textContent = `${Math.round(countVolumePct)}%`;
      countVolumeFill.style.height = `${countVolumePct}%`;
    }

    function countVolumeFromClientY(clientY) {
      const r = countVolumeSection.getBoundingClientRect();
      const t = r.height <= 0 ? 1 : (r.bottom - clientY) / r.height;
      return clamp(t, 0, 1) * 100;
    }

    function persistCountVolume() {
      try { localStorage.setItem(STORAGE_COUNT_VOLUME, String(countVolumePct)); } catch (_) {}
    }

    /** Like bell.mp3: load via <audio src>, not fetch (works with file:// open). */
    function waitClickReady() {
      const el = document.getElementById('click-audio');
      if (el.readyState >= HTMLMediaElement.HAVE_FUTURE_DATA) {
        return Promise.resolve();
      }
      return new Promise(resolve => {
        el.addEventListener(
          'canplaythrough',
          () => resolve(),
          { once: true }
        );
        el.addEventListener(
          'error',
          () => {
            console.warn('click.mp3 failed to load');
            resolve();
          },
          { once: true }
        );
      });
    }

    // Pool of warm soft-click clones so overlapping subdivision clicks can each
    // play at an independent volume (a single shared <audio> can only carry one
    // volume at a time, and restarting it cuts the previous click short).
    const subClickPool = [];
    const SUB_POOL_SIZE = 4;
    let subPoolIdx = 0;

    function initSubClickPool() {
      const base = document.getElementById('click-soft-audio');
      for (let i = 0; i < SUB_POOL_SIZE; i++) {
        const node = base.cloneNode();
        node.preload = 'auto';
        node.load();
        subClickPool.push(node);
      }
    }

    // Per-subdivision click loudness. In sixteenths the "&" (the eighth offbeat,
    // slot 2) lands at 50%; the inner "e" and "a" sit slightly under it.
    function subdivClickVol(idx, subdivCount) {
      if (subdivCount === 4) return idx === 2 ? 0.5 : 0.4;
      return 1;   // eighths offbeat keeps full volume
    }

    function playClick(when, soft, volScale = 1) {
      const delayMs = Math.max(0, (when - clickNowSec()) * 1000);
      window.setTimeout(() => {
        if (volScale !== 1 && subClickPool.length) {
          const node = subClickPool[subPoolIdx];
          subPoolIdx = (subPoolIdx + 1) % subClickPool.length;
          node.volume = clamp((volumePct / 100) * volScale, 0, 1);
          node.currentTime = 0;
          void node.play().catch(() => {});
          return;
        }
        const el = document.getElementById(soft ? 'click-soft-audio' : 'click-audio');
        el.currentTime = 0;
        void el.play().catch(() => {});
      }, delayMs);
    }

    function flashVisualBeat(when, phase) {
      const delayMs = Math.max(0, (when - clickNowSec()) * 1000);
      window.setTimeout(() => {
        bpmReadout.classList.toggle('beat-dim', phase);
        document.body.classList.toggle('beat-dim', phase);
      }, delayMs);
    }

    function scheduleLoop() {
      if (!running) return;
      const lookahead = 0.08;
      const now = clickNowSec();
      while (nextClickTime < now + lookahead) {
        const subdivCount = sixteenthsMode ? 4 : (eighthsMode ? 2 : 1);
        if (subIndex === 0) {
          const soft = jazzMode && (beatNumber === 1 || beatNumber === 3);
          playClick(nextClickTime, soft);
          if (countMode) playCountAt(beatNumber, nextClickTime);
        } else {
          playClick(nextClickTime, true, subdivClickVol(subIndex, subdivCount));
        }
        nextClickTime += (60 / bpm) / subdivCount;
        subIndex += 1;
        if (subIndex >= subdivCount) {
          subIndex = 0;
          beatNumber = (beatNumber % (countMode ? countMax : 4)) + 1;
        }
      }
      if (visualMode > 0) {
        while (nextVisualTime < now + lookahead) {
          flashVisualBeat(nextVisualTime, visualPhase);
          visualPhase = !visualPhase;
          nextVisualTime += 60 / bpm / 2;
        }
      }
      scheduleRaf = requestAnimationFrame(scheduleLoop);
    }

    function startMetronome() {
      if (running) return;
      const begin = () => {
        running = true;
        document.body.classList.add('running');
        beatNumber = 1;
        subIndex = 0;
        nextClickTime = clickNowSec() + 0.05;
        nextVisualTime = nextClickTime;
        visualPhase = false;
        bpmReadout.classList.remove('beat-dim');
        document.body.classList.remove('beat-dim');
        scheduleLoop();
      };
      void waitClickReady().then(begin, begin);
    }

    function stopMetronome() {
      running = false;
      document.body.classList.remove('running');
      bpmReadout.classList.remove('beat-dim');
      document.body.classList.remove('beat-dim');
      if (scheduleRaf != null) {
        cancelAnimationFrame(scheduleRaf);
        scheduleRaf = null;
      }
      try { speechSynthesis.cancel(); } catch (_) {}
    }

    function toggleMetronome() {
      if (running) {
        stopMetronome();
      } else {
        startMetronome();
      }
    }

    function onPointerDown(e, target) {
      dragTarget = target;
      if (target === 'bpm') {
        setBpm(bpmFromClientY(e.clientY), true);
        startMetronome();
      } else if (target === 'count-volume') {
        setCountVolumePct(countVolumeFromClientY(e.clientY));
      } else {
        setVolumePct(volumeFromClientY(e.clientY));
      }
    }

    function onPointerMove(e) {
      if (!dragTarget) return;
      if (dragTarget === 'bpm') {
        setBpm(bpmFromClientY(e.clientY), true);
        startMetronome();
      } else if (dragTarget === 'count-volume') {
        setCountVolumePct(countVolumeFromClientY(e.clientY));
      } else {
        setVolumePct(volumeFromClientY(e.clientY));
      }
    }

    function onPointerUp(e) {
      const finished = dragTarget;
      dragTarget = null;
      if (finished === 'bpm') {
        persistBpm();
      } else if (finished === 'volume') {
        persistVolume();
      } else if (finished === 'count-volume') {
        persistCountVolume();
      }
      if (e && e.currentTarget && typeof e.currentTarget.releasePointerCapture === 'function') {
        try {
          e.currentTarget.releasePointerCapture(e.pointerId);
        } catch (_) {
          /* ignore */
        }
      }
    }

    bpmSection.addEventListener('pointerdown', e => {
      bpmSection.setPointerCapture(e.pointerId);
      onPointerDown(e, 'bpm');
    });
    bpmSection.addEventListener('pointermove', e => onPointerMove(e));
    bpmSection.addEventListener('pointerup', onPointerUp);
    bpmSection.addEventListener('pointercancel', onPointerUp);

    volumeSection.addEventListener('pointerdown', e => {
      volumeSection.setPointerCapture(e.pointerId);
      onPointerDown(e, 'volume');
    });
    volumeSection.addEventListener('pointermove', e => onPointerMove(e));
    volumeSection.addEventListener('pointerup', onPointerUp);
    volumeSection.addEventListener('pointercancel', onPointerUp);

    countVolumeSection.addEventListener('pointerdown', e => {
      countVolumeSection.setPointerCapture(e.pointerId);
      onPointerDown(e, 'count-volume');
    });
    countVolumeSection.addEventListener('pointermove', e => onPointerMove(e));
    countVolumeSection.addEventListener('pointerup', onPointerUp);
    countVolumeSection.addEventListener('pointercancel', onPointerUp);

    document.addEventListener('keydown', e => {
      // Space always toggles play/pause, even when an input has focus
      // (popover offset fields, count input, etc.). Numeric inputs ignore
      // space anyway, so no usability loss.
      if (e.code === 'Space' && !e.metaKey && !e.ctrlKey && !e.altKey) {
        e.preventDefault();
        toggleMetronome();
        return;
      }
      // Escape closes the count-settings popover from anywhere.
      if (e.key === 'Escape' && countPopoverOpen) {
        e.preventDefault();
        closeCountPopover();
        return;
      }
      if (isTypingTarget(e.target)) return;
      if (e.key >= '0' && e.key <= '9' && !e.metaKey && !e.ctrlKey && !e.altKey) {
        e.preventDefault();
        handleBpmDigit(e.key);
        return;
      }
      if (e.key === 'Backspace' && bpmTypingBuffer.length > 0) {
        e.preventDefault();
        handleBpmBackspace();
        return;
      }
      if (e.key === 'Enter' && bpmTypingBuffer.length > 0) {
        e.preventDefault();
        commitTypedBpm();
        startMetronome();
        return;
      }
      if (e.key === 'Escape') {
        if (bpmTypingBuffer.length > 0) {
          e.preventDefault();
          bpmTypingBuffer = '';
          if (bpmTypingTimer != null) { clearTimeout(bpmTypingTimer); bpmTypingTimer = null; }
          setBpm(bpm);
        }
        return;
      }
      if (e.code === 'Space' || e.key === 'p' || e.key === 'P') {
        e.preventDefault();
        toggleMetronome();
        return;
      }
      if (e.key === 't' || e.key === 'T') {
        e.preventDefault();
        handleTapTempo();
        return;
      }
      if (e.key === '=' || e.key === '+') {
        e.preventDefault();
        setBpm(Math.round(bpm) + 1);
        persistBpm();
        return;
      }
      if (e.key === '-' || e.key === '_') {
        e.preventDefault();
        setBpm(Math.round(bpm) - 1);
        persistBpm();
        return;
      }
      if (e.key === ']' || e.key === '}') {
        e.preventDefault();
        setBpm(Math.round(bpm) + 5);
        persistBpm();
        return;
      }
      if (e.key === '[' || e.key === '{') {
        e.preventDefault();
        setBpm(Math.round(bpm) - 5);
        persistBpm();
        return;
      }
      if ((e.key === 'r' || e.key === 'R') && !e.metaKey && !e.ctrlKey) {
        e.preventDefault();
        resetStopwatch();
        return;
      }
    });

    function applySystemTheme() {
      document.documentElement.setAttribute('data-theme',
        window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    }

    function toggleJazz() {
      jazzMode = !jazzMode;
      document.getElementById('jazz-toggle').classList.toggle('active', jazzMode);
      try { localStorage.setItem(STORAGE_JAZZ, jazzMode ? '1' : '0'); } catch (_) {}
    }

    function toggleEighths() {
      eighthsMode = !eighthsMode;
      subIndex = 0;
      if (eighthsMode && sixteenthsMode) {
        sixteenthsMode = false;
        document.getElementById('sixteenths-toggle').classList.remove('active');
        try { localStorage.setItem(STORAGE_SIXTEENTHS, '0'); } catch (_) {}
      }
      document.getElementById('eighths-toggle').classList.toggle('active', eighthsMode);
      try { localStorage.setItem(STORAGE_EIGHTHS, eighthsMode ? '1' : '0'); } catch (_) {}
    }

    function toggleSixteenths() {
      sixteenthsMode = !sixteenthsMode;
      subIndex = 0;
      if (sixteenthsMode && eighthsMode) {
        eighthsMode = false;
        document.getElementById('eighths-toggle').classList.remove('active');
        try { localStorage.setItem(STORAGE_EIGHTHS, '0'); } catch (_) {}
      }
      document.getElementById('sixteenths-toggle').classList.toggle('active', sixteenthsMode);
      try { localStorage.setItem(STORAGE_SIXTEENTHS, sixteenthsMode ? '1' : '0'); } catch (_) {}
    }

    function toggleVisual() {
      visualMode = (visualMode + 1) % 5;
      const btn = document.getElementById('visual-toggle');
      const on = visualMode > 0;
      btn.classList.toggle('active', on);
      document.body.classList.toggle('visual-mode', on);
      if (on) {
        document.body.setAttribute('data-visual', String(visualMode));
      } else {
        document.body.removeAttribute('data-visual');
        bpmReadout.classList.remove('beat-dim');
        document.body.classList.remove('beat-dim');
      }
      if (on && running) {
        nextVisualTime = clickNowSec();
        visualPhase = false;
      }
      try { localStorage.setItem(STORAGE_VISUAL, String(visualMode)); } catch (_) {}
    }

    function toggleBgTint() {
      bgTintMode = !bgTintMode;
      document.getElementById('bg-tint-toggle').classList.toggle('active', bgTintMode);
      document.body.classList.toggle('bg-tint-mode', bgTintMode);
      try { localStorage.setItem(STORAGE_BG_TINT, bgTintMode ? '1' : '0'); } catch (_) {}
    }

    // Buffer-based count playback. Files are pre-generated by gen-counts.sh
    // and trimmed of leading/trailing silence so AudioBufferSource.start(t)
    // lands the spoken digit precisely on the beat.
    let countAudioCtx = null;
    const countBuffers = new Map();   // n -> AudioBuffer
    let countBuffersLoaded = false;

    function ensureCountAudioCtx() {
      if (!countAudioCtx) {
        try {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          countAudioCtx = new Ctx({ latencyHint: 'interactive' });
        } catch (_) {}
      } else if (countAudioCtx.state === 'suspended') {
        countAudioCtx.resume();
      }
    }

    // Configurable count source — populated from counts_final/index.json at
    // first count-mode activation. Manual per-clip ms offsets are stored
    // per (voice, source) so each combo can be tuned independently; the
    // script's offsets.json seeds suggested defaults that the user overrides
    // via the settings popover.
    const STORAGE_COUNT_VOICE = 'metronome_count_voice';
    const STORAGE_COUNT_SOURCE = 'metronome_count_source';
    const STORAGE_COUNT_OFFSETS = 'metronome_count_offsets';
    const STORAGE_COUNT_SUB_VOLUME = 'metronome_count_sub_volume';     // legacy (single value)
    const STORAGE_COUNT_SUB_VOLUMES = 'metronome_count_sub_volumes';   // new (per-syllable map)
    const STORAGE_COUNT_MUTES = 'metronome_count_mutes';
    const STORAGE_COUNT_POPOVER_POS = 'metronome_count_popover_pos';
    const STORAGE_COUNT_PITCH = 'metronome_count_pitch';

    // Built-in defaults seeded into a fresh session — derived from a couple
    // of hand-tuned exports. Each is applied to the corresponding state
    // when its localStorage key is missing.
    const COUNT_BUILTIN_DEFAULTS = {
      voice: 'en-US-AvaNeural',
      source: 'seq',
      mutes: ['5', '6', '7', '8'],
      subVolumes: {
        'en-CA-ClaraNeural': { e: 29, and: 50, a: 41 },
        'en-US-AvaNeural':   { e: 38, and: 40, a: 40 },
      },
      offsets: {
        'en-CA-ClaraNeural': {
          'count-1': 149, 'count-2': 114, 'count-3': 109, 'count-4': 44,
          'count-5': 44, 'count-6': 129, 'count-7': 154, 'count-8': 64,
          'count-9': 124, 'count-10': 84, 'count-11': 144, 'count-12': 104,
          'count-13': 54, 'count-14': 69, 'count-15': 29, 'count-16': 109,
          'count-17': 124, 'count-18': 59, 'count-19': 104, 'count-20': 94,
          'count-21': 84, 'count-22': 104, 'count-23': 104, 'count-24': 99,
          'count-25': 104, 'count-26': 84, 'count-27': 89, 'count-28': 104,
          'count-29': 89, 'count-30': 39, 'count-31': 39, 'count-32': 44,
          'seq-1': 103, 'seq-2': 56, 'seq-3': 79, 'seq-4': 34,
          'seq-5': 59, 'seq-6': 134, 'seq-7': 149, 'seq-8': 74,
          'sub-1': 154, 'sub-e': 18, 'sub-and': 18, 'sub-a': 9,
        },
        'en-US-AvaNeural': {
          'count-1': 89, 'count-2': 104, 'count-3': 89, 'count-4': 14,
          'count-5': 14, 'count-6': 89, 'count-7': 94, 'count-8': 34,
          'count-9': 109, 'count-10': 79, 'count-11': 109, 'count-12': 119,
          'count-13': 19, 'count-14': 14, 'count-15': 19, 'count-16': 74,
          'count-17': 94, 'count-18': 14, 'count-19': 59, 'count-20': 99,
          'count-21': 84, 'count-22': 94, 'count-23': 84, 'count-24': 74,
          'count-25': 74, 'count-26': 104, 'count-27': 294, 'count-28': 89,
          'count-29': 89, 'count-30': 14, 'count-31': 24, 'count-32': 19,
          'seq-1': 55, 'seq-2': 71, 'seq-3': 73, 'seq-4': 13,
          'seq-5': 24, 'seq-6': 104, 'seq-7': 104, 'seq-8': 39,
          'sub-1': 94, 'sub-e': 33, 'sub-and': 7, 'sub-a': 3,
        },
      },
    };
    const DEFAULT_OFFSET_MS = 20;
    const SUB_NAMES = ['sub-e', 'sub-and', 'sub-a'];
    const SUB_LABELS = { 'sub-e': 'e', 'sub-and': 'and', 'sub-a': 'a' };
    const SUB_KEYS = ['e', 'and', 'a'];

    let countVoice = '';
    let countSource = 'digit';        // 'digit' or 'seq'
    let countAvailableVoices = [];
    let countOffsets = {};            // { "voice:source": { name: ms } }
    let countSuggested = {};          // { voice: offsets.json contents }
    let countSubVolumes = {};         // { voice: { e, and, a } }
    let countMutes = new Set();       // mute keys: "1".."8" for beats, "e"/"and"/"a" for subs
    let countPitchPct = 100;          // 50..200 — playbackRate * 100; stretches/shrinks the clip
    let countPopoverOpen = false;

    // Migration helper: an old offsets blob keyed by "voice:source" gets
    // flattened to per-voice (legacy data fold-in).
    function migrateOffsets(raw) {
      const out = {};
      for (const key of Object.keys(raw || {})) {
        const voice = key.includes(':') ? key.split(':')[0] : key;
        if (!out[voice]) out[voice] = {};
        Object.assign(out[voice], raw[key]);
      }
      return out;
    }

    try {
      const raw = localStorage.getItem(STORAGE_COUNT_OFFSETS);
      if (raw) {
        countOffsets = migrateOffsets(JSON.parse(raw) || {});
      } else {
        // First-run default: seed with the user-tuned values bundled in.
        countOffsets = JSON.parse(JSON.stringify(COUNT_BUILTIN_DEFAULTS.offsets));
      }
    } catch (_) {
      countOffsets = JSON.parse(JSON.stringify(COUNT_BUILTIN_DEFAULTS.offsets));
    }
    try {
      const raw = localStorage.getItem(STORAGE_COUNT_MUTES);
      if (raw) {
        countMutes = new Set(JSON.parse(raw));
      } else {
        countMutes = new Set(COUNT_BUILTIN_DEFAULTS.mutes);
      }
    } catch (_) {
      countMutes = new Set(COUNT_BUILTIN_DEFAULTS.mutes);
    }

    function muteKeyForBuffer(name) {
      // count-3 / seq-3 → "3"; sub-e → "e"
      const m = name.match(/^(?:count|seq)-(\d+)$/);
      if (m) return m[1];
      if (name.startsWith('sub-')) return name.slice(4);
      return name;
    }

    function saveMutes() {
      try { localStorage.setItem(STORAGE_COUNT_MUTES, JSON.stringify([...countMutes])); } catch (_) {}
    }

    // Keep every mute affordance in agreement: the popover offset cells and the
    // two quick-toggle buttons all read from the single countMutes set.
    function syncMuteVisuals() {
      document.querySelectorAll('.offset-cell[data-mute-key]').forEach(cell => {
        cell.classList.toggle('muted', countMutes.has(cell.dataset.muteKey));
      });
      const andBtn = document.getElementById('mute-and-btn');
      const eeAhBtn = document.getElementById('mute-eeah-btn');
      if (andBtn) andBtn.classList.toggle('muted', countMutes.has('and'));
      if (eeAhBtn) eeAhBtn.classList.toggle('muted', countMutes.has('e') && countMutes.has('a'));
    }

    function toggleMuteAnd() {
      if (countMutes.has('and')) countMutes.delete('and');
      else countMutes.add('and');
      saveMutes();
      syncMuteVisuals();
    }

    function toggleMuteEeAh() {
      const bothMuted = countMutes.has('e') && countMutes.has('a');
      if (bothMuted) { countMutes.delete('e'); countMutes.delete('a'); }
      else { countMutes.add('e'); countMutes.add('a'); }
      saveMutes();
      syncMuteVisuals();
    }

    // Offsets are keyed by VOICE only (not voice+source). The buffer name
    // (count-1, seq-1, sub-e) already disambiguates the source, so the
    // same per-voice map holds digit, seq, and sub overrides side by side.
    function getOffsetMs(name) {
      const overrides = countOffsets[countVoice] || {};
      if (name in overrides) return overrides[name];
      const suggested = countSuggested[countVoice] || {};
      if (name in suggested) return suggested[name];
      return DEFAULT_OFFSET_MS;
    }

    function setOffsetMs(name, ms) {
      if (!countOffsets[countVoice]) countOffsets[countVoice] = {};
      countOffsets[countVoice][name] = ms;
      try { localStorage.setItem(STORAGE_COUNT_OFFSETS, JSON.stringify(countOffsets)); } catch (_) {}
    }

    function resetOffsetMs(name) {
      const overrides = countOffsets[countVoice];
      if (overrides && name in overrides) {
        delete overrides[name];
        if (Object.keys(overrides).length === 0) delete countOffsets[countVoice];
        try { localStorage.setItem(STORAGE_COUNT_OFFSETS, JSON.stringify(countOffsets)); } catch (_) {}
      }
    }

    function isOffsetOverridden(name) {
      const overrides = countOffsets[countVoice];
      return !!(overrides && name in overrides);
    }

    // Per-voice sub volumes.
    function getSubVolume(k) {
      const m = countSubVolumes[countVoice];
      if (m && k in m) return m[k];
      return 100;
    }

    function setSubVolume(k, v) {
      if (!countSubVolumes[countVoice]) countSubVolumes[countVoice] = { e: 100, and: 100, a: 100 };
      countSubVolumes[countVoice][k] = v;
      saveSubVolumes();
    }

    function downbeatName(n) {
      const prefix = countSource === 'seq' ? 'seq' : 'count';
      return `${prefix}-${n}`;
    }

    async function fetchCountBuffer(url, name) {
      try {
        const r = await fetch(url);
        if (!r.ok) return;
        const buf = await r.arrayBuffer();
        const audio = await countAudioCtx.decodeAudioData(buf);
        countBuffers.set(name, audio);
      } catch (_) {}
    }

    async function loadCountIndex() {
      if (countAvailableVoices.length > 0) return;
      try {
        const r = await fetch('counts_final/index.json');
        if (!r.ok) return;
        const data = await r.json();
        countAvailableVoices = data.voices || [];
      } catch (_) {}
      if (!countVoice && countAvailableVoices.length > 0) {
        countVoice = countAvailableVoices[0];
      }
      rebuildVoiceSelect();
    }

    async function loadCountSuggested(voice) {
      if (!voice || countSuggested[voice]) return;
      try {
        const r = await fetch(`counts_final/${voice}/offsets.json`);
        if (!r.ok) return;
        countSuggested[voice] = await r.json();
      } catch (_) {}
    }

    // Cached per-cell histogram data (RMS bars + duration). Computed once
    // per buffer; reset when the loaded set changes.
    const histogramCache = new Map();
    const HISTOGRAM_BARS = 80;
    // Click waveform: loaded once, overlaid on each cell at the beat marker
    // so you can see where the click's transient lands inside the count clip.
    let clickHistogram = null;   // { bars, durMs, peak }
    let clickBufferLoaded = false;

    async function loadClickHistogram() {
      if (clickBufferLoaded || !countAudioCtx) return;
      clickBufferLoaded = true;
      try {
        const r = await fetch('click.mp3');
        if (!r.ok) return;
        const arr = await r.arrayBuffer();
        const buf = await countAudioCtx.decodeAudioData(arr);
        const ch = buf.getChannelData(0);
        const sr = buf.sampleRate;
        const durMs = (buf.length / sr) * 1000;
        const bars = new Float32Array(HISTOGRAM_BARS);
        const winSize = Math.max(1, Math.floor(ch.length / HISTOGRAM_BARS));
        let peak = 0;
        for (let i = 0; i < HISTOGRAM_BARS; i++) {
          const a = i * winSize;
          const b = Math.min(a + winSize, ch.length);
          let sumSq = 0;
          for (let j = a; j < b; j++) sumSq += ch[j] * ch[j];
          const rms = b > a ? Math.sqrt(sumSq / (b - a)) : 0;
          bars[i] = rms;
          if (rms > peak) peak = rms;
        }
        clickHistogram = { bars, durMs, peak: Math.max(peak, 1e-9) };
      } catch (_) {
        clickBufferLoaded = false;  // allow retry on next attempt
      }
    }

    function getHistogramData(bufferName) {
      if (histogramCache.has(bufferName)) return histogramCache.get(bufferName);
      const buffer = countBuffers.get(bufferName);
      if (!buffer) return null;
      const ch = buffer.getChannelData(0);
      const sr = buffer.sampleRate;
      const durMs = (buffer.length / sr) * 1000;
      const winSize = Math.max(1, Math.floor(ch.length / HISTOGRAM_BARS));
      const bars = new Float32Array(HISTOGRAM_BARS);
      let peak = 0;
      for (let i = 0; i < HISTOGRAM_BARS; i++) {
        const a = i * winSize;
        const b = Math.min(a + winSize, ch.length);
        let sumSq = 0;
        for (let j = a; j < b; j++) sumSq += ch[j] * ch[j];
        const rms = b > a ? Math.sqrt(sumSq / (b - a)) : 0;
        bars[i] = rms;
        if (rms > peak) peak = rms;
      }
      const data = { bars, durMs, peak: Math.max(peak, 1e-9) };
      histogramCache.set(bufferName, data);
      return data;
    }

    function drawCellHistogram(canvas, bufferName) {
      const ctx = canvas.getContext('2d');
      // Match canvas pixel size to its CSS size for crisp drawing.
      const dpr = window.devicePixelRatio || 1;
      const cssW = canvas.clientWidth || 80;
      const cssH = canvas.clientHeight || 18;
      if (canvas.width !== Math.round(cssW * dpr) || canvas.height !== Math.round(cssH * dpr)) {
        canvas.width = Math.round(cssW * dpr);
        canvas.height = Math.round(cssH * dpr);
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, cssW, cssH);
      const data = getHistogramData(bufferName);
      if (!data) return;

      // Timeline range expands to include the marker whenever lead-in falls
      // outside [0, duration], so a negative lead-in shrinks the waveform to
      // make room for the marker on the left (and vice versa on the right).
      const leadMs = getOffsetMs(bufferName);
      const minMs = Math.min(0, leadMs);
      const maxMs = Math.max(data.durMs, leadMs);
      const rangeMs = (maxMs - minMs) || 1;
      const wavStartX = ((0 - minMs) / rangeMs) * cssW;
      const wavEndX = ((data.durMs - minMs) / rangeMs) * cssW;
      const wavW = Math.max(0, wavEndX - wavStartX);

      // Subtle zero line (clip start) when waveform isn't flush left.
      if (wavStartX > 0.5) {
        ctx.strokeStyle = 'rgba(180, 180, 180, 0.18)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(wavStartX, 0);
        ctx.lineTo(wavStartX, cssH);
        ctx.stroke();
      }
      if (wavEndX < cssW - 0.5) {
        ctx.strokeStyle = 'rgba(180, 180, 180, 0.18)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(wavEndX, 0);
        ctx.lineTo(wavEndX, cssH);
        ctx.stroke();
      }

      // RMS bars within the waveform region
      ctx.fillStyle = 'rgba(180, 180, 180, 0.42)';
      const barW = Math.max(1, wavW / data.bars.length);
      for (let i = 0; i < data.bars.length; i++) {
        const x = wavStartX + (i / data.bars.length) * wavW;
        const h = (data.bars[i] / data.peak) * cssH;
        ctx.fillRect(x, cssH - h, barW, h);
      }

      // Beat marker position (also where the click starts)
      const markerX = ((leadMs - minMs) / rangeMs) * cssW;

      // Click overlay — drawn at the same time-per-pixel scale as the
      // count, starting at the marker. Red so it reads as "this is the
      // click on top of the count word." Drawn before the marker line
      // so the line sits on top.
      if (clickHistogram) {
        const pxPerMs = cssW / rangeMs;
        const clickW = Math.max(1, clickHistogram.durMs * pxPerMs);
        const clickBarW = Math.max(1, clickW / clickHistogram.bars.length);
        ctx.fillStyle = 'rgba(245, 122, 122, 0.55)';
        for (let i = 0; i < clickHistogram.bars.length; i++) {
          const x = markerX + (i / clickHistogram.bars.length) * clickW;
          if (x < -1 || x > cssW + 1) continue;
          const h = (clickHistogram.bars[i] / clickHistogram.peak) * cssH * 0.6;
          ctx.fillRect(x, cssH - h, clickBarW, h);
        }
      }
      ctx.strokeStyle = 'rgba(122, 170, 245, 0.95)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(markerX, 0);
      ctx.lineTo(markerX, cssH);
      ctx.stroke();
    }

    let currentLoadedSet = null;
    async function loadCountBuffers() {
      ensureCountAudioCtx();
      if (!countAudioCtx) return;
      await loadCountIndex();
      if (!countVoice) return;
      await loadCountSuggested(countVoice);
      // Loaded-set key still distinguishes by source so switching digit↔seq
      // re-fetches the buffer set even though offsets are now per-voice.
      const setKey = `${countVoice}:${countSource}`;
      if (currentLoadedSet === setKey && countBuffers.size > 0) {
        await loadClickHistogram();
        renderOffsetsGrid();
        return;
      }
      countBuffers.clear();
      histogramCache.clear();
      currentLoadedSet = setKey;
      // Click waveform is voice-independent; load once whenever the audio
      // context is ready.
      const clickTask = loadClickHistogram();
      const tasks = [clickTask];
      const maxDownbeats = countSource === 'seq' ? 8 : COUNT_MAX_LIMIT;
      for (let n = 1; n <= maxDownbeats; n++) {
        const name = downbeatName(n);
        tasks.push(fetchCountBuffer(`counts_final/${countVoice}/${name}.mp3`, name));
      }
      // Subdivision syllables are voice-scoped; load alongside so toggling
      // subdivision on doesn't pause for another fetch.
      for (const sub of ['sub-1', 'sub-e', 'sub-and', 'sub-a']) {
        tasks.push(fetchCountBuffer(`counts_final/${countVoice}/${sub}.mp3`, sub));
      }
      await Promise.all(tasks);
      renderOffsetsGrid();
    }

    // Target peak-RMS for all count clips. Clips below this get boosted,
    // clips above get attenuated, so the spoken words all hit roughly the
    // same perceived loudness regardless of which voice / digit / syllable.
    // Cap on the boost prevents very quiet clips from blasting out.
    const NORMALIZE_TARGET_RMS = 0.25;
    const NORMALIZE_MAX_GAIN = 4;

    function normalizeGain(name) {
      const data = getHistogramData(name);
      if (!data || data.peak <= 0) return 1;
      return Math.min(NORMALIZE_MAX_GAIN, NORMALIZE_TARGET_RMS / data.peak);
    }

    function scheduleBuffer(name, when) {
      if (countMutes.has(muteKeyForBuffer(name))) return true;  // muted = silent success
      const buffer = countBuffers.get(name);
      if (!buffer) return false;
      // Playback rate stretches the clip — internal events (and the lead-in
      // position) compress by 1/rate when sounding. So the actual time
      // between audio start and the perceived attack shrinks accordingly.
      const rate = countPitchPct / 100;
      const shiftSec = (getOffsetMs(name) / rate) / 1000;
      const delaySec = Math.max(0, when - clickNowSec());
      const playTime = Math.max(
        countAudioCtx.currentTime,
        countAudioCtx.currentTime + delaySec - shiftSec,
      );
      const source = countAudioCtx.createBufferSource();
      source.buffer = buffer;
      source.playbackRate.value = rate;
      const gain = countAudioCtx.createGain();
      // Sub syllables get their own volume so they sit underneath the
      // downbeat number nicely.
      // Sub-syllable volumes are applied as a fraction of the master count
      // volume, scoped per voice (so each voice keeps its own e/and/a mix).
      let pct = countVolumePct;
      if (name.startsWith('sub-')) {
        const k = name.slice(4);
        if (SUB_KEYS.includes(k)) pct = (countVolumePct * getSubVolume(k)) / 100;
      }
      gain.gain.value = (pct / 100) * normalizeGain(name);
      source.connect(gain);
      gain.connect(countAudioCtx.destination);
      source.start(playTime);
      return true;
    }

    function playCountAt(n, when) {
      if (!countAudioCtx) {
        // Fallback: live speechSynthesis until buffers load.
        speechFallback(n, when);
        return;
      }
      // Always schedule all four sixteenth slots; muting handled inside
      // scheduleBuffer. Downbeat carries the beat number; e/and/a are
      // voice-shared. If the downbeat buffer is missing entirely (not
      // muted, just absent), fall back to speech for that slot.
      const sixteenth = 60 / bpm / 4;
      if (!scheduleBuffer(downbeatName(n), when)) speechFallback(n, when);
      scheduleBuffer('sub-e',   when + sixteenth);
      scheduleBuffer('sub-and', when + sixteenth * 2);
      scheduleBuffer('sub-a',   when + sixteenth * 3);
    }

    function speechFallback(n, when) {
      const delayMs = Math.max(0, (when - clickNowSec()) * 1000);
      setTimeout(() => {
        if (!countMode || !running) return;
        try {
          const u = new SpeechSynthesisUtterance(String(n));
          u.volume = countVolumePct / 100;
          u.rate = 1.4;
          speechSynthesis.speak(u);
        } catch (_) {}
      }, delayMs);
    }

    function toggleCount() {
      countMode = !countMode;
      document.getElementById('count-toggle').classList.toggle('active', countMode);
      document.body.classList.toggle('count-mode', countMode);
      if (countMode) {
        void loadCountBuffers();
      } else {
        try { speechSynthesis.cancel(); } catch (_) {}
        closeCountPopover();
      }
      if (beatNumber > countMax) beatNumber = 1;
      try { localStorage.setItem(STORAGE_COUNT, countMode ? '1' : '0'); } catch (_) {}
    }

    // ── Count settings popover ───────────────────────────────────────────
    const countPopover = document.getElementById('count-popover');
    const countVoiceSelect = document.getElementById('count-voice-select');
    const countSourceSelect = document.getElementById('count-source-select');
    const countOffsetsGrid = document.getElementById('count-offsets-grid');
    const countSubOffsetsGrid = document.getElementById('count-sub-offsets-grid');

    function saveSubVolumes() {
      try { localStorage.setItem(STORAGE_COUNT_SUB_VOLUMES, JSON.stringify(countSubVolumes)); } catch (_) {}
    }

    function applySubVolumesUi() {
      for (const k of SUB_KEYS) {
        const slider = document.querySelector(`.sub-vol-slider[data-sub="${k}"]`);
        const readout = document.querySelector(`.sub-vol-readout[data-sub="${k}"]`);
        const v = getSubVolume(k);
        if (slider) slider.value = String(v);
        if (readout) readout.textContent = `${Math.round(v)}%`;
      }
    }

    for (const k of SUB_KEYS) {
      const slider = document.querySelector(`.sub-vol-slider[data-sub="${k}"]`);
      const readout = document.querySelector(`.sub-vol-readout[data-sub="${k}"]`);
      slider.addEventListener('input', () => {
        const v = clamp(parseInt(slider.value, 10) || 0, 0, 100);
        readout.textContent = `${v}%`;
        setSubVolume(k, v);
      });
    }

    // Voice pitch / speed slider
    const countPitchSlider = document.getElementById('count-pitch-slider');
    const countPitchReadout = document.getElementById('count-pitch-readout');
    function applyPitchUi() {
      countPitchSlider.value = String(countPitchPct);
      countPitchReadout.textContent = `${countPitchPct}%`;
    }
    countPitchSlider.addEventListener('input', () => {
      countPitchPct = clamp(parseInt(countPitchSlider.value, 10) || 100, 50, 200);
      countPitchReadout.textContent = `${countPitchPct}%`;
      try { localStorage.setItem(STORAGE_COUNT_PITCH, String(countPitchPct)); } catch (_) {}
    });

    function rebuildVoiceSelect() {
      countVoiceSelect.innerHTML = '';
      for (const v of countAvailableVoices) {
        const opt = document.createElement('option');
        opt.value = v;
        opt.textContent = v.replace(/Neural$/, '').replace(/^en-/, '');
        countVoiceSelect.appendChild(opt);
      }
      if (countVoice) countVoiceSelect.value = countVoice;
    }

    // Click+drag scrubbing on a numeric input. 1 ms/px, or 10 ms/px with
    // Shift held. A pure click (no movement) focuses the input for typing;
    // a drag changes the value without taking focus, so you can immediately
    // scrub another cell without tabbing/clicking away.
    function attachScrubber(input, onCommit) {
      let scrubbing = false;
      let moved = false;
      let startX = 0;
      let startValue = 0;
      input.addEventListener('pointerdown', e => {
        if (e.button !== 0) return;
        if (document.activeElement === input) return;  // already typing
        scrubbing = true;
        moved = false;
        startX = e.clientX;
        startValue = parseInt(input.value, 10);
        if (!Number.isFinite(startValue)) startValue = 0;
        input.setPointerCapture(e.pointerId);
        input.classList.add('scrubbing');
        e.preventDefault();   // suppress focus so a non-drag click can choose later
      });
      input.addEventListener('pointermove', e => {
        if (!scrubbing) return;
        const dx = e.clientX - startX;
        if (Math.abs(dx) >= 3) moved = true;
        const step = e.shiftKey ? 10 : 1;
        onCommit(Math.round(startValue + dx * step));
      });
      const finish = (e) => {
        if (!scrubbing) return;
        scrubbing = false;
        input.classList.remove('scrubbing');
        try { input.releasePointerCapture(e.pointerId); } catch (_) {}
        if (!moved) { input.focus(); input.select(); }
      };
      input.addEventListener('pointerup', finish);
      input.addEventListener('pointercancel', finish);
    }

    function makeOffsetCell(bufferName, labelText) {
      const cell = document.createElement('div');
      cell.className = 'offset-cell';
      const muteKey = muteKeyForBuffer(bufferName);
      cell.dataset.muteKey = muteKey;
      const lbl = document.createElement('button');
      lbl.type = 'button';
      lbl.className = 'offset-label';
      lbl.textContent = labelText;
      lbl.title = 'Click to mute / unmute';
      const refreshMuteVisual = () => {
        cell.classList.toggle('muted', countMutes.has(muteKey));
      };
      refreshMuteVisual();
      lbl.addEventListener('click', () => {
        if (countMutes.has(muteKey)) countMutes.delete(muteKey);
        else countMutes.add(muteKey);
        saveMutes();
        syncMuteVisuals();
      });
      const input = document.createElement('input');
      input.type = 'text';
      input.inputMode = 'numeric';
      input.value = String(getOffsetMs(bufferName));
      const canvas = document.createElement('canvas');
      canvas.className = 'offset-histogram';
      canvas.title = 'Waveform — blue line marks where the beat lands';
      const refreshDirty = () => cell.classList.toggle('dirty', isOffsetOverridden(bufferName));
      refreshDirty();
      const redrawHistogram = () => drawCellHistogram(canvas, bufferName);
      const commit = (v) => {
        setOffsetMs(bufferName, v);
        input.value = String(v);
        redrawHistogram();
        refreshDirty();
      };
      input.addEventListener('change', () => {
        const v = parseInt(input.value, 10);
        if (Number.isFinite(v)) commit(v);
        else input.value = String(getOffsetMs(bufferName));
      });
      input.addEventListener('keydown', e => {
        if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
          e.preventDefault();
          const step = e.shiftKey ? 50 : 10;
          const dir = e.key === 'ArrowUp' ? 1 : -1;
          const cur = parseInt(input.value, 10);
          const base = Number.isFinite(cur) ? cur : getOffsetMs(bufferName);
          commit(base + dir * step);
          return;
        }
        if (e.key === 'Enter') input.blur();
        e.stopPropagation();
      });
      attachScrubber(input, commit);
      const resetBtn = document.createElement('button');
      resetBtn.type = 'button';
      resetBtn.className = 'offset-reset';
      resetBtn.textContent = '↻ reset';
      resetBtn.title = 'Reset to suggested value';
      resetBtn.addEventListener('click', () => {
        resetOffsetMs(bufferName);
        input.value = String(getOffsetMs(bufferName));
        redrawHistogram();
        refreshDirty();
      });
      cell.appendChild(lbl);
      cell.appendChild(input);
      cell.appendChild(canvas);
      cell.appendChild(resetBtn);
      // Defer initial draw — canvas needs to be in the DOM so clientWidth
      // is known. requestAnimationFrame is enough.
      requestAnimationFrame(redrawHistogram);
      return cell;
    }

    function renderOffsetsGrid() {
      countOffsetsGrid.innerHTML = '';
      for (let n = 1; n <= 8; n++) {
        countOffsetsGrid.appendChild(makeOffsetCell(downbeatName(n), String(n)));
      }
      countSubOffsetsGrid.innerHTML = '';
      for (const name of SUB_NAMES) {
        countSubOffsetsGrid.appendChild(makeOffsetCell(name, SUB_LABELS[name]));
      }
      syncMuteVisuals();
    }

    function toggleCountPopover() {
      if (countPopoverOpen) closeCountPopover();
      else openCountPopover();
    }

    const countScrim = document.getElementById('count-scrim');

    function openCountPopover() {
      countPopoverOpen = true;
      countPopover.hidden = false;
      countScrim.hidden = false;
      document.body.classList.add('popover-open');
      void loadCountBuffers();  // also rebuilds index + offsets
      renderOffsetsGrid();
      countSourceSelect.value = countSource;
      applySubVolumesUi();
      applyPitchUi();
    }

    function closeCountPopover() {
      countPopoverOpen = false;
      countPopover.hidden = true;
      countScrim.hidden = true;
      document.body.classList.remove('popover-open');
    }

    // Scrim absorbs background clicks so they don't trigger underlying UI
    // (volume drag, bpm drag, etc.) — clicking it just closes the popover.
    countScrim.addEventListener('pointerdown', e => {
      e.stopPropagation();
      e.preventDefault();
      closeCountPopover();
    });
    (window).toggleCountPopover = toggleCountPopover;

    countVoiceSelect.addEventListener('change', async () => {
      countVoice = countVoiceSelect.value;
      try { localStorage.setItem(STORAGE_COUNT_VOICE, countVoice); } catch (_) {}
      applySubVolumesUi();   // refresh sliders for new voice
      await loadCountBuffers();
    });
    countSourceSelect.addEventListener('change', async () => {
      countSource = countSourceSelect.value;
      try { localStorage.setItem(STORAGE_COUNT_SOURCE, countSource); } catch (_) {}
      await loadCountBuffers();
    });
    // ── Drag the popover by its empty space ─────────────────────────────
    let popoverDragging = false;
    let popoverDragStartX = 0, popoverDragStartY = 0;
    let popoverStartLeft = 0, popoverStartTop = 0;

    countPopover.addEventListener('pointerdown', e => {
      if (e.button !== 0) return;
      // Only grab when clicking on inert chrome — not inputs, buttons,
      // selects, canvases, or sliders.
      if (e.target.closest('input, button, select, canvas, .sub-vol-slider')) return;
      popoverDragging = true;
      popoverDragStartX = e.clientX;
      popoverDragStartY = e.clientY;
      const r = countPopover.getBoundingClientRect();
      popoverStartLeft = r.left;
      popoverStartTop = r.top;
      countPopover.classList.add('dragging');
      countPopover.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    countPopover.addEventListener('pointermove', e => {
      if (!popoverDragging) return;
      const dx = e.clientX - popoverDragStartX;
      const dy = e.clientY - popoverDragStartY;
      const maxLeft = window.innerWidth - countPopover.offsetWidth - 4;
      const maxTop = window.innerHeight - countPopover.offsetHeight - 4;
      countPopover.style.left = clamp(popoverStartLeft + dx, 4, Math.max(4, maxLeft)) + 'px';
      countPopover.style.top  = clamp(popoverStartTop + dy, 4, Math.max(4, maxTop)) + 'px';
    });
    const endPopoverDrag = (e) => {
      if (!popoverDragging) return;
      popoverDragging = false;
      countPopover.classList.remove('dragging');
      try { countPopover.releasePointerCapture(e.pointerId); } catch (_) {}
      savePopoverPos();
    };

    function savePopoverPos() {
      try {
        localStorage.setItem(STORAGE_COUNT_POPOVER_POS, JSON.stringify({
          left: parseFloat(countPopover.style.left) || 140,
          top:  parseFloat(countPopover.style.top)  || 8,
        }));
      } catch (_) {}
    }

    function restorePopoverPos(pos) {
      if (!pos || typeof pos !== 'object') return;
      if (Number.isFinite(pos.left)) countPopover.style.left = `${pos.left}px`;
      if (Number.isFinite(pos.top))  countPopover.style.top  = `${pos.top}px`;
    }
    countPopover.addEventListener('pointerup', endPopoverDrag);
    countPopover.addEventListener('pointercancel', endPopoverDrag);

    // Click outside the popover (but not on the gear) closes it.
    document.addEventListener('pointerdown', e => {
      if (!countPopoverOpen) return;
      if (countPopover.contains(e.target)) return;
      if (e.target.closest && e.target.closest('#count-settings-btn')) return;
      closeCountPopover();
    });

    // ── Export / Import ─────────────────────────────────────────────────
    async function exportCountSettings() {
      // Make sure suggested values are loaded for every voice, so the
      // exported file is a fully-baked snapshot — re-importing on a fresh
      // device gives identical behavior, even for voices not yet tuned.
      await loadCountIndex();
      for (const v of countAvailableVoices) await loadCountSuggested(v);

      const allVoices = new Set([
        ...countAvailableVoices,
        ...Object.keys(countOffsets),
        ...Object.keys(countSubVolumes),
      ]);
      const fullOffsets = {};
      const fullSubVolumes = {};
      for (const v of allVoices) {
        // Effective offsets = suggested ∪ user overrides (overrides win).
        fullOffsets[v] = {
          ...(countSuggested[v] || {}),
          ...(countOffsets[v] || {}),
        };
        fullSubVolumes[v] = countSubVolumes[v]
          || (COUNT_BUILTIN_DEFAULTS.subVolumes[v] && { ...COUNT_BUILTIN_DEFAULTS.subVolumes[v] })
          || { e: 100, and: 100, a: 100 };
      }

      const data = {
        format: 'metronome-count-settings',
        version: 1,
        exportedAt: new Date().toISOString(),
        voice: countVoice,                 // applied as active on import
        source: countSource,
        pitch: countPitchPct,
        mutes: [...countMutes],
        offsets: fullOffsets,
        subVolumes: fullSubVolumes,
        popoverPos: {
          left: parseFloat(countPopover.style.left) || null,
          top:  parseFloat(countPopover.style.top)  || null,
        },
      };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const stamp = new Date().toISOString().slice(0, 10);
      const a = document.createElement('a');
      a.href = url;
      a.download = `metronome-counts-${stamp}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    async function applyImported(data) {
      if (!data || data.format !== 'metronome-count-settings') {
        alert('Not a metronome count settings file (missing format=metronome-count-settings).');
        return;
      }
      if (data.offsets && typeof data.offsets === 'object') {
        countOffsets = migrateOffsets(data.offsets);  // handles legacy voice:source keys
        try { localStorage.setItem(STORAGE_COUNT_OFFSETS, JSON.stringify(countOffsets)); } catch (_) {}
      }
      if (Array.isArray(data.mutes)) {
        countMutes = new Set(data.mutes);
        saveMutes();
      }
      if (data.subVolumes && typeof data.subVolumes === 'object') {
        const isPerVoice = Object.values(data.subVolumes).some(v => v && typeof v === 'object');
        if (isPerVoice) {
          countSubVolumes = data.subVolumes;
        } else {
          // Old per-syllable global → fold into current voice.
          countSubVolumes[countVoice] = { e: 100, and: 100, a: 100 };
          for (const k of SUB_KEYS) {
            const v = data.subVolumes[k];
            if (Number.isFinite(v)) countSubVolumes[countVoice][k] = clamp(v, 0, 100);
          }
        }
        saveSubVolumes();
        applySubVolumesUi();
      } else if (Number.isFinite(data.subVolume)) {
        // Legacy single value → apply to current voice for all syllables.
        const v = clamp(data.subVolume, 0, 100);
