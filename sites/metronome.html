        countSubVolumes[countVoice] = { e: v, and: v, a: v };
        saveSubVolumes();
        applySubVolumesUi();
      }
      if (data.source === 'digit' || data.source === 'seq') {
        countSource = data.source;
        countSourceSelect.value = countSource;
        try { localStorage.setItem(STORAGE_COUNT_SOURCE, countSource); } catch (_) {}
      }
      if (typeof data.voice === 'string') {
        countVoice = data.voice;
        countVoiceSelect.value = countVoice;
        try { localStorage.setItem(STORAGE_COUNT_VOICE, countVoice); } catch (_) {}
      }
      if (Number.isFinite(data.pitch)) {
        countPitchPct = clamp(data.pitch, 50, 200);
        try { localStorage.setItem(STORAGE_COUNT_PITCH, String(countPitchPct)); } catch (_) {}
        applyPitchUi();
      }
      if (data.popoverPos) {
        restorePopoverPos(data.popoverPos);
        savePopoverPos();
      }
      await loadCountBuffers();   // refreshes grid + histograms with applied state
    }

    function resetCountSettings() {
      if (!confirm('Reset all count settings (voice, source, offsets, volumes, mutes, popover position) to the built-in defaults? Your saved tuning will be lost.')) return;
      const keys = [
        STORAGE_COUNT_VOICE,
        STORAGE_COUNT_SOURCE,
        STORAGE_COUNT_OFFSETS,
        STORAGE_COUNT_MUTES,
        STORAGE_COUNT_SUB_VOLUMES,
        STORAGE_COUNT_SUB_VOLUME,    // legacy
        STORAGE_COUNT_POPOVER_POS,
        STORAGE_COUNT_PITCH,
      ];
      for (const k of keys) { try { localStorage.removeItem(k); } catch (_) {} }

      countVoice = COUNT_BUILTIN_DEFAULTS.voice;
      countSource = COUNT_BUILTIN_DEFAULTS.source;
      countOffsets = JSON.parse(JSON.stringify(COUNT_BUILTIN_DEFAULTS.offsets));
      countMutes = new Set(COUNT_BUILTIN_DEFAULTS.mutes);
      countSubVolumes = JSON.parse(JSON.stringify(COUNT_BUILTIN_DEFAULTS.subVolumes));
      countPitchPct = 100;

      // Pop the popover back to its default position too.
      countPopover.style.left = '140px';
      countPopover.style.top = '8px';

      countVoiceSelect.value = countVoice;
      countSourceSelect.value = countSource;
      applySubVolumesUi();
      applyPitchUi();
      syncMuteVisuals();
      void loadCountBuffers();   // re-renders grid + histograms
    }

    document.getElementById('count-reset-btn').addEventListener('click', resetCountSettings);
    document.getElementById('count-export-btn').addEventListener('click', () => {
      exportCountSettings().catch(e => alert(`Export failed: ${e.message ?? e}`));
    });
    const importFileInput = document.getElementById('count-import-input');
    document.getElementById('count-import-btn').addEventListener('click', () => importFileInput.click());
    importFileInput.addEventListener('change', async () => {
      const file = importFileInput.files && importFileInput.files[0];
      importFileInput.value = '';   // allow re-import of same file
      if (!file) return;
      try {
        const text = await file.text();
        await applyImported(JSON.parse(text));
      } catch (e) {
        alert(`Import failed: ${e.message ?? e}`);
      }
    });

    // Drag-drop anywhere on the page applies a settings JSON.
    let dragDepth = 0;
    document.addEventListener('dragenter', e => {
      if (!e.dataTransfer || !e.dataTransfer.types || !e.dataTransfer.types.includes('Files')) return;
      e.preventDefault();
      dragDepth++;
      if (!countPopoverOpen) openCountPopover();
      document.body.classList.add('count-drop-target');
    });
    document.addEventListener('dragover', e => {
      if (!e.dataTransfer || !e.dataTransfer.types || !e.dataTransfer.types.includes('Files')) return;
      e.preventDefault();
    });
    document.addEventListener('dragleave', () => {
      dragDepth--;
      if (dragDepth <= 0) {
        dragDepth = 0;
        document.body.classList.remove('count-drop-target');
      }
    });
    document.addEventListener('drop', async e => {
      dragDepth = 0;
      document.body.classList.remove('count-drop-target');
      const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (!file) return;
      if (!file.name.toLowerCase().endsWith('.json') && file.type !== 'application/json') return;
      e.preventDefault();
      try {
        const text = await file.text();
        await applyImported(JSON.parse(text));
      } catch (err) {
        alert(`Import failed: ${err.message ?? err}`);
      }
    });

    function setCountMax(next) {
      countMax = clamp(Math.round(next), COUNT_MIN, COUNT_MAX_LIMIT);
      document.getElementById('count-input').value = String(countMax);
      if (beatNumber > countMax) beatNumber = 1;
      try { localStorage.setItem(STORAGE_COUNT_MAX, String(countMax)); } catch (_) {}
    }

    const countInput = document.getElementById('count-input');
    countInput.addEventListener('input', () => {
      countInput.value = countInput.value.replace(/[^0-9]/g, '');
    });
    countInput.addEventListener('change', () => {
      const val = parseInt(countInput.value, 10);
      if (Number.isFinite(val) && val >= COUNT_MIN && val <= COUNT_MAX_LIMIT) {
        setCountMax(val);
      } else {
        countInput.value = String(countMax);
      }
    });
    countInput.addEventListener('blur', () => {
      const val = parseInt(countInput.value, 10);
      if (!Number.isFinite(val) || val < COUNT_MIN || val > COUNT_MAX_LIMIT) {
        countInput.value = String(countMax);
      } else if (val !== countMax) {
        setCountMax(val);
      }
    });
    countInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') { countInput.blur(); }
      e.stopPropagation();
    });


    applySystemTheme();
    initSubClickPool();

    try {
      if (localStorage.getItem(STORAGE_JAZZ) === '1') {
        jazzMode = true;
        document.getElementById('jazz-toggle').classList.add('active');
      }
      if (localStorage.getItem(STORAGE_EIGHTHS) === '1') {
        eighthsMode = true;
        document.getElementById('eighths-toggle').classList.add('active');
      }
      if (localStorage.getItem(STORAGE_SIXTEENTHS) === '1' && !eighthsMode) {
        sixteenthsMode = true;
        document.getElementById('sixteenths-toggle').classList.add('active');
      }
      const savedVisual = parseInt(localStorage.getItem(STORAGE_VISUAL) || '0', 10);
      if (savedVisual >= 1 && savedVisual <= 4) {
        visualMode = savedVisual;
        document.getElementById('visual-toggle').classList.add('active');
        document.body.classList.add('visual-mode');
        document.body.setAttribute('data-visual', String(visualMode));
      }
      if (localStorage.getItem(STORAGE_BG_TINT) === '1') {
        bgTintMode = true;
        document.getElementById('bg-tint-toggle').classList.add('active');
        document.body.classList.add('bg-tint-mode');
      }
      const savedCountMax = parseInt(localStorage.getItem(STORAGE_COUNT_MAX) || '4', 10);
      if (Number.isFinite(savedCountMax) && savedCountMax >= COUNT_MIN && savedCountMax <= COUNT_MAX_LIMIT) {
        countMax = savedCountMax;
      }
      document.getElementById('count-input').value = String(countMax);
      // Restore popover-controlled state (with built-in defaults when missing).
      const savedVoice = localStorage.getItem(STORAGE_COUNT_VOICE);
      countVoice = savedVoice || COUNT_BUILTIN_DEFAULTS.voice;
      const savedSource = localStorage.getItem(STORAGE_COUNT_SOURCE);
      countSource = (savedSource === 'digit' || savedSource === 'seq') ? savedSource : COUNT_BUILTIN_DEFAULTS.source;
      countSourceSelect.value = countSource;
      // Restore per-voice sub volumes. If we find:
      //   - a per-voice map (new format) → use it
      //   - just the global object (older format) → fold into the current voice
      //   - the legacy single value → apply to all voices
      //   - nothing → seed from built-in defaults
      try {
        const raw = localStorage.getItem(STORAGE_COUNT_SUB_VOLUMES);
        if (raw) {
          const parsed = JSON.parse(raw);
          const isPerVoice = parsed && typeof parsed === 'object'
            && Object.values(parsed).some(v => v && typeof v === 'object');
          if (isPerVoice) {
            countSubVolumes = parsed;
          } else if (parsed && typeof parsed === 'object') {
            countSubVolumes[countVoice] = { e: 100, and: 100, a: 100 };
            for (const k of SUB_KEYS) {
              if (Number.isFinite(parsed[k])) countSubVolumes[countVoice][k] = clamp(parsed[k], 0, 100);
            }
            saveSubVolumes();
          }
        } else {
          const legacy = parseFloat(localStorage.getItem(STORAGE_COUNT_SUB_VOLUME) ?? '');
          if (Number.isFinite(legacy)) {
            const v = clamp(legacy, 0, 100);
            // Apply legacy global value to all voices we know about.
            for (const voice of Object.keys(COUNT_BUILTIN_DEFAULTS.subVolumes)) {
              countSubVolumes[voice] = { e: v, and: v, a: v };
            }
            saveSubVolumes();
          } else {
            countSubVolumes = JSON.parse(JSON.stringify(COUNT_BUILTIN_DEFAULTS.subVolumes));
          }
        }
      } catch (_) {
        countSubVolumes = JSON.parse(JSON.stringify(COUNT_BUILTIN_DEFAULTS.subVolumes));
      }
      applySubVolumesUi();
      const savedPitch = parseFloat(localStorage.getItem(STORAGE_COUNT_PITCH) ?? '');
      if (Number.isFinite(savedPitch)) countPitchPct = clamp(savedPitch, 50, 200);
      applyPitchUi();
      try {
        const raw = localStorage.getItem(STORAGE_COUNT_POPOVER_POS);
        if (raw) restorePopoverPos(JSON.parse(raw));
      } catch (_) {}
      if (localStorage.getItem(STORAGE_COUNT) === '1') {
        countMode = true;
        document.getElementById('count-toggle').classList.add('active');
        document.body.classList.add('count-mode');
        // Fire-and-forget — fetch the audio now; AudioContext will be
        // created/resumed on the first user gesture (a click handler exists
        // for unrelated buttons anyway).
        void loadCountBuffers();
      }
    } catch (_) {}

    syncMuteVisuals();

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applySystemTheme);

    const storedBpm = loadStoredBpm();
    const storedVolume = loadStoredVolume();
    if (storedBpm !== null) {
      bpm = storedBpm;
    }
    if (storedVolume !== null) {
      volumePct = storedVolume;
    }
    try {
      const raw = localStorage.getItem(STORAGE_COUNT_VOLUME);
      if (raw != null) {
        const n = parseFloat(raw);
        if (Number.isFinite(n)) countVolumePct = clamp(n, 0, 100);
      }
    } catch (_) {}
    setBpm(bpm);
    setVolumePct(volumePct);
    setCountVolumePct(countVolumePct);

    // --- Stopwatch ---
    const stopwatchHint = document.getElementById('stopwatch-hint');

    function loadStopwatchStart() {
      try {
        const raw = localStorage.getItem(STORAGE_STOPWATCH);
        if (raw == null) return null;
        const n = parseInt(raw, 10);
        if (!Number.isFinite(n)) return null;
        return n;
      } catch (_) {
        return null;
      }
    }

    function saveStopwatchStart(ts) {
      try {
        localStorage.setItem(STORAGE_STOPWATCH, String(ts));
      } catch (_) { /* ignore */ }
    }

    function resetStopwatch() {
      stopwatchStart = Date.now();
      saveStopwatchStart(stopwatchStart);
      updateStopwatch();
    }

    function updateStopwatch() {
      const elapsedSec = Math.floor((Date.now() - stopwatchStart) / 1000);
      const h = Math.floor(elapsedSec / 3600);
      const m = Math.floor((elapsedSec % 3600) / 60);
      const s = elapsedSec % 60;
      if (h > 0) {
        stopwatchHint.textContent =
          `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      } else {
        stopwatchHint.textContent =
          `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      }
    }

    let stopwatchStart = loadStopwatchStart();
    if (stopwatchStart === null) {
      stopwatchStart = Date.now();
      saveStopwatchStart(stopwatchStart);
    }
    updateStopwatch();
    setInterval(updateStopwatch, 1000);
  </script>
