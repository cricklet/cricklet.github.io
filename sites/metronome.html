<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metronome</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reddit+Mono&display=swap">

  <style>
    :root {
      --bg-color: #1a1a1a;
      --text-color: rgba(255, 255, 255, 0.87);
      --border-color: rgba(255, 255, 255, 0.35);
      --section-track: transparent;
      --section-fill: rgba(255, 255, 255, 0.07);
      --section-divider: rgba(255, 255, 255, 0.1);
    }

    :root[data-theme="light"] {
      --bg-color: #f0f0f0;
      --text-color: #000000;
      --border-color: rgba(0, 0, 0, 0.28);
      --section-track: transparent;
      --section-fill: rgba(0, 0, 0, 0.045);
      --section-divider: rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
      height: 100dvh;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    /*
     * Colors only reflect window focus (.focused / .unfocused). Playing does not change the palette.
     * First click after click-to-focus is swallowed in JS so it doesn’t move BPM / volume / start.
     */
    :root[data-theme="light"] body.focused {
      --bg-color: #f2f2f4;
      --text-color: rgba(0, 0, 0, 0.82);
      --section-fill: rgba(0, 0, 0, 0.05);
      --section-divider: rgba(0, 0, 0, 0.09);
    }

    :root[data-theme="light"] body.unfocused {
      --bg-color: #ddd;
      --text-color: #666;
    }

    :root[data-theme="dark"] body.focused {
      --bg-color: #252528;
      --text-color: rgba(255, 255, 255, 0.84);
      --section-fill: rgba(255, 255, 255, 0.07);
      --section-divider: rgba(255, 255, 255, 0.12);
    }

    :root[data-theme="dark"] body.unfocused {
      --bg-color: #1f1f23;
      --text-color: rgba(255, 255, 255, 0.58);
      --section-fill: rgba(255, 255, 255, 0.05);
      --section-divider: rgba(255, 255, 255, 0.078);
    }

    .control-section {
      position: relative;
      width: 100%;
      flex-shrink: 0;
      background: var(--section-track);
      overflow: hidden;
      cursor: pointer;
      touch-action: none;
    }

    #bpm-section {
      flex: 9 1 0;
      min-height: 0;
      border-bottom: 1px solid var(--section-divider);
    }

    #volume-section {
      flex: 1 1 0;
      min-height: 0;
    }

    .fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 0%;
      background: var(--section-fill);
      z-index: 0;
      pointer-events: none;
    }

    .readout {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      z-index: 1;
      font-family: 'Reddit Mono', monospace;
      font-size: clamp(1.75rem, 6vmin, 3.5rem);
      font-weight: 600;
      text-align: center;
      pointer-events: none;
      line-height: 1.2;
      padding: 0 0.5rem;
      text-shadow:
        0 0 20px var(--bg-color),
        0 0 8px var(--bg-color),
        0 1px 2px var(--bg-color);
    }

    #bpm-section .readout {
      font-size: clamp(2.75rem, 14vmin, 7.5rem);
    }

    #volume-section .readout {
      font-size: clamp(1.25rem, 4vmin, 2.25rem);
    }

    #theme-toggle {
      position: fixed;
      bottom: calc(10vh + 16px);
      right: 16px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--text-color);
      color: var(--bg-color);
      opacity: 0;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
      font-size: 1.5rem;
      padding: 0;
      border: none;
      z-index: 10;
    }

    body:hover #theme-toggle {
      opacity: 1;
    }

    #theme-toggle:hover {
      transform: scale(1.08);
    }

    .hint {
      position: fixed;
      bottom: calc(10vh + 16px);
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Reddit Mono', monospace;
      font-size: 0.75rem;
      color: var(--text-color);
      opacity: 0;
      pointer-events: none;
      white-space: nowrap;
    }

    body:hover .hint {
      opacity: 0.45;
    }

    #stopwatch-hint {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Reddit Mono', monospace;
      font-size: clamp(1.2rem, 3.6vmin, 1.7rem);
      color: var(--text-color);
      opacity: 0.3;
      pointer-events: none;
      z-index: 1;
      white-space: nowrap;
    }
  </style>
</head>

<body>
  <div id="bpm-section" class="control-section" aria-label="Tempo: drag horizontally">
    <div id="bpm-fill" class="fill" aria-hidden="true"></div>
    <div id="bpm-readout" class="readout">120 BPM</div>
    <div id="stopwatch-hint">00:00</div>
  </div>
  <div id="volume-section" class="control-section" aria-label="Volume: drag horizontally">
    <div id="volume-fill" class="fill" aria-hidden="true"></div>
    <div id="volume-readout" class="readout">100%</div>
  </div>

  <!-- <span class="hint">Space — start / stop · T — tap tempo</span> -->
  <button type="button" id="theme-toggle" onclick="toggleTheme()" title="Theme">◑</button>
  <audio id="click-audio" src="click.mp3" preload="auto"></audio>

  <script>
    const BPM_MIN = 40;
    const BPM_MAX = 200;
    const STORAGE_BPM = 'metronome_bpm';
    const STORAGE_VOLUME = 'metronome_volume';
    const STORAGE_THEME = 'metronome_theme';
    const STORAGE_STOPWATCH = 'metronome_stopwatch_start';

    const bpmSection = document.getElementById('bpm-section');
    const volumeSection = document.getElementById('volume-section');
    const bpmFill = document.getElementById('bpm-fill');
    const volumeFill = document.getElementById('volume-fill');
    const bpmReadout = document.getElementById('bpm-readout');
    const volumeReadout = document.getElementById('volume-readout');

    let bpm = 120;
    let volumePct = 100;
    let running = false;

    let nextClickTime = 0;
    let scheduleRaf = null;

    /** Seconds; monotonic clock for scheduling (no Web Audio — avoids file:// + MediaElementSource silence). */
    function clickNowSec() {
      return performance.now() / 1000;
    }

    let dragTarget = null;

    let swallowFirstControlPointer = false;
    /** After swallowing pointerdown, block mousedown/click in the same gesture (those still fire). */
    let absorbingRefocusClick = false;
    let swallowPointerTimer = null;
    /**
     * Set when the tab/document just became visible (tab switch). If focus runs in the same
     * activation, we must not arm swallow so the first tap still controls the metronome.
     * Cleared on focus after handling, or on hidden.
     */
    let documentJustBecameVisible = false;
    let windowEverBlurred = false;
    const SWALLOW_POINTER_FALLBACK_MS = 400;

    let tapTempoTimes = [];
    const TAP_TEMPO_TIMEOUT_MS = 2000;
    const TAP_TEMPO_MAX_SAMPLES = 8;

    function clamp(v, lo, hi) {
      return Math.min(hi, Math.max(lo, v));
    }

    function loadStoredBpm() {
      try {
        const raw = localStorage.getItem(STORAGE_BPM);
        if (raw == null) return null;
        const n = parseFloat(raw);
        if (!Number.isFinite(n)) return null;
        return clamp(n, BPM_MIN, BPM_MAX);
      } catch (_) {
        return null;
      }
    }

    function loadStoredVolume() {
      try {
        const raw = localStorage.getItem(STORAGE_VOLUME);
        if (raw == null) return null;
        const n = parseFloat(raw);
        if (!Number.isFinite(n)) return null;
        return clamp(n, 0, 100);
      } catch (_) {
        return null;
      }
    }

    function persistBpm() {
      try {
        localStorage.setItem(STORAGE_BPM, String(bpm));
      } catch (_) {
        /* ignore */
      }
    }

    function persistVolume() {
      try {
        localStorage.setItem(STORAGE_VOLUME, String(volumePct));
      } catch (_) {
        /* ignore */
      }
    }

    function isTypingTarget(el) {
      if (!el || !el.tagName) return false;
      const tag = el.tagName;
      return tag === 'INPUT' || tag === 'TEXTAREA' || el.isContentEditable;
    }

    function syncWindowFocusClasses() {
      const hasFocus =
        typeof document.hasFocus === 'function' &&
        document.hasFocus() &&
        document.visibilityState === 'visible';
      document.body.classList.toggle('focused', hasFocus);
      document.body.classList.toggle('unfocused', !hasFocus);
    }

    function handleTapTempo() {
      const now = performance.now();
      if (
        tapTempoTimes.length &&
        now - tapTempoTimes[tapTempoTimes.length - 1] > TAP_TEMPO_TIMEOUT_MS
      ) {
        tapTempoTimes = [];
      }
      tapTempoTimes.push(now);
      if (tapTempoTimes.length > TAP_TEMPO_MAX_SAMPLES) {
        tapTempoTimes.shift();
      }
      if (tapTempoTimes.length < 2) return;

      const intervals = [];
      for (let i = 1; i < tapTempoTimes.length; i++) {
        intervals.push(tapTempoTimes[i] - tapTempoTimes[i - 1]);
      }
      const avgMs = intervals.reduce((a, b) => a + b, 0) / intervals.length;
      if (avgMs < 1) return;

      const nextBpm = Math.round(60000 / avgMs);
      setBpm(nextBpm);
      persistBpm();
      startMetronome();
    }

    function bpmFromClientX(clientX) {
      const r = bpmSection.getBoundingClientRect();
      const t = r.width <= 0 ? 0.5 : (clientX - r.left) / r.width;
      return BPM_MIN + clamp(t, 0, 1) * (BPM_MAX - BPM_MIN);
    }

    function volumeFromClientX(clientX) {
      const r = volumeSection.getBoundingClientRect();
      const t = r.width <= 0 ? 1 : (clientX - r.left) / r.width;
      return clamp(t, 0, 1) * 100;
    }

    function setBpm(next) {
      bpm = clamp(next, BPM_MIN, BPM_MAX);
      bpmReadout.textContent = `${Math.round(bpm)} BPM`;
      const frac = (bpm - BPM_MIN) / (BPM_MAX - BPM_MIN);
      bpmFill.style.width = `${clamp(frac, 0, 1) * 100}%`;
    }

    function setVolumePct(next) {
      volumePct = clamp(next, 0, 100);
      volumeReadout.textContent = `${Math.round(volumePct)}%`;
      volumeFill.style.width = `${volumePct}%`;
      document.getElementById('click-audio').volume = volumePct / 100;
    }

    /** Like bell.mp3: load via <audio src>, not fetch (works with file:// open). */
    function waitClickReady() {
      const el = document.getElementById('click-audio');
      if (el.readyState >= HTMLMediaElement.HAVE_FUTURE_DATA) {
        return Promise.resolve();
      }
      return new Promise(resolve => {
        el.addEventListener(
          'canplaythrough',
          () => resolve(),
          { once: true }
        );
        el.addEventListener(
          'error',
          () => {
            console.warn('click.mp3 failed to load');
            resolve();
          },
          { once: true }
        );
      });
    }

    function playClick(when) {
      const el = document.getElementById('click-audio');
      const delayMs = Math.max(0, (when - clickNowSec()) * 1000);
      window.setTimeout(() => {
        el.currentTime = 0;
        void el.play().catch(() => {});
      }, delayMs);
    }

    function scheduleLoop() {
      if (!running) return;
      const lookahead = 0.08;
      const now = clickNowSec();
      while (nextClickTime < now + lookahead) {
        playClick(nextClickTime);
        nextClickTime += 60 / bpm;
      }
      scheduleRaf = requestAnimationFrame(scheduleLoop);
    }

    function startMetronome() {
      if (running) return;
      const begin = () => {
        running = true;
        document.body.classList.add('running');
        nextClickTime = clickNowSec() + 0.05;
        scheduleLoop();
      };
      void waitClickReady().then(begin, begin);
    }

    function stopMetronome() {
      running = false;
      document.body.classList.remove('running');
      if (scheduleRaf != null) {
        cancelAnimationFrame(scheduleRaf);
        scheduleRaf = null;
      }
    }

    function toggleMetronome() {
      if (running) {
        stopMetronome();
      } else {
        startMetronome();
      }
    }

    function onPointerDown(e, target) {
      dragTarget = target;
      if (target === 'bpm') {
        setBpm(bpmFromClientX(e.clientX));
        startMetronome();
      } else {
        setVolumePct(volumeFromClientX(e.clientX));
      }
    }

    function onPointerMove(e) {
      if (!dragTarget) return;
      if (dragTarget === 'bpm') {
        setBpm(bpmFromClientX(e.clientX));
        startMetronome();
      } else {
        setVolumePct(volumeFromClientX(e.clientX));
      }
    }

    function onPointerUp(e) {
      const finished = dragTarget;
      dragTarget = null;
      if (finished === 'bpm') {
        persistBpm();
      } else if (finished === 'volume') {
        persistVolume();
      }
      if (e && e.currentTarget && typeof e.currentTarget.releasePointerCapture === 'function') {
        try {
          e.currentTarget.releasePointerCapture(e.pointerId);
        } catch (_) {
          /* ignore */
        }
      }
    }

    function clearSwallowPointerTimer() {
      if (swallowPointerTimer != null) {
        clearTimeout(swallowPointerTimer);
        swallowPointerTimer = null;
      }
    }

    function tryAbsorbRefocusPointerEvent(e) {
      const onControl = e.target.closest?.('.control-section');
      if (swallowFirstControlPointer && onControl) {
        e.preventDefault();
        e.stopImmediatePropagation();
        swallowFirstControlPointer = false;
        clearSwallowPointerTimer();
        absorbingRefocusClick = true;
        return true;
      }
      if (absorbingRefocusClick && onControl) {
        e.preventDefault();
        e.stopImmediatePropagation();
        return true;
      }
      return false;
    }

    document.addEventListener('pointerdown', e => tryAbsorbRefocusPointerEvent(e), true);
    document.addEventListener('mousedown', e => tryAbsorbRefocusPointerEvent(e), true);

    document.addEventListener(
      'pointerup',
      () => {
        absorbingRefocusClick = false;
      },
      true
    );
    document.addEventListener(
      'pointercancel',
      () => {
        absorbingRefocusClick = false;
      },
      true
    );

    bpmSection.addEventListener('pointerdown', e => {
      bpmSection.setPointerCapture(e.pointerId);
      onPointerDown(e, 'bpm');
    });
    bpmSection.addEventListener('pointermove', e => onPointerMove(e));
    bpmSection.addEventListener('pointerup', onPointerUp);
    bpmSection.addEventListener('pointercancel', onPointerUp);

    volumeSection.addEventListener('pointerdown', e => {
      volumeSection.setPointerCapture(e.pointerId);
      onPointerDown(e, 'volume');
    });
    volumeSection.addEventListener('pointermove', e => onPointerMove(e));
    volumeSection.addEventListener('pointerup', onPointerUp);
    volumeSection.addEventListener('pointercancel', onPointerUp);

    document.addEventListener('keydown', e => {
      if (isTypingTarget(e.target)) return;
      if (e.code === 'Space' || e.key === 'p' || e.key === 'P') {
        e.preventDefault();
        toggleMetronome();
        return;
      }
      if (e.key === 't' || e.key === 'T') {
        e.preventDefault();
        handleTapTempo();
        return;
      }
      if (e.key === '=' || e.key === '+') {
        e.preventDefault();
        setBpm(Math.round(bpm) + 1);
        persistBpm();
        return;
      }
      if (e.key === '-' || e.key === '_') {
        e.preventDefault();
        setBpm(Math.round(bpm) - 1);
        persistBpm();
        return;
      }
      if (e.key === ']' || e.key === '}') {
        e.preventDefault();
        setBpm(Math.round(bpm) + 5);
        persistBpm();
        return;
      }
      if (e.key === '[' || e.key === '{') {
        e.preventDefault();
        setBpm(Math.round(bpm) - 5);
        persistBpm();
        return;
      }
      if ((e.key === 'r' || e.key === 'R') && !e.metaKey && !e.ctrlKey) {
        e.preventDefault();
        resetStopwatch();
        return;
      }
    });

    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      const toggle = document.getElementById('theme-toggle');
      toggle.textContent = theme === 'light' ? '◐' : '◑';
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'light' ? 'dark' : 'light';
      setTheme(next);
      try {
        localStorage.setItem(STORAGE_THEME, next);
      } catch (_) {
        /* ignore */
      }
    }

    function loadInitialTheme() {
      try {
        const saved = localStorage.getItem(STORAGE_THEME);
        if (saved === 'light' || saved === 'dark') {
          setTheme(saved);
          return;
        }
      } catch (_) {
        /* ignore */
      }
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      setTheme(prefersDark ? 'dark' : 'light');
    }

    loadInitialTheme();

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        documentJustBecameVisible = false;
      } else {
        documentJustBecameVisible = true;
        swallowFirstControlPointer = false;
        if (swallowPointerTimer != null) {
          clearTimeout(swallowPointerTimer);
          swallowPointerTimer = null;
        }
      }
      syncWindowFocusClasses();
    });

    window.addEventListener('blur', () => {
      windowEverBlurred = true;
      syncWindowFocusClasses();
      swallowFirstControlPointer = false;
      if (swallowPointerTimer != null) {
        clearTimeout(swallowPointerTimer);
        swallowPointerTimer = null;
      }
    });

    window.addEventListener('focus', () => {
      syncWindowFocusClasses();
      if (!windowEverBlurred) {
        swallowFirstControlPointer = false;
        documentJustBecameVisible = false;
        return;
      }
      if (documentJustBecameVisible) {
        swallowFirstControlPointer = false;
        documentJustBecameVisible = false;
        return;
      }
      swallowFirstControlPointer = true;
      if (swallowPointerTimer != null) clearTimeout(swallowPointerTimer);
      swallowPointerTimer = setTimeout(() => {
        swallowFirstControlPointer = false;
        swallowPointerTimer = null;
      }, SWALLOW_POINTER_FALLBACK_MS);
    });

    syncWindowFocusClasses();

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
      try {
        if (localStorage.getItem(STORAGE_THEME) != null) return;
      } catch (_) {
        /* ignore */
      }
      setTheme(e.matches ? 'dark' : 'light');
    });

    const storedBpm = loadStoredBpm();
    const storedVolume = loadStoredVolume();
    if (storedBpm !== null) {
      bpm = storedBpm;
    }
    if (storedVolume !== null) {
      volumePct = storedVolume;
    }
    setBpm(bpm);
    setVolumePct(volumePct);

    // --- Stopwatch ---
    const stopwatchHint = document.getElementById('stopwatch-hint');

    function loadStopwatchStart() {
      try {
        const raw = localStorage.getItem(STORAGE_STOPWATCH);
        if (raw == null) return null;
        const n = parseInt(raw, 10);
        if (!Number.isFinite(n)) return null;
        return n;
      } catch (_) {
        return null;
      }
    }

    function saveStopwatchStart(ts) {
      try {
        localStorage.setItem(STORAGE_STOPWATCH, String(ts));
      } catch (_) { /* ignore */ }
    }

    function resetStopwatch() {
      stopwatchStart = Date.now();
      saveStopwatchStart(stopwatchStart);
      updateStopwatch();
    }

    function updateStopwatch() {
      const elapsedSec = Math.floor((Date.now() - stopwatchStart) / 1000);
      const h = Math.floor(elapsedSec / 3600);
      const m = Math.floor((elapsedSec % 3600) / 60);
      const s = elapsedSec % 60;
      if (h > 0) {
        stopwatchHint.textContent =
          `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      } else {
        stopwatchHint.textContent =
          `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      }
    }

    let stopwatchStart = loadStopwatchStart();
    if (stopwatchStart === null) {
      stopwatchStart = Date.now();
      saveStopwatchStart(stopwatchStart);
    }
    updateStopwatch();
    setInterval(updateStopwatch, 1000);
  </script>
</body>

</html>
