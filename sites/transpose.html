<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chord Transposer</title>
  <style>
    :root {
      --bg-color: #1a1a1a;
      --text-color: rgba(255, 255, 255, 0.87);
      --secondary-text: rgba(255, 255, 255, 0.6);
      --input-bg-color: rgba(255, 255, 255, 0.1);
      --canvas-bg-color: #2a2a2a;
      --canvas-border: rgba(255, 255, 255, 0.2);
    }

    :root[data-theme="light"] {
      --bg-color: #f0f0f0;
      --text-color: #000000;
      --secondary-text: #666666;
      --input-bg-color: rgba(0, 0, 0, 0.05);
      --canvas-bg-color: #ffffff;
      --canvas-border: rgba(0, 0, 0, 0.2);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      background: var(--bg-color);
      color: var(--text-color);
      transition: all 0.2s ease;
    }

    .container {
      display: flex;
      gap: 10px;
      height: 100vh;
      height: 100dvh;
      padding: 10px;
      box-sizing: border-box;
    }

    .left-panel,
    .right-panel {
      flex: 1 1 0;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    #input-text {
      width: 100%;
      height: 100%;
      resize: none;
      font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', 'Consolas', monospace;
      padding: 15px;
      border-radius: 10px;
      border: none;
      background: var(--input-bg-color);
      color: var(--text-color);
      font-size: 14px;
      line-height: 1.5;
      box-sizing: border-box;
    }

    #output-text {
      width: 100%;
      height: 100%;
      resize: none;
      font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', 'Consolas', monospace;
      padding: 15px;
      border-radius: 10px;
      border: none;
      background: var(--canvas-bg-color);
      color: var(--text-color);
      font-size: 14px;
      line-height: 1.5;
      box-sizing: border-box;
      white-space: pre-wrap;
    }

    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="left-panel">
      <textarea id="input-text" placeholder="Paste your chord chart here..."></textarea>
    </div>
    <div class="right-panel">
      <textarea id="output-text" readonly></textarea>
    </div>
  </div>
  <script src="dist/transpose.js"></script>
</body>

</html>
