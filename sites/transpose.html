<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chord Transposer</title>
  <style>
    :root {
      --bg-color: #1a1a1a;
      --text-color: rgba(255, 255, 255, 0.87);
      --secondary-text: rgba(255, 255, 255, 0.6);
      --input-bg-color: rgba(255, 255, 255, 0.1);
      --canvas-bg-color: #2a2a2a;
      --canvas-border: rgba(255, 255, 255, 0.2);
    }

    :root[data-theme="light"] {
      --bg-color: #f0f0f0;
      --text-color: #000000;
      --secondary-text: #666666;
      --input-bg-color: rgba(0, 0, 0, 0.05);
      --canvas-bg-color: #ffffff;
      --canvas-border: rgba(0, 0, 0, 0.2);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      margin: 0;
      padding: 10px;
      background: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      transition: all 0.2s ease;
      box-sizing: border-box;
    }

    .container {
      display: flex;
      flex: 1;
      width: 100%;
      max-width: 100%;
      margin: 0;
      gap: 10px;
      height: calc(100vh - 20px);
      padding: 10px;
      box-sizing: border-box;
    }

    .left-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .right-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      overflow-y: auto;
    }

    #input-text {
      width: 100%;
      height: 100%;
      resize: none;
      font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', 'Consolas', monospace;
      padding: 15px;
      border-radius: 10px;
      border: none;
      background: var(--input-bg-color);
      color: var(--text-color);
      font-size: 14px;
      line-height: 1.5;
      box-sizing: border-box;
    }

    #output-text {
      width: 100%;
      height: 100%;
      resize: none;
      font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', 'Consolas', monospace;
      padding: 15px;
      border-radius: 10px;
      border: none;
      background: var(--canvas-bg-color);
      color: var(--text-color);
      font-size: 14px;
      line-height: 1.5;
      box-sizing: border-box;
      white-space: pre-wrap;
    }

    #theme-toggle {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--text-color);
      color: var(--bg-color);
      opacity: 0;
      cursor: pointer;
      border: none;
      font-size: 1.5rem;
      transition: all 0.1s ease;
      z-index: 100;
    }

    body:hover #theme-toggle {
      opacity: 1;
    }

    #theme-toggle:hover {
      transform: scale(1.1);
    }

    @media (max-width: 768px) {
      .container {
        flex-direction: column;
        height: auto;
        min-height: calc(100vh - 20px);
      }

      .left-panel,
      .right-panel {
        min-height: 400px;
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="left-panel">
      <textarea id="input-text" placeholder="Paste your chord chart here..."></textarea>
    </div>
    <div class="right-panel">
      <textarea id="output-text" readonly></textarea>
    </div>
  </div>
  <button id="theme-toggle" onclick="toggleTheme()">☀️</button>

  <script src="dist/transpose.js"></script>
</body>

</html>
