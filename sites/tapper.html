<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tap Tempo</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reddit+Mono&display=swap">

  <style>
    :root {
      --bg-color: #1a1a1a;
      --text-color: rgba(255, 255, 255, 0.87);
      --border-color: rgba(255, 255, 255, 0.35);
      --section-fill: rgba(255, 255, 255, 0.07);
      --section-divider: rgba(255, 255, 255, 0.1);
    }

    :root[data-theme="light"] {
      --bg-color: #f0f0f0;
      --text-color: #000000;
      --border-color: rgba(0, 0, 0, 0.28);
      --section-fill: rgba(0, 0, 0, 0.045);
      --section-divider: rgba(0, 0, 0, 0.08);
    }

    :root[data-theme="light"] body.focused {
      --bg-color: #f2f2f4;
      --text-color: rgba(0, 0, 0, 0.82);
      --section-fill: rgba(0, 0, 0, 0.05);
    }

    :root[data-theme="light"] body.unfocused {
      --bg-color: #ddd;
      --text-color: #666;
    }

    :root[data-theme="dark"] body.focused {
      --bg-color: #252528;
      --text-color: rgba(255, 255, 255, 0.84);
      --section-fill: rgba(255, 255, 255, 0.07);
    }

    :root[data-theme="dark"] body.unfocused {
      --bg-color: #1f1f23;
      --text-color: rgba(255, 255, 255, 0.58);
      --section-fill: rgba(255, 255, 255, 0.05);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
      height: 100dvh;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    #tap-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: none;
      position: relative;
      transition: background 0.08s ease;
    }

    #tap-area:active,
    #tap-area.flash {
      background: var(--section-fill);
    }

    .bpm-readout {
      font-family: 'Reddit Mono', monospace;
      font-size: clamp(3.5rem, 18vmin, 9rem);
      font-weight: 600;
      text-align: center;
      line-height: 1;
      transition: opacity 0.3s ease;
    }

    body:not(.tapped) .bpm-readout {
      opacity: 0.25;
    }

    .bpm-unit {
      font-family: 'Reddit Mono', monospace;
      font-size: clamp(1rem, 3.5vmin, 1.75rem);
      font-weight: 400;
      text-align: center;
      margin-top: 0.4em;
      opacity: 0.55;
    }

    .hint-text {
      position: absolute;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Reddit Mono', monospace;
      font-size: clamp(0.7rem, 2vmin, 0.9rem);
      opacity: 0.35;
      white-space: nowrap;
      pointer-events: none;
    }

    #theme-toggle {
      position: fixed;
      bottom: 16px;
      right: 16px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--text-color);
      color: var(--bg-color);
      opacity: 0;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
      font-size: 1.5rem;
      padding: 0;
      border: none;
      z-index: 10;
    }

    body:hover #theme-toggle {
      opacity: 1;
    }

    #theme-toggle:hover {
      transform: scale(1.08);
    }
  </style>
</head>

<body>
  <div id="tap-area">
    <div class="bpm-readout" id="bpm-display">—</div>
    <div class="bpm-unit" id="bpm-unit">BPM</div>
    <div class="hint-text">space or tap to tap tempo</div>
  </div>

  <script>
    const TAP_TIMEOUT_MS = 1500;
    const MAX_SAMPLES = 6;

    const tapArea = document.getElementById('tap-area');
    const bpmDisplay = document.getElementById('bpm-display');

    let tapTimes = [];
    let resetTimer = null;
    let flashTimer = null;

    function tap() {
      const now = performance.now();

      if (tapTimes.length && now - tapTimes[tapTimes.length - 1] > TAP_TIMEOUT_MS) {
        tapTimes = [];
        document.body.classList.remove('tapped');
      }

      tapTimes.push(now);
      if (tapTimes.length > MAX_SAMPLES) tapTimes.shift();

      if (tapTimes.length >= 2) {
        const intervals = [];
        for (let i = 1; i < tapTimes.length; i++) {
          intervals.push(tapTimes[i] - tapTimes[i - 1]);
        }
        const avgMs = intervals.reduce((a, b) => a + b, 0) / intervals.length;
        const bpm = Math.round(60000 / avgMs);
        bpmDisplay.textContent = bpm;
        document.body.classList.add('tapped');
      } else {
        bpmDisplay.textContent = '—';
      }

      // flash
      tapArea.classList.add('flash');
      if (flashTimer) clearTimeout(flashTimer);
      flashTimer = setTimeout(() => tapArea.classList.remove('flash'), 80);

      // auto-reset after timeout
      if (resetTimer) clearTimeout(resetTimer);
      resetTimer = setTimeout(() => {
        tapTimes = [];
        bpmDisplay.textContent = '—';
        document.body.classList.remove('tapped');
      }, TAP_TIMEOUT_MS);
    }

    tapArea.addEventListener('pointerdown', e => {
      e.preventDefault();
      tap();
    });

    document.addEventListener('keydown', e => {
      if (e.code === 'Space') {
        e.preventDefault();
        tap();
      }
    });

    function applySystemTheme() {
      document.documentElement.setAttribute('data-theme',
        window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    }
    applySystemTheme();
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applySystemTheme);

    // Focus classes
    window.addEventListener('blur', () => {
      document.body.classList.add('unfocused');
      document.body.classList.remove('focused');
    });
    window.addEventListener('focus', () => {
      document.body.classList.remove('unfocused');
      document.body.classList.add('focused');
    });
    document.body.classList.add(document.hasFocus() ? 'focused' : 'unfocused');
  </script>
</body>

</html>
