<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pomodoro</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reddit+Mono&display=swap">

  <style>
    :root {
      --bg-color: #1a1a1a;
      --bg-color-break: #44556a;
      --bg-color-overtime: #4b4352;
      --text-color: rgba(255, 255, 255, 0.87);
      --section-fill: rgba(255, 255, 255, 0.07);
      --section-divider: rgba(255, 255, 255, 0.1);
    }

    :root[data-theme="light"] {
      --bg-color: #f0f0f0;
      --bg-color-break: #e6f3ff;
      --bg-color-overtime: #f4f0ff;
      --text-color: #000000;
      --section-fill: rgba(0, 0, 0, 0.045);
      --section-divider: rgba(0, 0, 0, 0.08);
    }

    body {
      position: relative;
      min-height: 100vh;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-color);
      color: var(--text-color);
      transition: all 0.1s ease;
    }

    body.break {
      background: var(--bg-color-break);
    }

    body.overtime {
      background: var(--bg-color-overtime);
    }

    .timer-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }

    #timer {
      font-size: clamp(4.5rem, 15vw, 6rem);
      color: var(--text-color);
      transition: all 0.1s ease;
      font-family: 'Reddit Mono', monospace;
    }

    #timer.inactive {
      opacity: 0.7;
    }

    .button-group {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
    }

    .button-group button {
      width: 44px;
      height: 44px;
      min-width: 44px;
      max-width: 44px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      color: rgba(128, 128, 128, 0.75);
      opacity: 0;
      cursor: pointer;
      font-size: 1.25rem;
      line-height: 1;
      padding: 0;
      border: 1.5px solid transparent;
      transition: all 0.1s ease;
      flex-shrink: 0;
    }

    body:hover .button-group button {
      opacity: 1;
    }

    .button-group button:hover {
      transform: scale(1.08);
      border-color: rgba(128, 128, 128, 0.75);
    }

    .button-group button:focus {
      outline: none;
    }

    [data-tooltip] {
      position: relative;
    }

    [data-tooltip]::after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: 52px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--text-color);
      color: var(--bg-color);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-family: 'Reddit Mono', monospace;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
    }

    [data-tooltip]:hover::after {
      opacity: 1;
    }
  </style>
</head>

<body>
  <div class="timer-container">
    <div id="timer" class="inactive">--:--</div>
  </div>
  <div class="button-group">
    <button id="toggleButton" data-tooltip="start (space)" onclick="toggleTimer()">⏵</button>
    <button data-tooltip="skip (s)" onclick="skipPhase()">⏭</button>
  </div>

  <canvas id="pip-canvas" style="display: none;"></canvas>

  <script>
    function getTimeFromParams() {
      const params = new URLSearchParams(window.location.search);
      const workTime = params.get('work');
      const breakTime = params.get('break');

      return {
        workMinutes: workTime ? parseFloat(workTime) : 25,
        breakMinutes: breakTime ? parseFloat(breakTime) : 5
      };
    }

    const times = getTimeFromParams();
    let isRunning = false;
    let interval;
    let timeLeft = times.workMinutes * 60; // Convert minutes to seconds
    let isWorkPhase = true;
    let pipWindow = null;
    let canvas = null;
    let ctx = null;
    switchPhase(isWorkPhase);
    
    applySystemTheme();
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applySystemTheme);
    
    // Initialize PIP support
    initializePIP();
    
    // Listen for visibility changes
    document.addEventListener('visibilitychange', handleVisibilityChange);

    document.addEventListener('keydown', (e) => {
      const inInput = document.activeElement && document.activeElement.tagName === 'INPUT';
      if (inInput) return;
      if (e.key === ' ') {
        e.preventDefault();
        toggleTimer();
      } else if (e.key === 's' || e.key === 'S') {
        if (e.metaKey || e.ctrlKey) return;
        e.preventDefault();
        skipPhase();
      }
    });

    // Auto-start the timer
    setTimer(true);

    function applySystemTheme() {
      document.documentElement.setAttribute('data-theme',
        window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    }

    function toggleTimer() {
      setTimer(!isRunning);
    }

    function setTimer(newRunning) {
      const button = document.getElementById('toggleButton');
      const timer = document.getElementById('timer');

      if (newRunning) {
        interval = setInterval(updateTimer, 1000);
        button.textContent = '⏸';
        button.setAttribute('data-tooltip', 'pause (space)');
        timer.classList.remove('inactive');
      } else {
        clearInterval(interval);
        button.textContent = '⏵';
        button.setAttribute('data-tooltip', 'start (space)');
        timer.classList.add('inactive');
      }
      isRunning = newRunning;
      updateDisplay();
    }

    function updateTimer() {
      const wasPositive = timeLeft > 0;
      timeLeft--;
      const isNowNegative = timeLeft < 0;

      if (wasPositive && isNowNegative) {
        showNotification();
      }

      updateDisplay();
    }

    function updateDisplay() {
      const absSeconds = Math.abs(timeLeft);
      const minutes = Math.floor(absSeconds / 60);
      const seconds = Math.floor(absSeconds % 60);
      const sign = timeLeft < 0 ? '-' : '';

      let timeString;
      timeString = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

      document.getElementById('timer').textContent = sign + timeString;
      document.body.classList.toggle('overtime', timeLeft < 0 && isWorkPhase);
      
      // Update PIP canvas if active
      if (pipWindow && canvas && ctx) {
        updatePIPCanvas(minutes, seconds, sign);
      }
    }

    function switchPhase(newPhase) {
      isWorkPhase = newPhase;
      timeLeft = (isWorkPhase ? times.workMinutes : times.breakMinutes) * 60;
      document.body.classList.toggle('break', !isWorkPhase);
      updateDisplay();
    }

    function skipPhase() {
      clearInterval(interval);
      isRunning = false;
      switchPhase(!isWorkPhase);
      setTimer(true);
    }

    function initializePIP() {
      canvas = document.getElementById('pip-canvas');
      ctx = canvas.getContext('2d');
      
      // Set high DPI resolution
      const dpr = window.devicePixelRatio || 1;
      canvas.width = 400 * dpr;
      canvas.height = 200 * dpr;
      canvas.style.width = '400px';
      canvas.style.height = '200px';
      ctx.scale(dpr, dpr);
    }

    function handleVisibilityChange() {
      if (document.hidden && 'pictureInPictureEnabled' in document) {
        enterPIP();
      } else if (!document.hidden && pipWindow) {
        exitPIP();
      }
    }

    async function enterPIP() {
      if (!canvas || pipWindow) return;
      
      try {
        // Initialize canvas with current time display
        const absSeconds = Math.abs(timeLeft);
        const minutes = Math.floor(absSeconds / 60);
        const seconds = Math.floor(absSeconds % 60);
        const sign = timeLeft < 0 ? '-' : '';
        updatePIPCanvas(minutes, seconds, sign);
        
        // Create a video element to stream the canvas
        const video = document.createElement('video');
        video.srcObject = canvas.captureStream(30);
        video.muted = true;
        
        // Wait for metadata to load before requesting PIP
        await new Promise((resolve) => {
          video.addEventListener('loadedmetadata', resolve, { once: true });
          video.play();
        });
        
        pipWindow = await video.requestPictureInPicture();
        
        pipWindow.addEventListener('resize', () => {
          const dpr = window.devicePixelRatio || 1;
          canvas.width = pipWindow.width * dpr;
          canvas.height = pipWindow.height * dpr;
          canvas.style.width = pipWindow.width + 'px';
          canvas.style.height = pipWindow.height + 'px';
          ctx.scale(dpr, dpr);
          
          // Redraw content after resize
          const absSeconds = Math.abs(timeLeft);
          const minutes = Math.floor(absSeconds / 60);
          const seconds = Math.floor(absSeconds % 60);
          const sign = timeLeft < 0 ? '-' : '';
          updatePIPCanvas(minutes, seconds, sign);
        });
        
      } catch (error) {
        console.error('Failed to enter PIP mode:', error);
      }
    }

    function exitPIP() {
      if (pipWindow) {
        document.exitPictureInPicture();
        pipWindow = null;
      }
    }

    function updatePIPCanvas(minutes, seconds, sign) {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const isBreak = !isWorkPhase;
      const isOvertime = timeLeft < 0 && isWorkPhase;
      
      // Determine background color based on state
      let bgColor;
      if (isOvertime) {
        bgColor = currentTheme === 'light' ? '#f4f0ff' : '#4b4352';
      } else if (isBreak) {
        bgColor = currentTheme === 'light' ? '#e6f3ff' : '#44556a';
      } else {
        bgColor = currentTheme === 'light' ? '#f0f0f0' : '#1a1a1a';
      }
      
      const textColor = currentTheme === 'light' ? '#000000' : 'rgba(255, 255, 255, 0.87)';
      
      // Use logical dimensions for drawing
      const logicalWidth = parseInt(canvas.style.width) || 400;
      const logicalHeight = parseInt(canvas.style.height) || 200;
      
      ctx.fillStyle = bgColor;
      ctx.fillRect(0, 0, logicalWidth, logicalHeight);
      
      ctx.fillStyle = textColor;
      ctx.font = 'bold 84px "Reddit Mono", monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      
      const timeText = `${sign}${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      ctx.fillText(timeText, logicalWidth / 2, logicalHeight / 2);
    }
  </script>
</body>

</html>
