<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BPM Loop Player</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reddit+Mono&display=swap">

  <style>
    :root {
      --bg-color: #1a1a1a;
      --text-color: rgba(255, 255, 255, 0.87);
      --border-color: rgba(255, 255, 255, 0.35);
      --section-track: transparent;
      --section-fill: rgba(255, 255, 255, 0.07);
      --section-divider: rgba(255, 255, 255, 0.1);
    }

    :root[data-theme="light"] {
      --bg-color: #f0f0f0;
      --text-color: #000000;
      --border-color: rgba(0, 0, 0, 0.28);
      --section-track: transparent;
      --section-fill: rgba(0, 0, 0, 0.045);
      --section-divider: rgba(0, 0, 0, 0.08);
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; margin: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
      height: 100dvh;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    :root[data-theme="light"] body.focused {
      --bg-color: #f2f2f4;
      --text-color: rgba(0, 0, 0, 0.82);
      --section-fill: rgba(0, 0, 0, 0.05);
      --section-divider: rgba(0, 0, 0, 0.09);
    }

    :root[data-theme="light"] body.unfocused {
      --bg-color: #ddd;
      --text-color: #666;
    }

    :root[data-theme="dark"] body.focused {
      --bg-color: #252528;
      --text-color: rgba(255, 255, 255, 0.84);
      --section-fill: rgba(255, 255, 255, 0.07);
      --section-divider: rgba(255, 255, 255, 0.12);
    }

    :root[data-theme="dark"] body.unfocused {
      --bg-color: #1f1f23;
      --text-color: rgba(255, 255, 255, 0.58);
      --section-fill: rgba(255, 255, 255, 0.05);
      --section-divider: rgba(255, 255, 255, 0.078);
    }

    .control-section {
      position: relative;
      width: 100%;
      flex-shrink: 0;
      background: var(--section-track);
      overflow: hidden;
      cursor: pointer;
      touch-action: none;
    }

    #main-area {
      flex: 9 1 0;
      min-height: 0;
      position: relative;
      border-bottom: 1px solid var(--section-divider);
    }

    #bpm-section {
      flex: 2 1 0;
      min-height: 0;
      border-bottom: 1px solid var(--section-divider);
    }

    #loop-section {
      flex: 2 1 0;
      min-height: 0;
      border-bottom: 1px solid var(--section-divider);
    }

    #loop-between {
      position: absolute;
      top: 0;
      bottom: 0;
      background: var(--section-fill);
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    #loop-section { cursor: grab; }
    #loop-section.dragging { cursor: grabbing; }

    #loop-hint {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Reddit Mono', monospace;
      font-size: clamp(1.1rem, 3.6vmin, 1.6rem);
      white-space: nowrap;
      color: var(--text-color);
      opacity: 0.5;
      padding: 4px 8px;
      cursor: text;
      pointer-events: auto;
      border-bottom: 1px dashed transparent;
      transition: border-color 0.15s, opacity 0.15s;
    }

    #loop-hint:hover {
      opacity: 0.8;
      border-bottom-color: currentColor;
    }

    #loop-length-input {
      display: none;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 8em;
      font-family: 'Reddit Mono', monospace;
      font-size: clamp(1.1rem, 3.6vmin, 1.6rem);
      font-weight: inherit;
      background: var(--bg-color);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      padding: 2px 6px;
      text-align: center;
      outline: none;
      z-index: 3;
      user-select: text;
      -webkit-user-select: text;
    }

    .loop-beat-label {
      position: absolute;
      top: 50%;
      font-family: 'Reddit Mono', monospace;
      font-size: clamp(0.6rem, 2vmin, 0.85rem);
      color: var(--text-color);
      opacity: 0.5;
      pointer-events: none;
      z-index: 1;
      white-space: nowrap;
    }

    #loop-start-label {
      transform: translate(calc(-100% - 6px), -50%);
    }

    #loop-end-label {
      transform: translate(6px, -50%);
    }

    #loop-playhead {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 1px;
      background: var(--text-color);
      opacity: 0.6;
      pointer-events: none;
      z-index: 2;
      transition: opacity 0.2s;
    }

    body:not(.playing) #loop-playhead { opacity: 0; }

    #volume-section {
      flex: 1 1 0;
      min-height: 0;
    }

    #detected-tick {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 1px;
      background: var(--section-divider);
      pointer-events: none;
      z-index: 0;
      display: none;
    }

    .fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 0%;
      background: var(--section-fill);
      z-index: 0;
      pointer-events: none;
    }

    .readout {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      z-index: 1;
      font-family: 'Reddit Mono', monospace;
      font-weight: 600;
      text-align: center;
      pointer-events: none;
      line-height: 1.2;
      padding: 0 0.5rem;
      text-shadow:
        0 0 20px var(--bg-color),
        0 0 8px var(--bg-color),
        0 1px 2px var(--bg-color);
      transition: opacity 0.3s ease;
    }

    #bpm-section .readout {
      font-size: clamp(1.4rem, 5vmin, 2.5rem);
    }

    #volume-section .readout {
      font-size: clamp(1.25rem, 4vmin, 2.25rem);
    }

    body:not(.playing) .readout {
      opacity: 0.35;
    }

    #status-hint {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Reddit Mono', monospace;
      font-size: clamp(1rem, 3vmin, 1.5rem);
      color: var(--text-color);
      opacity: 0.3;
      pointer-events: none;
      z-index: 1;
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
      max-width: 90%;
    }

    #top-bar {
      flex-shrink: 0;
      height: 48px;
      display: flex;
      align-items: center;
      padding: 0 10px;
      gap: 8px;
      z-index: 10;
      border-bottom: 1px solid var(--section-divider);
    }

    #top-bar-right {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }

    #theme-toggle {
      position: fixed;
      bottom: 16px;
      right: 16px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--text-color);
      color: var(--bg-color);
      opacity: 0;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
      font-size: 1.5rem;
      padding: 0;
      border: none;
      z-index: 10;
      transition: opacity 0.2s;
    }

    body:hover #theme-toggle { opacity: 1; }
    #theme-toggle:hover { transform: scale(1.08); }
    #theme-toggle:focus { outline: none; }

    #file-select {
      font-family: 'Reddit Mono', monospace;
      font-size: 0.75rem;
      background: transparent;
      color: rgba(128, 128, 128, 0.75);
      border: none;
      border-radius: 4px;
      padding: 6px 10px;
      cursor: pointer;
      max-width: 220px;
      outline: none;
      display: none;
      -webkit-appearance: none;
      appearance: none;
      text-overflow: ellipsis;
      overflow: hidden;
      white-space: nowrap;
    }

    #file-select.has-files { display: block; }

    #metronome-toggle {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(128, 128, 128, 0.25);
      color: rgba(128, 128, 128, 0.75);
      cursor: pointer;
      font-size: 1.1rem;
      padding: 0;
      border: 1.5px solid transparent;
      opacity: 0;
      transition: opacity 0.2s;
    }

    body:hover #metronome-toggle { opacity: 1; }
    #metronome-toggle:hover { transform: scale(1.08); }
    #metronome-toggle:focus { outline: none; }
    #metronome-toggle.active {
      opacity: 1;
      background: var(--bg-color);
      color: var(--text-color);
      border-color: var(--text-color);
    }

    #download-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(128, 128, 128, 0.25);
      color: rgba(128, 128, 128, 0.75);
      cursor: pointer;
      padding: 0;
      border: 1.5px solid transparent;
      opacity: 0;
      transition: opacity 0.2s;
    }

    #download-btn.visible { display: inline-flex; }
    body:hover #download-btn.visible { opacity: 1; }
    #download-btn:hover { transform: scale(1.08); }
    #download-btn:focus { outline: none; }

    body.drag-over::after {
      content: 'Drop audio file';
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: 600;
      font-family: 'Reddit Mono', monospace;
      color: var(--text-color);
      background: rgba(128, 128, 128, 0.12);
      border: 3px dashed var(--border-color);
      border-radius: 16px;
      margin: 16px;
      pointer-events: none;
      z-index: 999;
    }
  </style>
</head>

<body>
  <input type="file" id="file-input" accept="audio/*" style="display:none">

  <div id="top-bar">
    <select id="file-select" aria-label="Loaded files"></select>
    <div id="top-bar-right">
      <button type="button" id="metronome-toggle" onclick="toggleMetronome()" title="Metronome click">♩</button>
      <button type="button" id="download-btn" onclick="downloadLoop()" title="Download loop as WAV">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 1v9M4 7l4 4 4-4M2 13h12"/>
        </svg>
      </button>
    </div>
  </div>

  <button type="button" id="theme-toggle" onclick="toggleTheme()" title="Theme">◑</button>

  <div id="main-area">
    <div id="status-hint">Drop an audio file anywhere</div>
  </div>

  <div id="bpm-section" class="control-section" aria-label="BPM: drag horizontally">
    <div id="bpm-fill" class="fill" aria-hidden="true"></div>
    <div id="detected-tick" aria-hidden="true"></div>
    <div id="bpm-readout" class="readout">— BPM</div>
  </div>

  <div id="loop-section" class="control-section" aria-label="Loop points: click to set A/B">
    <div id="loop-between">
      <div id="loop-hint">—</div>
      <input id="loop-length-input" type="text" inputmode="numeric" autocomplete="off" spellcheck="false">
    </div>
    <div id="loop-start-label" class="loop-beat-label"></div>
    <div id="loop-end-label" class="loop-beat-label"></div>
    <div id="loop-playhead"></div>
  </div>

  <div id="volume-section" class="control-section" aria-label="Volume: drag horizontally">
    <div id="volume-fill" class="fill" aria-hidden="true"></div>
    <div id="volume-readout" class="readout">100%</div>
  </div>

  <audio id="loop-click-audio" src="click.mp3" preload="auto"></audio>

  <script src="dist/loop.js"></script>
</body>

</html>
