<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BPM Loop Player</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reddit+Mono&display=swap">

  <style>
    :root {
      --bg-color: #1a1a1a;
      --text-color: rgba(255, 255, 255, 0.87);
      --border-color: rgba(255, 255, 255, 0.35);
      --section-track: transparent;
      --section-fill: rgba(255, 255, 255, 0.07);
      --section-divider: rgba(255, 255, 255, 0.1);
      --row-height: 88px;
      --volume-height: 63px;
    }

    :root[data-theme="light"] {
      --bg-color: #f0f0f0;
      --text-color: #000000;
      --border-color: rgba(0, 0, 0, 0.28);
      --section-track: transparent;
      --section-fill: rgba(0, 0, 0, 0.045);
      --section-divider: rgba(0, 0, 0, 0.08);
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; margin: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
      height: 100dvh;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    .control-section {
      position: relative;
      width: 100%;
      flex-shrink: 0;
      background: var(--section-track);
      overflow: hidden;
      cursor: pointer;
      touch-action: none;
    }

    #main-area {
      flex: 1 1 0;
      min-height: 60px;
      position: relative;
      overflow: hidden;
      border-bottom: 1px solid var(--section-divider);
    }

    #bpm-section {
      flex: 0 0 var(--row-height);
      border-bottom: 1px solid var(--section-divider);
    }

    #volume-section {
      flex: 0 0 var(--volume-height);
    }

    /* Loops container */
    #loops-container {
      flex: 0 0 auto;
      overflow-y: auto;
      max-height: var(--loops-max-height, 60dvh);
    }

    #add-loop-row {
      flex: 0 0 auto;
      display: none;
      justify-content: center;
      align-items: center;
      padding: 5px 0;
      border-bottom: 1px solid var(--section-divider);
    }

    #add-loop-btn {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(128, 128, 128, 0.1);
      border: none;
      color: rgba(128, 128, 128, 0.55);
      font-size: 1.15rem;
      line-height: 1;
      cursor: pointer;
      padding: 0;
      transition: background 0.15s;
    }

    #add-loop-btn:hover {
      background: rgba(128, 128, 128, 0.28);
    }

    #add-loop-btn:focus { outline: none; }

    /* Loop cards */
    .loop-card {
      position: relative;
      height: var(--row-height);
      width: 100%;
      flex-shrink: 0;
      overflow: hidden;
      cursor: grab;
      touch-action: none;
      border-bottom: 1px solid var(--section-divider);
      background: var(--section-track);
    }

    .loop-card.dragging { cursor: grabbing; }

    .loop-card:not(.active) {
      opacity: 0.42;
    }

    .loop-between {
      position: absolute;
      top: 0;
      bottom: 0;
      background: var(--section-fill);
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    .loop-hint {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Reddit Mono', monospace;
      font-size: clamp(1rem, 3.2vmin, 1.5rem);
      white-space: nowrap;
      opacity: 0.5;
      padding: 4px 8px;
      cursor: text;
      pointer-events: auto;
      border-bottom: 1px dashed transparent;
      transition: border-color 0.15s, opacity 0.15s;
    }

    .loop-card.active .loop-hint {
      opacity: 0.8;
    }

    .loop-card.active .loop-hint:hover {
      opacity: 1;
      border-bottom-color: currentColor;
    }

    .loop-card:not(.active) .loop-hint {
      opacity: 0.35;
    }

    .loop-length-input,
    .loop-start-input,
    .loop-end-input {
      display: none;
      position: absolute;
      top: 50%;
      font-family: 'Reddit Mono', monospace;
      font-size: clamp(1rem, 3.2vmin, 1.5rem);
      font-weight: inherit;
      background: var(--bg-color);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      padding: 2px 6px;
      text-align: center;
      outline: none;
      z-index: 3;
      user-select: text;
      -webkit-user-select: text;
    }

    .loop-length-input {
      width: 3.5em;
      transform: translate(-50%, -50%);
    }

    .loop-start-input,
    .loop-end-input {
      width: 5em;
      font-size: clamp(0.65rem, 2vmin, 0.9rem);
    }

    .loop-start-input,
    .loop-end-input {
      transform: translate(-50%, -50%);
    }

    .loop-beat-label {
      position: absolute;
      top: 50%;
      font-family: 'Reddit Mono', monospace;
      font-size: clamp(0.55rem, 1.8vmin, 0.8rem);
      opacity: 0.5;
      pointer-events: none;
      z-index: 1;
      white-space: nowrap;
    }

    .loop-card.active .loop-beat-label {
      pointer-events: auto;
      cursor: text;
      border-bottom: 1px dashed transparent;
      transition: border-color 0.15s, opacity 0.15s;
    }

    .loop-card.active .loop-beat-label:hover {
      opacity: 0.8;
      border-bottom-color: currentColor;
    }

    .loop-start-label {
      transform: translate(calc(-100% - 6px), -50%);
    }

    .loop-end-label {
      transform: translate(6px, -50%);
    }

    .loop-playhead {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 1px;
      background: var(--text-color);
      opacity: 0.6;
      pointer-events: none;
      z-index: 2;
      transition: opacity 0.2s;
    }

    body:not(.playing) .loop-playhead { opacity: 0; }

    .loop-paused-playhead {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 1px;
      background: #888;
      opacity: 0.7;
      pointer-events: none;
      z-index: 2;
    }

    body.playing .loop-paused-playhead { opacity: 0; }

    .loop-waveform {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* Loop card hover icons */
    .loop-card-icons {
      position: absolute;
      top: 5px;
      right: 6px;
      display: none;
      align-items: center;
      gap: 3px;
      z-index: 4;
    }

    .loop-card:hover .loop-card-icons {
      display: flex;
    }

    .loop-icon-btn {
      width: 22px;
      height: 22px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(128, 128, 128, 0.18);
      border: none;
      cursor: pointer;
      color: rgba(80, 80, 80, 0.9);
      padding: 0;
      font-size: 0.75rem;
      line-height: 1;
      transition: background 0.12s;
    }

    .loop-icon-btn:hover {
      background: rgba(128, 128, 128, 0.38);
    }

    .loop-icon-btn:focus { outline: none; }

    #detected-tick {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 1px;
      background: var(--section-divider);
      pointer-events: none;
      z-index: 0;
      display: none;
    }

    .fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 0%;
      background: var(--section-fill);
      z-index: 0;
      pointer-events: none;
    }

    .readout {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      z-index: 1;
      font-family: 'Reddit Mono', monospace;
      font-weight: 600;
      text-align: center;
      pointer-events: none;
      line-height: 1.2;
      padding: 0 0.5rem;
      text-shadow:
        0 0 20px var(--bg-color),
        0 0 8px var(--bg-color),
        0 1px 2px var(--bg-color);
      transition: opacity 0.3s ease;
    }

    #bpm-section .readout {
      font-size: clamp(1.4rem, 5vmin, 2.5rem);
    }

    #volume-section .readout {
      font-size: clamp(1.25rem, 4vmin, 2.25rem);
    }

    #status-hint {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Reddit Mono', monospace;
      font-size: clamp(1rem, 3vmin, 1.5rem);
      color: var(--text-color);
      opacity: 0.3;
      pointer-events: none;
      z-index: 1;
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
      max-width: 90%;
    }

    #top-bar {
      flex-shrink: 0;
      height: 40px;
      display: flex;
      align-items: center;
      padding: 0 8px;
      gap: 6px;
      z-index: 10;
      border-bottom: 1px solid var(--section-divider);
    }

    #top-bar-right {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }

    #theme-toggle {
      position: fixed;
      bottom: 16px;
      right: 16px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--text-color);
      color: var(--bg-color);
      opacity: 0;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
      font-size: 1.5rem;
      padding: 0;
      border: none;
      z-index: 10;
      transition: opacity 0.2s;
    }

    body:hover #theme-toggle { opacity: 1; }
    #theme-toggle:hover { transform: scale(1.08); }
    #theme-toggle:focus { outline: none; }

    #file-select {
      font-family: 'Reddit Mono', monospace;
      font-size: 0.78rem;
      background: transparent;
      color: rgba(128, 128, 128, 0.75);
      border: none;
      border-radius: 4px;
      padding: 6px 10px;
      cursor: pointer;
      flex: 1 1 0;
      min-width: 0;
      outline: none;
      display: none;
      -webkit-appearance: none;
      appearance: none;
      text-overflow: ellipsis;
      overflow: hidden;
      white-space: nowrap;
    }

    #file-select.has-files { display: block; }

    #metronome-toggle {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(128, 128, 128, 0.25);
      color: rgba(128, 128, 128, 0.75);
      cursor: pointer;
      font-size: 0.9rem;
      padding: 0;
      border: 1.5px solid transparent;
      opacity: 0;
      transition: opacity 0.2s;
    }

    body:hover #metronome-toggle { opacity: 1; }
    #metronome-toggle:hover { transform: scale(1.08); }
    #metronome-toggle:focus { outline: none; }
    #metronome-toggle.active {
      opacity: 1;
      background: var(--bg-color);
      color: var(--text-color);
      border-color: var(--text-color);
    }

    #transpose-container {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    #transpose-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(128, 128, 128, 0.25);
      color: rgba(128, 128, 128, 0.75);
      cursor: pointer;
      font-size: 0.75rem;
      font-family: 'Reddit Mono', monospace;
      padding: 0;
      border: 1.5px solid transparent;
      opacity: 0;
      transition: opacity 0.2s;
    }

    body:hover #transpose-btn { opacity: 1; }
    #transpose-btn:hover { transform: scale(1.08); }
    #transpose-btn:focus { outline: none; }
    #transpose-btn.active {
      opacity: 1;
      background: var(--bg-color);
      color: var(--text-color);
      border-color: var(--text-color);
    }

    #transpose-input {
      display: none;
      position: absolute;
      right: 0;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      text-align: center;
      font-family: 'Reddit Mono', monospace;
      font-size: 0.85rem;
      background: var(--bg-color);
      color: var(--text-color);
      border: 1.5px solid var(--text-color);
      outline: none;
      padding: 0;
      z-index: 10;
      user-select: text;
      -webkit-user-select: text;
    }

    body.drag-over::after {
      content: 'Drop audio file(s)';
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: 600;
      font-family: 'Reddit Mono', monospace;
      color: var(--text-color);
      background: rgba(128, 128, 128, 0.12);
      border: 3px dashed var(--border-color);
      border-radius: 16px;
      margin: 16px;
      pointer-events: none;
      z-index: 999;
    }
  </style>
</head>

<body>
  <input type="file" id="file-input" accept="audio/*" style="display:none">

  <div id="top-bar">
    <select id="file-select" aria-label="Loaded files"></select>
    <div id="top-bar-right">
      <button type="button" id="metronome-toggle" onclick="toggleMetronome()" title="Metronome click">♩</button>
      <div id="transpose-container">
        <button type="button" id="transpose-btn" title="Transpose (semitones)">0</button>
        <input type="text" id="transpose-input" autocomplete="off" spellcheck="false" placeholder="0">
      </div>
    </div>
  </div>

  <button type="button" id="theme-toggle" onclick="toggleTheme()" title="Theme">◑</button>

  <div id="loops-container"></div>
  <div id="add-loop-row">
    <button type="button" id="add-loop-btn" title="Add loop">+</button>
  </div>

  <div id="main-area">
    <div id="status-hint">Drop audio file(s) anywhere</div>
  </div>

  <div id="bpm-section" class="control-section" aria-label="BPM: drag horizontally">
    <div id="bpm-fill" class="fill" aria-hidden="true"></div>
    <div id="detected-tick" aria-hidden="true"></div>
    <div id="bpm-readout" class="readout">— BPM</div>
  </div>

  <div id="volume-section" class="control-section" aria-label="Volume: drag horizontally">
    <div id="volume-fill" class="fill" aria-hidden="true"></div>
    <div id="volume-readout" class="readout">100%</div>
  </div>

  <audio id="loop-click-audio" src="click.mp3" preload="auto"></audio>

  <script src="dist/loop.js"></script>
</body>

</html>
