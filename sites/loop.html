<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BPM Loop Player</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reddit+Mono&display=swap">

  <style>
    :root {
      --bg-color: #1a1a1a;
      --text-color: rgba(255, 255, 255, 0.87);
      --border-color: rgba(255, 255, 255, 0.35);
      --section-track: transparent;
      --section-fill: rgba(255, 255, 255, 0.07);
      --section-divider: rgba(255, 255, 255, 0.1);
    }

    :root[data-theme="light"] {
      --bg-color: #f0f0f0;
      --text-color: #000000;
      --border-color: rgba(0, 0, 0, 0.28);
      --section-track: transparent;
      --section-fill: rgba(0, 0, 0, 0.045);
      --section-divider: rgba(0, 0, 0, 0.08);
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; margin: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
      height: 100dvh;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    :root[data-theme="light"] body.focused {
      --bg-color: #f2f2f4;
      --text-color: rgba(0, 0, 0, 0.82);
      --section-fill: rgba(0, 0, 0, 0.05);
      --section-divider: rgba(0, 0, 0, 0.09);
    }

    :root[data-theme="light"] body.unfocused {
      --bg-color: #ddd;
      --text-color: #666;
    }

    :root[data-theme="dark"] body.focused {
      --bg-color: #252528;
      --text-color: rgba(255, 255, 255, 0.84);
      --section-fill: rgba(255, 255, 255, 0.07);
      --section-divider: rgba(255, 255, 255, 0.12);
    }

    :root[data-theme="dark"] body.unfocused {
      --bg-color: #1f1f23;
      --text-color: rgba(255, 255, 255, 0.58);
      --section-fill: rgba(255, 255, 255, 0.05);
      --section-divider: rgba(255, 255, 255, 0.078);
    }

    .control-section {
      position: relative;
      width: 100%;
      flex-shrink: 0;
      background: var(--section-track);
      overflow: hidden;
      cursor: pointer;
      touch-action: none;
    }

    #bpm-section {
      flex: 9 1 0;
      min-height: 0;
      border-bottom: 1px solid var(--section-divider);
    }

    #volume-section {
      flex: 1 1 0;
      min-height: 0;
    }

    #detected-tick {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 1px;
      background: var(--section-divider);
      pointer-events: none;
      z-index: 0;
      display: none;
    }

    .fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 0%;
      background: var(--section-fill);
      z-index: 0;
      pointer-events: none;
    }

    .readout {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      z-index: 1;
      font-family: 'Reddit Mono', monospace;
      font-weight: 600;
      text-align: center;
      pointer-events: none;
      line-height: 1.2;
      padding: 0 0.5rem;
      text-shadow:
        0 0 20px var(--bg-color),
        0 0 8px var(--bg-color),
        0 1px 2px var(--bg-color);
      transition: opacity 0.3s ease;
    }

    #bpm-section .readout {
      font-size: clamp(2.75rem, 14vmin, 7.5rem);
    }

    #volume-section .readout {
      font-size: clamp(1.25rem, 4vmin, 2.25rem);
    }

    body:not(.playing) .readout {
      opacity: 0.35;
    }

    #status-hint {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Reddit Mono', monospace;
      font-size: clamp(1rem, 3vmin, 1.5rem);
      color: var(--text-color);
      opacity: 0.3;
      pointer-events: none;
      z-index: 1;
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
      max-width: 90%;
    }

    #theme-toggle {
      position: fixed;
      bottom: calc(10vh + 16px);
      right: 16px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--text-color);
      color: var(--bg-color);
      opacity: 0;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
      font-size: 1.5rem;
      padding: 0;
      border: none;
      z-index: 10;
    }

    body:hover #theme-toggle { opacity: 1; }
    #theme-toggle:hover { transform: scale(1.08); }
    #theme-toggle:focus { outline: none; }

    body.drag-over::after {
      content: 'Drop audio file';
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: 600;
      font-family: 'Reddit Mono', monospace;
      color: var(--text-color);
      background: rgba(128, 128, 128, 0.12);
      border: 3px dashed var(--border-color);
      border-radius: 16px;
      margin: 16px;
      pointer-events: none;
      z-index: 999;
    }
  </style>
</head>

<body>
  <input type="file" id="file-input" accept="audio/*" style="display:none">

  <div id="bpm-section" class="control-section" aria-label="BPM: drag horizontally">
    <div id="bpm-fill" class="fill" aria-hidden="true"></div>
    <div id="detected-tick" aria-hidden="true"></div>
    <div id="bpm-readout" class="readout">— BPM</div>
    <div id="status-hint">Drop an audio file anywhere</div>
  </div>

  <div id="volume-section" class="control-section" aria-label="Volume: drag horizontally">
    <div id="volume-fill" class="fill" aria-hidden="true"></div>
    <div id="volume-readout" class="readout">100%</div>
  </div>

  <button type="button" id="theme-toggle" onclick="toggleTheme()" title="Theme">◑</button>

  <script src="dist/loop.js"></script>
</body>

</html>
