<!DOCTYPE html>
<html>

<head>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sometype+Mono&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sono&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Azeret+Mono&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Mono&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu+Mono&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Apercu+Mono&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Code+Pro&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Major+Mono+Display&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Mono&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reddit+Mono&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass+Mono&display=swap">

  <style>
    :root {
      --bg-color: #1a1a1a;
      --text-color: rgba(255, 255, 255, 0.87);
      --section-fill: rgba(255, 255, 255, 0.07);
    }

    :root[data-theme="light"] {
      --bg-color: #f0f0f0;
      --text-color: #000000;
      --section-fill: rgba(0, 0, 0, 0.045);
    }

    body {
      position: relative;
      min-height: 100vh;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-color);
      color: var(--text-color);
      transition: all 0.1s ease;
    }

    .timer-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }

    #current-timer {
      font-size: clamp(4.5rem, 15vw, 6rem);
      color: var(--text-color);
      transition: all 0.1s ease;
      font-family: 'Reddit Mono', monospace;
      margin-bottom: 1rem;
    }

    #total-timer {
      font-size: clamp(2.25rem, 7.5vw, 3rem);
      color: var(--text-color);
      opacity: 0.7;
      transition: all 0.1s ease;
      font-family: 'Reddit Mono', monospace;
    }

    #current-timer .hundredths,
    #total-timer .hundredths {
      font-size: 0.5em;
    }

    #timer-input {
      font-size: clamp(4.5rem, 15vw, 6rem);
      font-family: 'Reddit Mono', monospace;
      color: var(--text-color);
      background: transparent;
      border: none;
      border-bottom: 2px solid var(--text-color);
      outline: none;
      text-align: center;
      width: 7ch;
      opacity: 0.7;
      margin-bottom: 1rem;
      padding: 0;
      display: none;
    }

    @keyframes timer-blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    body.timer-finished #current-timer {
      animation: timer-blink 2s step-end infinite;
    }

    #theme-toggle,
    #reset-button {
      position: absolute;
      bottom: 20px;
      width: 44px;
      height: 44px;
      min-width: 44px;
      max-width: 44px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--text-color);
      color: var(--bg-color);
      opacity: 0;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
      font-size: 1.5rem;
      padding: 0;
      border: none;
      transition: all 0.1s ease;
      overflow: hidden;
      flex-shrink: 0;
    }

    #theme-toggle {
      right: 20px;
    }

    #reset-button {
      right: 74px;
      font-size: 1.2rem;
    }

    body:hover #theme-toggle,
    body:hover #reset-button {
      opacity: 1;
    }

    #theme-toggle:hover,
    #reset-button:hover {
      transform: scale(1.1);
    }

    #volume-bar {
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      width: clamp(40px, 6vw, 72px);
      background: transparent;
      overflow: hidden;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.2s;
      touch-action: none;
      z-index: 10;
    }

    body:hover #volume-bar {
      opacity: 1;
    }

    #volume-fill {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 50%;
      background: var(--section-fill);
      pointer-events: none;
    }

    #volume-readout {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      font-family: 'Reddit Mono', monospace;
      font-size: clamp(0.85rem, 2.5vw, 1.5rem);
      font-weight: 600;
      color: rgba(128, 128, 128, 0.7);
      text-align: center;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div class="timer-container">
    <div id="current-timer">00:00</div>
    <input type="text" id="timer-input" placeholder="mm:ss">
    <div id="total-timer">00:00</div>
  </div>
  <button id="reset-button" onclick="handleResetButton()">↻</button>
  <button id="theme-toggle" onclick="toggleTheme()">☀️</button>
  <div id="volume-bar" title="Bell volume">
    <div id="volume-fill"></div>
    <div id="volume-readout">50%</div>
  </div>
  <audio id="bell-audio" src="bell.mp3" preload="auto"></audio>
  <canvas id="pip-canvas" style="display: none;"></canvas>

  <script>
    let currentStartTime = null;
    let totalStartTime = null;
    let currentAccumulatedSeconds = 0;
    let totalAccumulatedSeconds = 0;
    let interval;
    let paused = false;
    let pipWindow = null;
    let canvas = null;
    let ctx = null;
    let mode = 'stopwatch';
    let editMode = false;
    let timerDurationSeconds = 0;
    let timerRemaining = 0;
    let timerSyncFloor = 0;
    let timerFinished = false;
    let bellTimeout = null;
    let bellVolume = 0.5;
    let draggingVolume = false;

    // Use system theme preference
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    setTheme(prefersDark ? 'dark' : 'light');

    // Listen for system theme changes
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
      setTheme(e.matches ? 'dark' : 'light');
    });

    // Initialize PIP support
    initializePIP();

    // Listen for visibility changes
    document.addEventListener('visibilitychange', handleVisibilityChange);

    document.addEventListener('keydown', handleKeyDown);

    // Any pointer interaction also dismisses the finished-timer alarm.
    document.addEventListener('pointerdown', dismissTimerAlarm);

    // Load saved stopwatch state or start new one
    loadStopwatchState();
    loadTimerState();
    loadBellVolume();
    setBellVolume(bellVolume);
    setupVolumeBar();

    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      const toggle = document.getElementById('theme-toggle');
      toggle.textContent = theme === 'light' ? '◐' : '◑';
    }

    function toggleTheme() {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'light' ? 'dark' : 'light';
      setTheme(newTheme);
    }

    function handleKeyDown(event) {
      if (editMode) return;

      if (timerFinished) {
        // While the finished-timer alarm is going, any key just dismisses it.
        event.preventDefault();
        dismissTimerAlarm();
        return;
      }

      if (event.key === 'Enter') {
        event.preventDefault();
        enterEditMode();
        return;
      }
      if (event.key === 'Escape') {
        if (mode === 'timer') {
          event.preventDefault();
          exitTimerMode();
        }
        return;
      }
      if (event.key === ' ') {
        event.preventDefault();
        togglePause();
        return;
      }
      if (mode === 'timer') {
        if ((event.key === 'r' || event.key === 'R') && !event.metaKey && !event.ctrlKey) {
          event.preventDefault();
          resetTotalTimer();
        }
        return;
      }
      if (event.key === 's' || event.key === 'S') {
        event.preventDefault();
        resetCurrentTimer();
      } else if (event.key === 'r' || event.key === 'R') {
        if (event.metaKey || event.ctrlKey) return;
        event.preventDefault();
        resetStopwatch();
      }
    }

    function getCurrentElapsedSeconds(now) {
      if (paused || currentStartTime === null) return currentAccumulatedSeconds;
      return currentAccumulatedSeconds + (now - currentStartTime) / 1000;
    }

    function getTotalElapsedSeconds(now) {
      if (paused || totalStartTime === null) return totalAccumulatedSeconds;
      return totalAccumulatedSeconds + (now - totalStartTime) / 1000;
    }

    function resetCurrentTimer() {
      if (paused) {
        currentAccumulatedSeconds = 0;
        updateDisplay(currentAccumulatedSeconds, totalAccumulatedSeconds);
      } else {
        currentStartTime = Date.now();
        currentAccumulatedSeconds = 0;
      }
      saveStopwatchState();
    }

    function pauseStopwatch() {
      if (paused || currentStartTime === null || totalStartTime === null) return;
      const now = Date.now();
      currentAccumulatedSeconds += (now - currentStartTime) / 1000;
      totalAccumulatedSeconds += (now - totalStartTime) / 1000;
      clearInterval(interval);
      interval = null;
      currentStartTime = null;
      totalStartTime = null;
      paused = true;
      updateDisplay(currentAccumulatedSeconds, totalAccumulatedSeconds);
      saveStopwatchState();
    }

    function unpauseStopwatch() {
      if (!paused) return;
      const now = Date.now();
      currentStartTime = now;
      totalStartTime = now;
      paused = false;
      interval = setInterval(updateStopwatch, 10);
      saveStopwatchState();
    }

    function togglePause() {
      if (paused) unpauseStopwatch();
      else pauseStopwatch();
    }

    function resetStopwatch() {
      clearInterval(interval);
      interval = null;
      const now = Date.now();
      currentStartTime = now;
      totalStartTime = now;
      currentAccumulatedSeconds = 0;
      totalAccumulatedSeconds = 0;
      paused = false;
      interval = setInterval(updateStopwatch, 10);
      saveStopwatchState();
    }

    function saveStopwatchState() {
      if (paused) {
        localStorage.setItem('stopwatch_paused', '1');
        localStorage.setItem('stopwatch_currentAccumulatedSeconds', currentAccumulatedSeconds.toString());
        localStorage.setItem('stopwatch_totalAccumulatedSeconds', totalAccumulatedSeconds.toString());
        localStorage.removeItem('stopwatch_currentStartTime');
        localStorage.removeItem('stopwatch_totalStartTime');
        return;
      }
      localStorage.removeItem('stopwatch_paused');
      if (totalStartTime !== null) {
        localStorage.setItem('stopwatch_totalStartTime', totalStartTime.toString());
        localStorage.setItem('stopwatch_totalAccumulatedSeconds', totalAccumulatedSeconds.toString());
      }
      if (currentStartTime !== null) {
        localStorage.setItem('stopwatch_currentStartTime', currentStartTime.toString());
        localStorage.setItem('stopwatch_currentAccumulatedSeconds', currentAccumulatedSeconds.toString());
      }
    }

    function loadStopwatchState() {
      if (localStorage.getItem('stopwatch_paused') === '1') {
        const savedCurrentAccum = localStorage.getItem('stopwatch_currentAccumulatedSeconds');
        const savedTotalAccum = localStorage.getItem('stopwatch_totalAccumulatedSeconds');
        currentAccumulatedSeconds = savedCurrentAccum != null ? parseFloat(savedCurrentAccum) : 0;
        totalAccumulatedSeconds = savedTotalAccum != null ? parseFloat(savedTotalAccum) : 0;
        currentStartTime = null;
        totalStartTime = null;
        paused = true;
        updateDisplay(currentAccumulatedSeconds, totalAccumulatedSeconds);
        return;
      }

      paused = false;
      const savedTotalStartTime = localStorage.getItem('stopwatch_totalStartTime');
      const savedTotalAccumulatedSeconds = localStorage.getItem('stopwatch_totalAccumulatedSeconds');
      const savedCurrentStartTime = localStorage.getItem('stopwatch_currentStartTime');
      const savedCurrentAccumulatedSeconds = localStorage.getItem('stopwatch_currentAccumulatedSeconds');

      const now = Date.now();

      if (savedTotalStartTime && savedTotalAccumulatedSeconds) {
        // Restore saved state
        const savedTotalStart = parseInt(savedTotalStartTime);
        const savedTotalAccum = parseFloat(savedTotalAccumulatedSeconds);
        
        // Calculate how much time has passed since the saved start time
        const timeSinceSave = (now - savedTotalStart) / 1000;
        
        // Add the elapsed time to accumulated seconds and reset start time to now
        totalAccumulatedSeconds = savedTotalAccum + timeSinceSave;
        totalStartTime = now;
        
        if (savedCurrentStartTime && savedCurrentAccumulatedSeconds) {
          const savedCurrentStart = parseInt(savedCurrentStartTime);
          const savedCurrentAccum = parseFloat(savedCurrentAccumulatedSeconds);
          
          const timeSinceCurrentSave = (now - savedCurrentStart) / 1000;
          currentAccumulatedSeconds = savedCurrentAccum + timeSinceCurrentSave;
          currentStartTime = now;
        } else {
          // If no current timer saved, start it fresh
          currentStartTime = now;
          currentAccumulatedSeconds = 0;
        }
      } else {
        // No saved state, start fresh
        startStopwatch();
        saveStopwatchState();
        return;
      }
      
      // Start the update interval
      interval = setInterval(updateStopwatch, 10);
    }

    function startStopwatch() {
      paused = false;
      const now = Date.now();
      currentStartTime = now;
      totalStartTime = now;
      interval = setInterval(updateStopwatch, 10);
      saveStopwatchState();
    }

    function updateStopwatch() {
      if (paused) return;
      const now = Date.now();
      
      // Calculate elapsed time based on actual wall-clock time
      // This ensures accuracy even when the tab is in the background
      const currentElapsed = getCurrentElapsedSeconds(now);
      const totalElapsed = getTotalElapsedSeconds(now);

      updateDisplay(currentElapsed, totalElapsed);
      if (mode === 'timer') updateTimerMode(totalElapsed);
    }

    function updateDisplay(currentSeconds, totalSeconds) {
      const currentTotalSeconds = Math.floor(currentSeconds);
      const currentMinutes = Math.floor(currentTotalSeconds / 60);
      const currentSecs = currentTotalSeconds % 60;
      const currentHundredths = Math.floor((currentSeconds % 1) * 100);

      // Update total timer (the grey stopwatch — keeps running even in timer mode)
      const totalTotalSeconds = Math.floor(totalSeconds);
      const totalMinutes = Math.floor(totalTotalSeconds / 60);
      const totalSecs = totalTotalSeconds % 60;
      const totalTimeString = `${String(totalMinutes).padStart(2, '0')}:${String(totalSecs).padStart(2, '0')}`;
      document.getElementById('total-timer').innerHTML = totalTimeString;

      // In timer mode the countdown owns the big display and PIP, so leave those alone.
      if (mode === 'stopwatch') {
        const currentTimeString = `${String(currentMinutes).padStart(2, '0')}:${String(currentSecs).padStart(2, '0')}.<span class="hundredths">${String(currentHundredths).padStart(2, '0')}</span>`;
        document.getElementById('current-timer').innerHTML = currentTimeString;

        if (pipWindow && canvas && ctx) {
          updatePIPCanvas(currentTotalSeconds, currentMinutes, currentSecs, currentHundredths, totalTotalSeconds, totalMinutes, totalSecs);
        }
      }
    }

    // --- Timer mode ---

    function formatCountdown(totalSeconds) {
      totalSeconds = Math.max(0, totalSeconds);
      const h = Math.floor(totalSeconds / 3600);
      const m = Math.floor((totalSeconds % 3600) / 60);
      const s = totalSeconds % 60;
      if (h > 0) {
        return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      }
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function parseTimeInput(value) {
      value = value.trim();
      if (value === '') return 0;
      if (value.includes(':')) {
        const parts = value.split(':').map(x => parseInt(x, 10) || 0);
        if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
        if (parts.length === 2) return parts[0] * 60 + parts[1];
        return parts[0];
      }
      const num = parseFloat(value);
      if (!isNaN(num) && num > 0) return Math.round(num * 60);
      return 0;
    }

    function enterEditMode() {
      if (editMode) return;
      editMode = true;
      const timerEl = document.getElementById('current-timer');
      const inputEl = document.getElementById('timer-input');
      inputEl.value = timerDurationSeconds > 0 ? formatCountdown(timerDurationSeconds) : '';
      timerEl.style.display = 'none';
      inputEl.style.display = 'block';
      inputEl.focus();
      inputEl.select();
      inputEl.addEventListener('keydown', handleInputKey);
      inputEl.addEventListener('blur', handleInputBlur);
    }

    function handleInputKey(e) {
      if (e.key === 'Enter') {
        e.stopPropagation();
        exitEditMode(true);
      } else if (e.key === 'Escape') {
        e.stopPropagation();
        exitEditMode(false);
      }
    }

    function handleInputBlur() {
      exitEditMode(false);
    }

    function exitEditMode(confirm) {
      if (!editMode) return;
      editMode = false;
      const timerEl = document.getElementById('current-timer');
      const inputEl = document.getElementById('timer-input');
      inputEl.removeEventListener('keydown', handleInputKey);
      inputEl.removeEventListener('blur', handleInputBlur);
      timerEl.style.display = '';
      inputEl.style.display = 'none';

      if (confirm) {
        const seconds = parseTimeInput(inputEl.value);
        if (seconds > 0) startTimerMode(seconds);
      }
    }

    function startTimerMode(durationSeconds) {
      // The countdown is driven by the total stopwatch's elapsed seconds, so it
      // stays tick-aligned with the grey stopwatch and pauses/resumes with it.
      stopBellLoop();

      mode = 'timer';
      timerDurationSeconds = durationSeconds;
      timerRemaining = durationSeconds;
      timerSyncFloor = Math.floor(getTotalElapsedSeconds(Date.now()));
      timerFinished = false;

      document.body.classList.remove('timer-finished');
      saveTimerState();
      updateTimerMode();
    }

    function updateTimerMode(totalElapsed) {
      if (timerFinished) return;
      if (totalElapsed === undefined) totalElapsed = getTotalElapsedSeconds(Date.now());
      const currentFloor = Math.floor(totalElapsed);
      if (currentFloor > timerSyncFloor) {
        timerRemaining -= currentFloor - timerSyncFloor;
      }
      timerSyncFloor = currentFloor;
      if (timerRemaining <= 0) {
        finishTimer();
        return;
      }
      const text = formatCountdown(timerRemaining);
      document.getElementById('current-timer').textContent = text;
      if (pipWindow && canvas && ctx) drawTimerPIP(text);
    }

    function finishTimer() {
      timerFinished = true;
      timerRemaining = 0;
      document.getElementById('current-timer').textContent = '00:00';
      document.body.classList.add('timer-finished');
      saveTimerState();
      startBellLoop();
      if (pipWindow && canvas && ctx) drawTimerPIP('00:00');
    }

    function exitTimerMode() {
      mode = 'stopwatch';
      timerFinished = false;
      stopBellLoop();
      document.body.classList.remove('timer-finished');
      saveTimerState();
      // The stopwatch was never stopped — just refresh the big display back to it.
      const now = Date.now();
      updateDisplay(getCurrentElapsedSeconds(now), getTotalElapsedSeconds(now));
    }

    function dismissTimerAlarm() {
      if (timerFinished) exitTimerMode();
    }

    function resetTotalTimer() {
      if (paused) {
        totalAccumulatedSeconds = 0;
        updateDisplay(currentAccumulatedSeconds, totalAccumulatedSeconds);
      } else {
        totalStartTime = Date.now();
        totalAccumulatedSeconds = 0;
      }
      if (mode === 'timer') {
        // Re-anchor the countdown to the freshly reset stopwatch without changing
        // how much time is left on it.
        timerSyncFloor = Math.floor(getTotalElapsedSeconds(Date.now()));
        saveTimerState();
      }
      saveStopwatchState();
    }

    function saveTimerState() {
      if (mode === 'timer') {
        localStorage.setItem('stopwatch_timer_mode', 'timer');
        localStorage.setItem('stopwatch_timer_durationSeconds', String(timerDurationSeconds));
        localStorage.setItem('stopwatch_timer_remaining', String(timerRemaining));
        localStorage.setItem('stopwatch_timer_syncFloor', String(timerSyncFloor));
        localStorage.setItem('stopwatch_timer_finished', timerFinished ? '1' : '0');
      } else {
        localStorage.removeItem('stopwatch_timer_mode');
        localStorage.removeItem('stopwatch_timer_durationSeconds');
        localStorage.removeItem('stopwatch_timer_remaining');
        localStorage.removeItem('stopwatch_timer_syncFloor');
        localStorage.removeItem('stopwatch_timer_finished');
      }
    }

    function loadTimerState() {
      if (localStorage.getItem('stopwatch_timer_mode') !== 'timer') return;
      const dur = parseInt(localStorage.getItem('stopwatch_timer_durationSeconds'), 10);
      const rem = parseInt(localStorage.getItem('stopwatch_timer_remaining'), 10);
      const sync = parseInt(localStorage.getItem('stopwatch_timer_syncFloor'), 10);
      if (!Number.isFinite(dur) || !Number.isFinite(rem) || !Number.isFinite(sync)) return;

      mode = 'timer';
      timerDurationSeconds = dur;
      timerRemaining = rem;
      timerSyncFloor = sync;
      timerFinished = localStorage.getItem('stopwatch_timer_finished') === '1';

      // The stopwatch keeps running while the page is closed, so catch the
      // countdown up by however many whole stopwatch-seconds have gone by.
      const currentFloor = Math.floor(getTotalElapsedSeconds(Date.now()));
      if (currentFloor > timerSyncFloor) {
        timerRemaining -= currentFloor - timerSyncFloor;
      }
      timerSyncFloor = currentFloor;
      if (timerRemaining <= 0) {
        timerRemaining = 0;
        timerFinished = true;
      }

      if (timerFinished) {
        document.getElementById('current-timer').textContent = '00:00';
        document.body.classList.add('timer-finished');
      } else {
        document.getElementById('current-timer').textContent = formatCountdown(timerRemaining);
      }
      saveTimerState();
    }

    function handleResetButton() {
      if (mode === 'timer') resetTotalTimer();
      else resetStopwatch();
    }

    function playBellOnce() {
      const audio = document.getElementById('bell-audio');
      audio.volume = bellVolume;
      audio.currentTime = 0;
      audio.play().catch(err => console.error('Error playing bell:', err));
    }

    function loadBellVolume() {
      const saved = localStorage.getItem('stopwatch_bell_volume');
      if (saved !== null) {
        const v = parseFloat(saved);
        if (Number.isFinite(v)) bellVolume = Math.min(1, Math.max(0, v));
      }
    }

    function saveBellVolume() {
      localStorage.setItem('stopwatch_bell_volume', String(bellVolume));
    }

    function setBellVolume(v) {
      bellVolume = Math.min(1, Math.max(0, v));
      document.getElementById('volume-fill').style.height = `${bellVolume * 100}%`;
      document.getElementById('volume-readout').textContent = `${Math.round(bellVolume * 100)}%`;
      document.getElementById('bell-audio').volume = bellVolume;
    }

    function volumeFromClientY(clientY) {
      const r = document.getElementById('volume-bar').getBoundingClientRect();
      if (r.height <= 0) return bellVolume;
      return Math.min(1, Math.max(0, (r.bottom - clientY) / r.height));
    }

    function setupVolumeBar() {
      const bar = document.getElementById('volume-bar');
      bar.addEventListener('pointerdown', e => {
        bar.setPointerCapture(e.pointerId);
        draggingVolume = true;
        setBellVolume(volumeFromClientY(e.clientY));
      });
      bar.addEventListener('pointermove', e => {
        if (!draggingVolume) return;
        setBellVolume(volumeFromClientY(e.clientY));
      });
      bar.addEventListener('pointerup', e => {
        if (!draggingVolume) return;
        draggingVolume = false;
        try { bar.releasePointerCapture(e.pointerId); } catch (_) { /* ignore */ }
        saveBellVolume();
        playBellOnce();
      });
      bar.addEventListener('pointercancel', () => {
        draggingVolume = false;
      });
    }

    function scheduleNextBell() {
      bellTimeout = setTimeout(playBellOnce, 1500);
    }

    function startBellLoop() {
      const audio = document.getElementById('bell-audio');
      audio.loop = false;
      audio.removeEventListener('ended', scheduleNextBell);
      audio.addEventListener('ended', scheduleNextBell);
      playBellOnce();
    }

    function stopBellLoop() {
      const audio = document.getElementById('bell-audio');
      audio.removeEventListener('ended', scheduleNextBell);
      audio.pause();
      audio.currentTime = 0;
      if (bellTimeout != null) {
        clearTimeout(bellTimeout);
        bellTimeout = null;
      }
    }

    function drawTimerPIP(text) {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const bgColor = currentTheme === 'light' ? '#f0f0f0' : '#1a1a1a';
      const textColor = currentTheme === 'light' ? '#000000' : 'rgba(255, 255, 255, 0.87)';
      const logicalWidth = parseInt(canvas.style.width) || 400;
      const logicalHeight = parseInt(canvas.style.height) || 300;
      ctx.fillStyle = bgColor;
      ctx.fillRect(0, 0, logicalWidth, logicalHeight);
      ctx.fillStyle = textColor;
      ctx.font = 'bold 72px "Reddit Mono", monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, logicalWidth / 2, logicalHeight / 2);
    }

    function initializePIP() {
      canvas = document.getElementById('pip-canvas');
      ctx = canvas.getContext('2d');

      // Set high DPI resolution
      const dpr = window.devicePixelRatio || 1;
      canvas.width = 400 * dpr;
      canvas.height = 300 * dpr;
      canvas.style.width = '400px';
      canvas.style.height = '300px';
      ctx.scale(dpr, dpr);
    }

    function handleVisibilityChange() {
      if (document.hidden && 'pictureInPictureEnabled' in document) {
        enterPIP();
      } else if (!document.hidden && pipWindow) {
        exitPIP();
      }
    }

    async function enterPIP() {
      if (!canvas || pipWindow) return;

      try {
        // Calculate current elapsed times
        const now = Date.now();
        const currentElapsed = getCurrentElapsedSeconds(now);
        const totalElapsed = getTotalElapsedSeconds(now);
        
        // Initialize canvas with current time display
        const currentTotalSeconds = Math.floor(currentElapsed);
        const currentMinutes = Math.floor(currentTotalSeconds / 60);
        const currentSecs = currentTotalSeconds % 60;
        const currentHundredths = Math.floor((currentElapsed % 1) * 100);
        const totalTotalSeconds = Math.floor(totalElapsed);
        const totalMinutes = Math.floor(totalTotalSeconds / 60);
        const totalSecs = totalTotalSeconds % 60;
        if (mode === 'timer') {
          drawTimerPIP(timerFinished ? '00:00' : formatCountdown(timerRemaining));
        } else {
          updatePIPCanvas(currentTotalSeconds, currentMinutes, currentSecs, currentHundredths, totalTotalSeconds, totalMinutes, totalSecs);
        }

        // Create a video element to stream the canvas
        const video = document.createElement('video');
        video.srcObject = canvas.captureStream(30);
        video.muted = true;

        // Wait for metadata to load before requesting PIP
        await new Promise((resolve) => {
          video.addEventListener('loadedmetadata', resolve, { once: true });
          video.play();
        });

        pipWindow = await video.requestPictureInPicture();

        pipWindow.addEventListener('resize', () => {
          const dpr = window.devicePixelRatio || 1;
          canvas.width = pipWindow.width * dpr;
          canvas.height = pipWindow.height * dpr;
          canvas.style.width = pipWindow.width + 'px';
          canvas.style.height = pipWindow.height + 'px';
          ctx.scale(dpr, dpr);

          const now = Date.now();
          const currentElapsed = getCurrentElapsedSeconds(now);
          const totalElapsed = getTotalElapsedSeconds(now);

          // Redraw content after resize
          const currentTotalSeconds = Math.floor(currentElapsed);
          const currentMinutes = Math.floor(currentTotalSeconds / 60);
          const currentSecs = currentTotalSeconds % 60;
          const currentHundredths = Math.floor((currentElapsed % 1) * 100);
          const totalTotalSeconds = Math.floor(totalElapsed);
          const totalMinutes = Math.floor(totalTotalSeconds / 60);
          const totalSecs = totalTotalSeconds % 60;
          if (mode === 'timer') {
            drawTimerPIP(timerFinished ? '00:00' : formatCountdown(timerRemaining));
          } else {
            updatePIPCanvas(currentTotalSeconds, currentMinutes, currentSecs, currentHundredths, totalTotalSeconds, totalMinutes, totalSecs);
          }
        });

      } catch (error) {
        console.error('Failed to enter PIP mode:', error);
      }
    }

    function exitPIP() {
      if (pipWindow) {
        document.exitPictureInPicture();
        pipWindow = null;
      }
    }

    function updatePIPCanvas(currentTotalSeconds, currentMinutes, currentSecs, currentHundredths, totalTotalSeconds, totalMinutes, totalSecs) {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const bgColor = currentTheme === 'light' ? '#f0f0f0' : '#1a1a1a';
      const textColor = currentTheme === 'light' ? '#000000' : 'rgba(255, 255, 255, 0.87)';
      const secondaryTextColor = currentTheme === 'light' ? '#666666' : 'rgba(255, 255, 255, 0.5)';

      // Use logical dimensions for drawing
      const logicalWidth = parseInt(canvas.style.width) || 400;
      const logicalHeight = parseInt(canvas.style.height) || 300;

      ctx.fillStyle = bgColor;
      ctx.fillRect(0, 0, logicalWidth, logicalHeight);

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      // Draw current timer (top)
      ctx.fillStyle = textColor;
      ctx.font = 'bold 64px "Reddit Mono", monospace';
      const currentTimeText = `${String(currentMinutes).padStart(2, '0')}:${String(currentSecs).padStart(2, '0')}.${String(currentHundredths).padStart(2, '0')}`;
      const centerX = logicalWidth / 2;
      const currentCenterY = logicalHeight * 0.35;

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(currentTimeText, centerX, currentCenterY);

      // Draw total timer (bottom)
      ctx.fillStyle = secondaryTextColor;
      ctx.font = 'bold 64px "Reddit Mono", monospace';
      const totalTimeText = `${String(totalMinutes).padStart(2, '0')}:${String(totalSecs).padStart(2, '0')}.${String(currentHundredths).padStart(2, '0')}`;
      const totalCenterY = logicalHeight * 0.65;

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(totalTimeText, centerX, totalCenterY);
    }
  </script>
