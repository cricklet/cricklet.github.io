<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sites</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reddit+Mono&display=swap" />
<style>
  :root {
    --bg-color: #1a1a1a;
    --text-color: rgba(255, 255, 255, 0.87);
    --section-divider: rgba(255, 255, 255, 0.1);
    --muted: rgba(255, 255, 255, 0.4);
  }
  :root[data-theme="light"] {
    --bg-color: #f0f0f0;
    --text-color: #000000;
    --section-divider: rgba(0, 0, 0, 0.08);
    --muted: rgba(0, 0, 0, 0.45);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    background: var(--bg-color);
    color: var(--text-color);
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
    transition: background 0.1s ease, color 0.1s ease;
  }
  /* Pseudo-element spacers: ::after grows at 2× the rate of ::before, so the
     space below the list ends up roughly twice the space above. ::before keeps
     a 1.5rem minimum so the list never pins flush against the top when the
     viewport is short. */
  body::before {
    content: "";
    flex: 1 0 1.5rem;
    max-height: 6rem;
  }
  body::after {
    content: "";
    flex: 2 0 0;
  }

  #grid {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 1rem;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: flex-start;
    align-content: flex-start;
    gap: 4rem;
  }

  /* Each section is a flex item with a sensible min-width; once two of them
     can't fit (screen too narrow), flex-wrap drops the second group to its
     own row — automatic single-column on small screens. */
  .section-group {
    flex: 1 1 240px;
    max-width: 320px;
    min-width: 0;
  }

  .section-label {
    margin: 0;
    padding: 0 0.6rem 0.5rem;
    font-family: 'Reddit Mono', monospace;
    font-size: 0.7rem;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .row {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    padding: 0.6rem;
    border-bottom: 1px solid var(--section-divider);
    text-decoration: none;
    color: var(--text-color);
  }
  .row:first-of-type {
    border-top: 1px solid var(--section-divider);
  }
  .row:hover .name {
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .row .icon {
    flex-shrink: 0;
    width: 1.5rem;
    text-align: center;
    font-size: 1.15rem;
    line-height: 1;
  }
  .row .name {
    font-family: 'Reddit Mono', monospace;
    font-size: 0.9rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

</style>
</head>
<body>
  <main id="grid"></main>

  <script>
    const SECTIONS = [
      { id: "time",  label: "time" },
      { id: "music", label: "music" },
    ];

    const SITES = [
      { id: "loop",        href: "loop.html",        name: "BPM Loop Player",  icon: "\u{1F501}", section: "music" },
      { id: "metronome",   href: "metronome.html",   name: "Metronome",        icon: "\u{1F3B5}", section: "music" },
      { id: "tuner",       href: "tuner.html",       name: "Tuner",            icon: "\u{1F39A}️", section: "music" },
      { id: "tapper",      href: "tapper.html",      name: "Tap Tempo",        icon: "\u{1F446}", section: "music" },
      { id: "transpose",   href: "transpose.html",   name: "Chord Transposer", icon: "\u{1F3BC}", section: "music" },
      { id: "trumpet",     href: "trumpet.html",     name: "Trumpet",          icon: "\u{1F3BA}", section: "music" },
      { id: "stopwatch",   href: "stopwatch.html",   name: "Stopwatch",        icon: "⏱️",       section: "time"  },
      { id: "pomodoro",    href: "pomodoro.html",    name: "Pomodoro",         icon: "\u{1F345}", section: "time"  },
      { id: "bell",        href: "bell.html",        name: "Bell",             icon: "\u{1F514}", section: "time"  },
    ];

    const grid = document.getElementById("grid");

    function render() {
      grid.innerHTML = "";
      for (const section of SECTIONS) {
        const group = document.createElement("div");
        group.className = "section-group";
        group.dataset.section = section.id;

        const label = document.createElement("h2");
        label.className = "section-label";
        label.textContent = section.label;
        group.appendChild(label);

        for (const site of SITES) {
          if (site.section !== section.id) continue;
          const row = document.createElement("a");
          row.className = "row";
          row.href = site.href;
          row.dataset.id = site.id;
          row.innerHTML =
            '<span class="icon"></span><span class="name"></span>';
          row.querySelector(".icon").textContent = site.icon;
          row.querySelector(".name").textContent = site.name;
          group.appendChild(row);
        }

        grid.appendChild(group);
      }
    }

    // Theme: dark by default, follows the system — matches the sibling pages.
    function setTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme);
    }
    const darkQuery = window.matchMedia("(prefers-color-scheme: dark)");
    setTheme(darkQuery.matches ? "dark" : "light");
    darkQuery.addEventListener("change", (e) => setTheme(e.matches ? "dark" : "light"));

    render();
  </script>
</body>
</html>
