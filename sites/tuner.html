<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tuner</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reddit+Mono&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.5/build/cjs/vexflow.js"></script>

  <style>
    :root {
      color-scheme: dark;
      --bg-color: #1a1a1a;
      --text-color: rgba(255, 255, 255, 0.87);
      --border-color: rgba(255, 255, 255, 0.35);
      --section-fill: rgba(255, 255, 255, 0.07);
      --section-divider: rgba(255, 255, 255, 0.1);
    }

    :root[data-theme="light"] {
      color-scheme: light;
      --bg-color: #f0f0f0;
      --text-color: #000000;
      --border-color: rgba(0, 0, 0, 0.28);
      --section-fill: rgba(0, 0, 0, 0.045);
      --section-divider: rgba(0, 0, 0, 0.08);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ── Layout ── */
    #main {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: row;
      align-items: stretch;
      overflow: hidden;
    }

    #tuner-left {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    #tuner-content {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(4px, 1.8vh, 10px);
      padding: min(52px, 9vh) 8px 8px;
      position: relative;
      overflow: hidden;
    }

    #meter-wrap {
      /* width-based height cap: aspect-ratio 2:1 so 58vh wide → 29vh tall */
      width: min(92%, 480px, 58vh);
      flex-shrink: 0;
    }

    #meter-canvas {
      width: 100%;
      aspect-ratio: 2 / 1;
      display: block;
    }

    #meter-labels {
      width: min(92%, 480px, 58vh);
      display: flex;
      justify-content: space-between;
      font-family: 'Reddit Mono', monospace;
      font-size: clamp(0.6rem, 2vmin, 0.75rem);
      opacity: 0.28;
      padding: 0 4%;
      margin-top: -4px;
      flex-shrink: 0;
    }

    #note-area {
      text-align: center;
      font-family: 'Reddit Mono', monospace;
      flex-shrink: 0;
    }

    #note-display {
      display: inline-flex;
      align-items: baseline;
      gap: 1px;
      line-height: 1;
    }

    #note-letter {
      font-size: clamp(2rem, 15vmin, 7rem);
      font-weight: 700;
    }

    #note-accidental {
      font-size: clamp(1rem, 7.5vmin, 3.5rem);
      font-weight: 700;
      align-self: flex-start;
      margin-top: 0.18em;
    }

    #note-octave {
      font-size: clamp(0.85rem, 5.5vmin, 2.25rem);
      font-weight: 400;
      opacity: 0.45;
      align-self: flex-end;
      margin-bottom: 0.12em;
    }

    #freq-display {
      font-family: 'Reddit Mono', monospace;
      font-size: clamp(0.65rem, 2.2vmin, 1.1rem);
      opacity: 0.45;
      min-height: 1.2em;
      flex-shrink: 0;
    }

    #cents-display {
      font-family: 'Reddit Mono', monospace;
      font-size: clamp(0.65rem, 2.2vmin, 1.1rem);
      min-height: 1.2em;
      flex-shrink: 0;
      transition: color 0.12s;
    }

    #cents-display { transition: color 0.08s; }

    #status-hint {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Reddit Mono', monospace;
      font-size: clamp(0.7rem, 2vmin, 0.9rem);
      color: var(--text-color);
      opacity: 0.3;
      pointer-events: none;
      white-space: nowrap;
    }

    /* ── Right: staff ── */
    #staff-panel {
      flex: 0 0 clamp(120px, 22vw, 170px);
      display: flex;
      align-items: center;
      justify-content: center;
      border-left: 0.5px solid var(--section-divider);
      overflow: hidden;
      padding: 0 10px;
    }

    #staff-container {
      width: 100%;
      height: min(220px, 65vh);
    }

    #staff-container svg { display: block; }

    /* ── dB graph (full-panel background) ── */
    #db-graph-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }


    /* ── Top-left icon buttons ── */
    .icon-btn {
      position: fixed;
      top: 10px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      border: 1.5px solid transparent;
      z-index: 10;
      opacity: 0;
      transition: opacity 0.2s;
      background: rgba(128, 128, 128, 0.25);
      color: rgba(128, 128, 128, 0.75);
    }

    .icon-btn:hover { transform: scale(1.08); }
    .icon-btn:focus { outline: none; }

    #trumpet-btn { left: 10px; font-size: 0.7rem; }

    #accidentals-btn { left: 48px; font-size: 0.85rem; }

    #playback-btn { left: 86px; font-size: 0.95rem; }

    #replay-btn { left: 124px; font-size: 0.9rem; }

    /* Shift icon buttons right when the playback volume bar is visible */
    body.playback-on #trumpet-btn     { left: 54px; }
    body.playback-on #accidentals-btn { left: 92px; }
    body.playback-on #playback-btn    { left: 130px; }
    body.playback-on #replay-btn      { left: 168px; }

    /* ── Playback volume bar (vertical, far-left) ── */
    #playback-volume {
      position: relative;
      flex: 0 0 44px;
      background: transparent;
      border-right: 0.5px solid var(--section-divider);
      cursor: pointer;
      touch-action: none;
      overflow: hidden;
      display: none;
    }
    body.playback-on #playback-volume { display: block; }

    #playback-volume-fill {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 50%;
      background: var(--section-fill);
      pointer-events: none;
      transition: height 0.04s linear;
    }

    #playback-volume-readout {
      position: absolute;
      left: 50%;
      bottom: 10px;
      transform: translateX(-50%);
      font-family: 'Reddit Mono', monospace;
      font-size: 0.7rem;
      opacity: 0.45;
      pointer-events: none;
    }

    .icon-btn.active {
      background: var(--bg-color);
      color: var(--text-color);
      border-color: var(--text-color);
    }

    /* ── Input-device dropdown (top-right) ── */
    #device-select {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 10;
      max-width: min(45vw, 200px);
      opacity: 0;
      transition: opacity 0.2s, background-color 0.15s;
      font-family: 'Reddit Mono', monospace;
      font-size: 0.72rem;
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: var(--section-fill);
      color: var(--text-color);
      cursor: pointer;
      text-overflow: ellipsis;
    }

    #device-select:hover { background: var(--section-divider); }
    #device-select:focus { opacity: 1; outline: none; }

    /* Reveal-on-hover only where hovering is real; on touch devices a tap
       would otherwise latch :hover on and leave the controls stuck visible. */
    @media (hover: hover) {
      body:hover .icon-btn { opacity: 1; }
      body:hover #device-select { opacity: 1; }
    }
    @media (hover: none) {
      .icon-btn, #device-select { opacity: 1; }
    }

    /* ── Responsive: shrink chrome on small screens ── */
    @media (max-width: 560px) {
      #staff-panel { flex-basis: clamp(76px, 17vw, 110px); padding: 0 5px; }
      #tuner-content { padding-top: min(40px, 7vh); }
      .icon-btn { width: 26px; height: 26px; }
      #device-select { font-size: 0.65rem; max-width: 38vw; }
    }

    @media (max-width: 380px) {
      /* Drop the secondary staff panel so the meter gets the full width */
      #staff-panel { display: none; }
    }

    @media (max-height: 420px) {
      #tuner-content { padding-top: 6px; gap: 2px; }
    }
  </style>
</head>

<body>
  <div id="main">
    <div id="playback-volume" aria-label="Playback volume — drag vertically">
      <div id="playback-volume-fill"></div>
      <div id="playback-volume-readout">50%</div>
    </div>
    <div id="tuner-left">
      <canvas id="db-graph-canvas"></canvas>
      <div id="tuner-content">
        <div id="meter-wrap">
          <canvas id="meter-canvas" width="600" height="300"></canvas>
        </div>
        <div id="meter-labels">
          <span>♭ flat</span>
          <span>sharp ♯</span>
        </div>

        <div id="note-area">
          <div id="note-display">
            <span id="note-letter">—</span><span id="note-accidental"></span><span id="note-octave"></span>
          </div>
          <div id="freq-display"></div>
          <div id="cents-display"></div>
        </div>

        <div id="status-hint">Tap anywhere to start</div>
      </div>

    </div>

    <div id="staff-panel">
      <div id="staff-container"></div>
    </div>
  </div>

  <button type="button" id="trumpet-btn"    class="icon-btn" onclick="toggleTrumpet()"      title="Bb trumpet (transposing)">🎺</button>
  <button type="button" id="accidentals-btn" class="icon-btn" onclick="toggleAccidentals()" title="Toggle sharps / flats">♯</button>
  <button type="button" id="playback-btn"    class="icon-btn" onclick="togglePlayback()"    title="Play in-tune pitch of detected note">♪</button>
  <button type="button" id="replay-btn"      class="icon-btn" onclick="downloadReplay()"    title="Download buffered audio (press 1–9 for last 10–90 s, 0 for 100 s)">⬇</button>

  <select id="device-select" title="Audio input source" aria-label="Audio input source"></select>

  <script src="dist/tuner.js"></script>
</body>

</html>
