<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trumpet</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reddit+Mono&display=swap">

  <style>
    :root {
      --bg-color: #1a1a1a;
      --text-color: rgba(255, 255, 255, 0.87);
      --border-color: rgba(255, 255, 255, 0.35);
      --section-fill: rgba(255, 255, 255, 0.07);
      --section-divider: rgba(255, 255, 255, 0.1);
      --dim-color: rgba(255, 255, 255, 0.3);
    }

    :root[data-theme="light"] {
      --bg-color: #f0f0f0;
      --text-color: #000000;
      --border-color: rgba(0, 0, 0, 0.28);
      --section-fill: rgba(0, 0, 0, 0.045);
      --section-divider: rgba(0, 0, 0, 0.08);
      --dim-color: rgba(0, 0, 0, 0.3);
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
      height: 100dvh;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    #main {
      flex: 1 1 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
    }

    .note-display {
      font-family: 'Reddit Mono', monospace;
      font-size: clamp(4rem, 20vmin, 10rem);
      font-weight: 600;
      line-height: 1;
      text-align: center;
      letter-spacing: -0.02em;
      transition: opacity 0.15s ease;
    }

    .note-display.silent {
      opacity: 0.12;
    }

    .note-label {
      font-family: 'Reddit Mono', monospace;
      font-size: clamp(0.8rem, 2vmin, 1rem);
      text-align: center;
      opacity: 0.4;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .status {
      font-family: 'Reddit Mono', monospace;
      font-size: clamp(0.7rem, 1.8vmin, 0.9rem);
      text-align: center;
      opacity: 0.4;
      letter-spacing: 0.05em;
    }

    .status.error {
      opacity: 0.7;
      color: #e06c75;
    }

    .status.connected {
      color: #98c379;
      opacity: 0.7;
    }

    #theme-toggle {
      position: fixed;
      bottom: 16px;
      right: 16px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--text-color);
      color: var(--bg-color);
      opacity: 0;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
      font-size: 1.5rem;
      padding: 0;
      border: none;
      z-index: 10;
      transition: opacity 0.2s, transform 0.15s;
    }

    body:hover #theme-toggle {
      opacity: 1;
    }

    #theme-toggle:hover {
      transform: scale(1.08);
    }

    .octave-hint {
      font-family: 'Reddit Mono', monospace;
      font-size: clamp(0.65rem, 1.5vmin, 0.8rem);
      opacity: 0.25;
      text-align: center;
      letter-spacing: 0.04em;
    }

    #volume-section {
      position: relative;
      width: 100%;
      flex: 0 0 10vh;
      min-height: 44px;
      background: transparent;
      border-top: 1px solid var(--section-divider);
      overflow: hidden;
      cursor: pointer;
      touch-action: none;
    }

    #volume-fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 75%;
      background: var(--section-fill);
      pointer-events: none;
    }

    #volume-readout {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Reddit Mono', monospace;
      font-size: clamp(1.25rem, 4vmin, 2rem);
      font-weight: 600;
      text-align: center;
      pointer-events: none;
      white-space: nowrap;
      text-shadow:
        0 0 20px var(--bg-color),
        0 0 8px var(--bg-color),
        0 1px 2px var(--bg-color);
    }
  </style>
</head>

<body>
  <div id="main">
    <div class="note-display silent" id="note-display">—</div>
    <div class="note-label" id="note-label">Bb trumpet</div>
    <div class="octave-hint" id="octave-hint">&nbsp;</div>
    <div class="status" id="status">click anywhere, then play</div>
  </div>

  <div id="volume-section" aria-label="Volume: drag horizontally">
    <div id="volume-fill"></div>
    <div id="volume-readout">75%</div>
  </div>

  <button type="button" id="theme-toggle" onclick="toggleTheme()" title="Theme">◑</button>

  <script>
    // ── Bb trumpet transposition ──────────────────────────────────────────────
    // A Bb trumpet is a transposing instrument: when a trumpet player reads and
    // plays a written C, the concert pitch that sounds is Bb (a major 2nd lower).
    // So to match concert pitch C on a piano, we need to play a written D on
    // trumpet — i.e. shift the MIDI note UP by +2 semitones before synthesis.
    const TRANSPOSE = -2; // Bb trumpet: written C sounds as concert Bb (2 semitones lower)

    const NOTE_NAMES = ['C','D♭','D','E♭','E','F','G♭','G','A♭','A','B♭','B'];

    function midiToName(midi) {
      const note = NOTE_NAMES[midi % 12];
      const octave = Math.floor(midi / 12) - 1;
      return { note, octave, label: `${note}${octave}` };
    }

    // ── Web Audio synthesis ───────────────────────────────────────────────────
    // AudioContext must be created (or resumed) inside a user gesture — MIDI
    // events don't qualify. We create it lazily on the first click/keydown.
    let audioCtx = null;

    function ensureAudioCtx() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      } else if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function unlockAudio() {
      ensureAudioCtx();
      // Only update the status hint if MIDI hasn't already set a connected message
      if (statusEl.className === 'status') {
        setStatus('default', 'waiting for MIDI…');
      }
    }

    document.addEventListener('pointerdown', unlockAudio, { once: true });
    document.addEventListener('keydown', unlockAudio, { once: true });

    // Active voices: midiNote → { osc, osc2, noteGain }
    const activeVoices = new Map();

    // Master gain node (created alongside audioCtx)
    let masterGain = null;
    let volumePct = 75;
    const STORAGE_VOLUME = 'trumpet_volume';

    function ensureMasterGain() {
      if (masterGain) return;
      masterGain = audioCtx.createGain();
      masterGain.gain.value = volumePct / 100;
      masterGain.connect(audioCtx.destination);
    }

    function midiToFreq(midi) {
      return 440 * Math.pow(2, (midi - 69) / 12);
    }

    // Trumpet-ish timbre: sawtooth through a low-pass (takes the harsh edge off)
    // + gentle bandpass formants for brass color.
    function startNote(midiNote) {
      if (!audioCtx) return; // audio not yet unlocked
      if (activeVoices.has(midiNote)) return;
      ensureMasterGain();

      const transposedNote = midiNote + TRANSPOSE;
      const freq = midiToFreq(transposedNote);

      const noteGain = audioCtx.createGain();
      noteGain.gain.setValueAtTime(0, audioCtx.currentTime);
      // Slower attack for a softer onset
      noteGain.gain.linearRampToValueAtTime(0.22, audioCtx.currentTime + 0.06);
      noteGain.connect(masterGain);

      // Low-pass to roll off harshness above ~3.5 kHz
      const lp = audioCtx.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.value = 3500;
      lp.Q.value = 0.7;
      lp.connect(noteGain);

      // Sawtooth — rich harmonic source
      const osc = audioCtx.createOscillator();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

      // Second osc slightly detuned for a warm chorus
      const osc2 = audioCtx.createOscillator();
      osc2.type = 'sawtooth';
      osc2.frequency.setValueAtTime(freq * 1.002, audioCtx.currentTime);

      const osc2Gain = audioCtx.createGain();
      osc2Gain.gain.value = 0.4;
      osc2.connect(osc2Gain);
      osc2Gain.connect(lp);

      // Bandpass formants — lower Q for gentler coloring
      const formantFreqs = [freq * 2, 1100];
      formantFreqs.forEach(f => {
        const bp = audioCtx.createBiquadFilter();
        bp.type = 'bandpass';
        bp.frequency.value = f;
        bp.Q.value = 1.8;
        osc.connect(bp);
        bp.connect(lp);
      });

      // Direct signal
      const directGain = audioCtx.createGain();
      directGain.gain.value = 0.2;
      osc.connect(directGain);
      directGain.connect(lp);

      osc.start();
      osc2.start();

      activeVoices.set(midiNote, { osc, osc2, osc2Gain, noteGain, lp, directGain });
    }

    function stopNote(midiNote) {
      const voice = activeVoices.get(midiNote);
      if (!voice) return;
      activeVoices.delete(midiNote);

      const { osc, osc2, noteGain } = voice;
      const t = audioCtx.currentTime;
      noteGain.gain.setValueAtTime(noteGain.gain.value, t);
      noteGain.gain.linearRampToValueAtTime(0, t + 0.12);
      setTimeout(() => {
        try { osc.stop(); } catch (_) {}
        try { osc2.stop(); } catch (_) {}
        noteGain.disconnect();
      }, 300);
    }

    // ── UI ────────────────────────────────────────────────────────────────────
    const noteDisplay = document.getElementById('note-display');
    const noteLabel   = document.getElementById('note-label');
    const octaveHint  = document.getElementById('octave-hint');
    const statusEl    = document.getElementById('status');

    // Track held notes (most recent wins for display)
    const heldNotes = new Set();

    function updateDisplay() {
      if (heldNotes.size === 0) {
        noteDisplay.textContent = '—';
        noteDisplay.classList.add('silent');
        noteLabel.textContent = 'Bb trumpet';
        octaveHint.textContent = '\u00a0';
        return;
      }
      // Show the highest held note
      const top = Math.max(...heldNotes);
      const { note, octave } = midiToName(top);
      noteDisplay.textContent = note;
      noteDisplay.classList.remove('silent');
      noteLabel.textContent = 'Bb trumpet';
      octaveHint.textContent = `octave ${octave}`;
    }

    // ── MIDI ──────────────────────────────────────────────────────────────────
    function onMidiMessage(e) {
      const [status, note, velocity] = e.data;
      const cmd = status & 0xf0;

      if (cmd === 0x90 && velocity > 0) {
        // Note on
        heldNotes.add(note);
        startNote(note);
        updateDisplay();
      } else if (cmd === 0x80 || (cmd === 0x90 && velocity === 0)) {
        // Note off
        heldNotes.delete(note);
        stopNote(note);
        updateDisplay();
      }
    }

    function onMidiStateChange(e) {
      const { port } = e;
      if (port.type !== 'input') return;
      if (port.state === 'connected') {
        port.onmidimessage = onMidiMessage;
        setStatus('connected', `${port.name}`);
      } else {
        setStatus('default', 'device disconnected — waiting for MIDI…');
      }
    }

    function setStatus(type, text) {
      statusEl.textContent = text;
      statusEl.className = 'status' + (type !== 'default' ? ` ${type}` : '');
    }

    async function initMidi() {
      if (!navigator.requestMIDIAccess) {
        setStatus('error', 'Web MIDI not supported in this browser');
        return;
      }
      try {
        const access = await navigator.requestMIDIAccess({ sysex: false });
        access.onstatechange = onMidiStateChange;

        let found = 0;
        for (const [, input] of access.inputs) {
          input.onmidimessage = onMidiMessage;
          found++;
        }

        if (found > 0) {
          const names = [...access.inputs.values()].map(p => p.name).join(', ');
          setStatus('connected', names);
        } else {
          setStatus('default', 'no MIDI device found — plug one in');
        }
      } catch (err) {
        setStatus('error', `MIDI access denied: ${err.message}`);
      }
    }

    initMidi();

    // ── Volume slider ─────────────────────────────────────────────────────────
    const volumeSection = document.getElementById('volume-section');
    const volumeFill    = document.getElementById('volume-fill');
    const volumeReadout = document.getElementById('volume-readout');

    function loadStoredVolume() {
      try {
        const raw = localStorage.getItem(STORAGE_VOLUME);
        if (raw == null) return null;
        const n = parseFloat(raw);
        return Number.isFinite(n) ? Math.min(100, Math.max(0, n)) : null;
      } catch (_) { return null; }
    }

    function setVolume(pct) {
      volumePct = Math.min(100, Math.max(0, pct));
      volumeReadout.textContent = `${Math.round(volumePct)}%`;
      volumeFill.style.width = `${volumePct}%`;
      if (masterGain) masterGain.gain.setTargetAtTime(volumePct / 100, audioCtx.currentTime, 0.01);
    }

    function volumeFromClientX(clientX) {
      const r = volumeSection.getBoundingClientRect();
      return r.width <= 0 ? 100 : ((clientX - r.left) / r.width) * 100;
    }

    let dragging = false;

    volumeSection.addEventListener('pointerdown', e => {
      volumeSection.setPointerCapture(e.pointerId);
      dragging = true;
      unlockAudio();
      setVolume(volumeFromClientX(e.clientX));
    });
    volumeSection.addEventListener('pointermove', e => {
      if (!dragging) return;
      setVolume(volumeFromClientX(e.clientX));
    });
    volumeSection.addEventListener('pointerup', e => {
      dragging = false;
      try { localStorage.setItem(STORAGE_VOLUME, String(volumePct)); } catch (_) {}
    });
    volumeSection.addEventListener('pointercancel', () => { dragging = false; });

    const storedVolume = loadStoredVolume();
    setVolume(storedVolume !== null ? storedVolume : 75);

    // ── Theme ─────────────────────────────────────────────────────────────────
    const STORAGE_THEME = 'trumpet_theme';

    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      document.getElementById('theme-toggle').textContent = theme === 'light' ? '◐' : '◑';
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'light' ? 'dark' : 'light';
      setTheme(next);
      try { localStorage.setItem(STORAGE_THEME, next); } catch (_) {}
    }

    function loadInitialTheme() {
      try {
        const saved = localStorage.getItem(STORAGE_THEME);
        if (saved === 'light' || saved === 'dark') { setTheme(saved); return; }
      } catch (_) {}
      setTheme(window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    }

    loadInitialTheme();

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
      try { if (localStorage.getItem(STORAGE_THEME) != null) return; } catch (_) {}
      setTheme(e.matches ? 'dark' : 'light');
    });
  </script>
</body>

</html>
