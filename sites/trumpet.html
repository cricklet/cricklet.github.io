<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trumpet</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reddit+Mono&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.5/build/cjs/vexflow.js"></script>

  <style>
    :root {
      --bg-color: #1a1a1a;
      --text-color: rgba(255, 255, 255, 0.87);
      --border-color: rgba(255, 255, 255, 0.35);
      --section-fill: rgba(255, 255, 255, 0.07);
      --section-divider: rgba(255, 255, 255, 0.1);
      --dim-color: rgba(255, 255, 255, 0.3);
    }

    :root[data-theme="light"] {
      --bg-color: #f0f0f0;
      --text-color: #000000;
      --border-color: rgba(0, 0, 0, 0.28);
      --section-fill: rgba(0, 0, 0, 0.045);
      --section-divider: rgba(0, 0, 0, 0.08);
      --dim-color: rgba(0, 0, 0, 0.3);
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
      height: 100dvh;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    #main {
      flex: 1 1 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    #bottom-info {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3rem;
      padding: 0.75rem 1rem;
      flex-shrink: 0;
      height: 4rem;
    }

    #staff-container {
      width: 100%;
      flex: 1 1 0;
      min-height: 0;
      display: block;
    }

    #staff-container svg {
      display: block;
    }

    .note-label {
      font-family: 'Reddit Mono', monospace;
      font-size: clamp(0.8rem, 2vmin, 1rem);
      text-align: center;
      opacity: 0.4;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      height: 1.4em;
      line-height: 1.4;
    }

    .status {
      font-family: 'Reddit Mono', monospace;
      font-size: clamp(0.7rem, 1.8vmin, 0.9rem);
      text-align: center;
      opacity: 0.4;
      letter-spacing: 0.05em;
      height: 1.4em;
      line-height: 1.4;
    }

    .status.error {
      opacity: 0.7;
      color: #e06c75;
    }

    .status.connected {
      color: #98c379;
      opacity: 0.7;
    }

    #keyboard-section {
      flex: 0 0 auto;
      height: max(90px, 16vh);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px 12px;
      border-top: 1px solid var(--section-divider);
      overflow: hidden;
    }

    #keyboard {
      position: relative;
    }

    .wk {
      position: absolute;
      top: 0;
      bottom: 0;
      background: rgba(235, 235, 235, 0.94);
      border: 1px solid rgba(0, 0, 0, 0.28);
      border-top: none;
      border-radius: 0 0 4px 4px;
      cursor: pointer;
      touch-action: none;
      transition: background 0.05s;
    }

    :root[data-theme="light"] .wk {
      background: #fafafa;
      border-color: rgba(0, 0, 0, 0.38);
    }

    .wk.active {
      background: #5badee;
    }

    .wk .c-label {
      position: absolute;
      bottom: 4px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Reddit Mono', monospace;
      font-size: 9px;
      color: rgba(0, 0, 0, 0.32);
      pointer-events: none;
      line-height: 1;
      white-space: nowrap;
    }

    .bk {
      position: absolute;
      top: 0;
      height: 62%;
      background: #2c2c2c;
      border-radius: 0 0 3px 3px;
      cursor: pointer;
      z-index: 2;
      touch-action: none;
      transition: background 0.05s;
    }

    :root[data-theme="light"] .bk {
      background: #1a1a1a;
    }

    .bk.active {
      background: #3a7bd5;
    }

    #volume-section {
      position: relative;
      width: 100%;
      flex: 0 0 10vh;
      min-height: 44px;
      background: transparent;
      border-top: 1px solid var(--section-divider);
      overflow: hidden;
      cursor: pointer;
      touch-action: none;
    }

    #volume-fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 75%;
      background: var(--section-fill);
      pointer-events: none;
    }

    #unlock-overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      cursor: pointer;
      background: var(--bg-color);
      opacity: 0.6;
      transition: opacity 0.3s ease;
    }

    #unlock-overlay.hiding {
      opacity: 0;
      pointer-events: none;
    }

    #volume-readout {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Reddit Mono', monospace;
      font-size: clamp(1.25rem, 4vmin, 2rem);
      font-weight: 600;
      text-align: center;
      pointer-events: none;
      white-space: nowrap;
      text-shadow:
        0 0 20px var(--bg-color),
        0 0 8px var(--bg-color),
        0 1px 2px var(--bg-color);
    }
  </style>
</head>

<body>
  <div id="main">
    <div id="staff-container"></div>
  </div>

  <div id="keyboard-section"></div>

  <div id="bottom-info">
    <div class="note-label" id="note-label"></div>
    <div class="status" id="status">click to start</div>
  </div>

  <div id="volume-section" aria-label="Volume: drag horizontally">
    <div id="volume-fill"></div>
    <div id="volume-readout">75%</div>
  </div>

  <div id="unlock-overlay"></div>

  <script>
    // ── Bb trumpet transposition ──────────────────────────────────────────────
    // A Bb trumpet is a transposing instrument: when a trumpet player reads and
    // plays a written C, the concert pitch that sounds is Bb (a major 2nd lower).
    // So to match concert pitch C on a piano, we need to play a written D on
    // trumpet — i.e. shift the MIDI note UP by +2 semitones before synthesis.
    const TRANSPOSE = -2; // Bb trumpet: written C sounds as concert Bb (2 semitones lower)

    const NOTE_NAMES = ['C','D♭','D','E♭','E','F','G♭','G','A♭','A','B♭','B'];

    function midiToName(midi) {
      const note = NOTE_NAMES[midi % 12];
      const octave = Math.floor(midi / 12) - 1;
      return { note, octave, label: `${note}${octave}` };
    }

    // ── VexFlow staff rendering ───────────────────────────────────────────────
    // Map MIDI semitone → { vfKey: letter for VexFlow key string, acc: accidental or null }
    // Using flats throughout to match the rest of the app.
    const VF_NOTE_MAP = [
      { vfKey: 'c',  acc: null },  // 0  C
      { vfKey: 'db', acc: 'b'  },  // 1  Db
      { vfKey: 'd',  acc: null },  // 2  D
      { vfKey: 'eb', acc: 'b'  },  // 3  Eb
      { vfKey: 'e',  acc: null },  // 4  E
      { vfKey: 'f',  acc: null },  // 5  F
      { vfKey: 'gb', acc: 'b'  },  // 6  Gb
      { vfKey: 'g',  acc: null },  // 7  G
      { vfKey: 'ab', acc: 'b'  },  // 8  Ab
      { vfKey: 'a',  acc: null },  // 9  A
      { vfKey: 'bb', acc: 'b'  },  // 10 Bb
      { vfKey: 'b',  acc: null },  // 11 B
    ];

    function midiToVexKey(midi) {
      const { vfKey, acc } = VF_NOTE_MAP[midi % 12];
      const octave = Math.floor(midi / 12) - 1;
      return { keyStr: `${vfKey}/${octave}`, acc };
    }

    function renderStaff() {
      if (typeof Vex === 'undefined') return;
      const { Renderer, Stave, StaveNote, Formatter, Accidental } = Vex.Flow;

      const container = document.getElementById('staff-container');
      container.innerHTML = '';

      const W = container.clientWidth  || 400;
      const H = container.clientHeight || 300;

      // Compact stave — VexFlow default sizing (10px line spacing, 40px tall)
      const STAVE_W = 110;
      const STAVE_H = 40;
      const staveX = (W - STAVE_W) / 2;
      const staveY = (H - STAVE_H) / 2;

      const renderer = new Renderer(container, Renderer.Backends.SVG);
      renderer.resize(W, H);
      const context = renderer.getContext();

      const color = getComputedStyle(document.documentElement)
        .getPropertyValue('--text-color').trim() || '#fff';
      context.setFillStyle(color);
      context.setStrokeStyle(color);

      const stave = new Stave(staveX, staveY, STAVE_W);
      stave.addClef('treble');
      stave.setContext(context).draw();

      if (heldNotes.size === 0) return;

      const sorted = [...heldNotes].sort((a, b) => a - b);
      const keys = sorted.map(m => midiToVexKey(m).keyStr);
      const accs = sorted.map(m => midiToVexKey(m).acc);

      const note = new StaveNote({ keys, duration: 'w' });
      accs.forEach((acc, i) => {
        if (acc) note.addModifier(new Accidental(acc), i);
      });

      Formatter.FormatAndDraw(context, stave, [note]);
    }

    // ── Web Audio synthesis ───────────────────────────────────────────────────
    // AudioContext must be created (or resumed) inside a user gesture — MIDI
    // events don't qualify. We create it lazily on the first click/keydown.
    let audioCtx = null;

    function ensureAudioCtx() {
      if (!audioCtx) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        audioCtx = new Ctx({ latencyHint: 'interactive' });
      } else if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function unlockAudio() {
      ensureAudioCtx();
    }

    const unlockOverlay = document.getElementById('unlock-overlay');
    unlockOverlay.addEventListener('pointerdown', () => {
      ensureAudioCtx();
      initMidi();
      unlockOverlay.classList.add('hiding');
      unlockOverlay.addEventListener('transitionend', () => unlockOverlay.remove(), { once: true });
    }, { once: true });

    // Active voices: midiNote → { osc, osc2, noteGain }
    const activeVoices = new Map();

    // Master gain node (created alongside audioCtx)
    let masterGain = null;
    let volumePct = 75;
    const STORAGE_VOLUME = 'trumpet_volume';

    function ensureMasterGain() {
      if (masterGain) return;
      masterGain = audioCtx.createGain();
      masterGain.gain.value = volumePct / 100;
      masterGain.connect(audioCtx.destination);
    }

    function midiToFreq(midi) {
      return 440 * Math.pow(2, (midi - 69) / 12);
    }

    // Trumpet-ish timbre: sawtooth through a low-pass (takes the harsh edge off)
    // + gentle bandpass formants for brass color.
    function startNote(midiNote) {
      if (!audioCtx) return; // audio not yet unlocked
      if (activeVoices.has(midiNote)) return;
      ensureMasterGain();

      const transposedNote = midiNote + TRANSPOSE;
      const freq = midiToFreq(transposedNote);

      const noteGain = audioCtx.createGain();
      noteGain.gain.setValueAtTime(0, audioCtx.currentTime);
      noteGain.gain.linearRampToValueAtTime(0.22, audioCtx.currentTime + 0.003);
      noteGain.connect(masterGain);

      // Low-pass to roll off harshness above ~2.2 kHz
      const lp = audioCtx.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.value = 2200;
      lp.Q.value = 0.6;
      lp.connect(noteGain);

      // Sawtooth — rich harmonic source
      const osc = audioCtx.createOscillator();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

      // Second osc slightly detuned for a warm chorus
      const osc2 = audioCtx.createOscillator();
      osc2.type = 'sawtooth';
      osc2.frequency.setValueAtTime(freq * 1.002, audioCtx.currentTime);

      const osc2Gain = audioCtx.createGain();
      osc2Gain.gain.value = 0.25;
      osc2.connect(osc2Gain);
      osc2Gain.connect(lp);

      // Bandpass formants — lower Q for gentler coloring
      const formantFreqs = [freq * 2, 1100];
      formantFreqs.forEach(f => {
        const bp = audioCtx.createBiquadFilter();
        bp.type = 'bandpass';
        bp.frequency.value = f;
        bp.Q.value = 1.8;
        osc.connect(bp);
        bp.connect(lp);
      });

      // Direct signal
      const directGain = audioCtx.createGain();
      directGain.gain.value = 0.1;
      osc.connect(directGain);
      directGain.connect(lp);

      osc.start();
      osc2.start();

      activeVoices.set(midiNote, { osc, osc2, osc2Gain, noteGain, lp, directGain });
    }

    function stopNote(midiNote) {
      const voice = activeVoices.get(midiNote);
      if (!voice) return;
      activeVoices.delete(midiNote);

      const { osc, osc2, noteGain } = voice;
      const t = audioCtx.currentTime;
      noteGain.gain.setValueAtTime(noteGain.gain.value, t);
      noteGain.gain.linearRampToValueAtTime(0, t + 0.12);
      setTimeout(() => {
        try { osc.stop(); } catch (_) {}
        try { osc2.stop(); } catch (_) {}
        noteGain.disconnect();
      }, 300);
    }

    // ── UI ────────────────────────────────────────────────────────────────────
    const noteLabel = document.getElementById('note-label');
    const statusEl  = document.getElementById('status');

    // Track held notes
    const heldNotes = new Set();

    function updateDisplay() {
      renderStaff();
      updateKeyboardHighlights();
      if (heldNotes.size > 0) {
        const top = Math.max(...heldNotes);
        const { note, octave } = midiToName(top);
        noteLabel.textContent = `${note}${octave}`;
      } else {
        noteLabel.textContent = '';
      }
    }

    // ── MIDI ──────────────────────────────────────────────────────────────────
    function onMidiMessage(e) {
      const [status, note, velocity] = e.data;
      const cmd = status & 0xf0;

      if (cmd === 0x90 && velocity > 0) {
        // Note on
        heldNotes.add(note);
        startNote(note);
        updateDisplay();
      } else if (cmd === 0x80 || (cmd === 0x90 && velocity === 0)) {
        // Note off
        heldNotes.delete(note);
        stopNote(note);
        updateDisplay();
      }
    }

    function onMidiStateChange(e) {
      const { port } = e;
      if (port.type !== 'input') return;
      if (port.state === 'connected') {
        port.onmidimessage = onMidiMessage;
        setStatus('connected', `${port.name}`);
      } else {
        setStatus('default', 'device disconnected — waiting for MIDI…');
      }
    }

    function setStatus(type, text) {
      statusEl.textContent = text;
      statusEl.className = 'status' + (type !== 'default' ? ` ${type}` : '');
    }

    async function initMidi() {
      if (!navigator.requestMIDIAccess) {
        setStatus('error', 'Web MIDI not supported in this browser');
        return;
      }
      try {
        const access = await navigator.requestMIDIAccess({ sysex: false });
        access.onstatechange = onMidiStateChange;

        let found = 0;
        for (const [, input] of access.inputs) {
          input.onmidimessage = onMidiMessage;
          found++;
        }

        if (found > 0) {
          const names = [...access.inputs.values()].map(p => p.name).join(', ');
          setStatus('connected', names);
        } else {
          setStatus('default', 'no MIDI device found — plug one in');
        }
      } catch (err) {
        setStatus('error', `MIDI access denied: ${err.message}`);
      }
    }

    // ── Volume slider ─────────────────────────────────────────────────────────
    const volumeSection = document.getElementById('volume-section');
    const volumeFill    = document.getElementById('volume-fill');
    const volumeReadout = document.getElementById('volume-readout');

    function loadStoredVolume() {
      try {
        const raw = localStorage.getItem(STORAGE_VOLUME);
        if (raw == null) return null;
        const n = parseFloat(raw);
        return Number.isFinite(n) ? Math.min(100, Math.max(0, n)) : null;
      } catch (_) { return null; }
    }

    function setVolume(pct) {
      volumePct = Math.min(100, Math.max(0, pct));
      volumeReadout.textContent = `${Math.round(volumePct)}%`;
      volumeFill.style.width = `${volumePct}%`;
      if (masterGain) masterGain.gain.setTargetAtTime(volumePct / 100, audioCtx.currentTime, 0.01);
    }

    function volumeFromClientX(clientX) {
      const r = volumeSection.getBoundingClientRect();
      return r.width <= 0 ? 100 : ((clientX - r.left) / r.width) * 100;
    }

    let dragging = false;

    volumeSection.addEventListener('pointerdown', e => {
      volumeSection.setPointerCapture(e.pointerId);
      dragging = true;
      unlockAudio();
      setVolume(volumeFromClientX(e.clientX));
    });
    volumeSection.addEventListener('pointermove', e => {
      if (!dragging) return;
      setVolume(volumeFromClientX(e.clientX));
    });
    volumeSection.addEventListener('pointerup', e => {
      dragging = false;
      try { localStorage.setItem(STORAGE_VOLUME, String(volumePct)); } catch (_) {}
    });
    volumeSection.addEventListener('pointercancel', () => { dragging = false; });

    const storedVolume = loadStoredVolume();
    setVolume(storedVolume !== null ? storedVolume : 75);

    // ── Theme ─────────────────────────────────────────────────────────────────
    function applySystemTheme() {
      document.documentElement.setAttribute('data-theme',
        window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    }
    applySystemTheme();
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applySystemTheme);

    // ── On-screen keyboard ─────────────────────────────────────────────────────
    const KB_LOW  = 55; // written G3 (below the staff)
    const KB_HIGH = 84; // written C6 (high C)

    function isWhiteKey(m) {
      return [0, 2, 4, 5, 7, 9, 11].includes(m % 12);
    }

    const KB_WHITE_KEYS = [];
    for (let m = KB_LOW; m <= KB_HIGH; m++) {
      if (isWhiteKey(m)) KB_WHITE_KEYS.push(m);
    }

    let kbPressedNote = null;
    let kbDragging = false;

    function kbPress(midi) {
      if (kbPressedNote === midi) return;
      kbPressedNote = midi;
      heldNotes.add(midi);
      startNote(midi);
      updateDisplay();
    }

    function kbRelease() {
      if (kbPressedNote === null) return;
      const midi = kbPressedNote;
      kbPressedNote = null;
      heldNotes.delete(midi);
      stopNote(midi);
      updateDisplay();
    }

    function updateKeyboardHighlights() {
      const kb = document.getElementById('keyboard');
      if (!kb) return;
      kb.querySelectorAll('[data-midi]').forEach(el => {
        el.classList.toggle('active', heldNotes.has(+el.dataset.midi));
      });
    }

    function buildKeyboard() {
      const section = document.getElementById('keyboard-section');
      if (!section) return;
      section.innerHTML = '';

      const padH = 12, padV = 8;
      const W = section.clientWidth - padH * 2;
      const H = section.clientHeight - padV * 2;
      if (W <= 0 || H <= 0) return;

      const wkW = Math.floor(W / KB_WHITE_KEYS.length);
      const bkW = Math.round(wkW * 0.58);
      const kbW = wkW * KB_WHITE_KEYS.length;

      const kb = document.createElement('div');
      kb.id = 'keyboard';
      kb.style.cssText = `position:relative;width:${kbW}px;height:${H}px;`;
      section.appendChild(kb);

      // White keys (rendered first, behind black keys)
      KB_WHITE_KEYS.forEach((midi, i) => {
        const el = document.createElement('div');
        el.className = 'wk';
        el.style.left = (i * wkW) + 'px';
        el.style.width = (wkW - 1) + 'px';
        el.dataset.midi = midi;
        if (midi % 12 === 0) { // C note label
          const label = document.createElement('span');
          label.className = 'c-label';
          label.textContent = 'C' + (Math.floor(midi / 12) - 1);
          el.appendChild(label);
        }
        kb.appendChild(el);
      });

      // Black keys (rendered on top)
      for (let m = KB_LOW; m <= KB_HIGH; m++) {
        if (!isWhiteKey(m)) {
          const leftIdx = KB_WHITE_KEYS.indexOf(m - 1);
          if (leftIdx < 0) continue;
          const el = document.createElement('div');
          el.className = 'bk';
          el.style.left = ((leftIdx + 1) * wkW - Math.round(bkW / 2)) + 'px';
          el.style.width = bkW + 'px';
          el.dataset.midi = m;
          kb.appendChild(el);
        }
      }

      // Pointer handling — capture on the container so dragging across keys works
      kb.addEventListener('pointerdown', e => {
        const over = document.elementFromPoint(e.clientX, e.clientY);
        const target = over && over.closest('[data-midi]');
        if (!target) return;
        ensureAudioCtx();
        kb.setPointerCapture(e.pointerId);
        kbDragging = true;
        kbPress(+target.dataset.midi);
        e.preventDefault();
      });

      kb.addEventListener('pointermove', e => {
        if (!kbDragging) return;
        const over = document.elementFromPoint(e.clientX, e.clientY);
        const target = over && over.closest('[data-midi]');
        if (!target) return;
        const midi = +target.dataset.midi;
        if (midi !== kbPressedNote) {
          kbRelease();
          kbPress(midi);
        }
      });

      kb.addEventListener('pointerup',     () => { kbDragging = false; kbRelease(); });
      kb.addEventListener('pointercancel', () => { kbDragging = false; kbRelease(); });

      updateKeyboardHighlights();
    }

    // Draw the empty staff on load (after layout so clientWidth is valid)
    requestAnimationFrame(() => {
      renderStaff();
      new ResizeObserver(buildKeyboard).observe(document.getElementById('keyboard-section'));
    });
  </script>
</body>

</html>
