<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>JSON to JS</title>
  <style>
    :root {
      --bg-color: #1a1a1a;
      --text-color: rgba(255, 255, 255, 0.87);
      --secondary-text: rgba(255, 255, 255, 0.6);
      --input-bg-color: rgba(255, 255, 255, 0.1);
    }

    :root[data-theme="light"] {
      --bg-color: #f0f0f0;
      --text-color: #000000;
      --secondary-text: #666666;
      --input-bg-color: rgba(0, 0, 0, 0.05);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      margin: 0;
      background: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: all 0.1s ease;
      padding: 20px;
      box-sizing: border-box;
    }

    h2 {
      color: var(--text-color);
      font-size: 1.5rem;
      font-weight: normal;
      margin-bottom: 0.5rem;
    }

    p {
      color: var(--secondary-text);
      margin-bottom: 2rem;
      text-align: center;
      line-height: 1.5;
    }

    .container {
      display: flex;
      flex-direction: row;
      width: 95%;
      max-width: 1600px;
      gap: 20px;
      margin-bottom: 20px;
      flex: 1;
      min-height: 70vh;
    }

    @media (max-width: 768px) {
      .container {
        flex-direction: column;
        min-height: 80vh;
      }
    }

    textarea {
      flex: 1;
      height: auto;
      min-height: 500px;
      padding: 15px;
      border-radius: 10px;
      border: none;
      background: var(--input-bg-color);
      color: var(--text-color);
      font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', 'Consolas', monospace;
      font-size: 14px;
      resize: vertical;
      line-height: 1.5;
    }

    pre {
      flex: 1;
      height: auto;
      min-height: 500px;
      padding: 15px;
      border-radius: 10px;
      background: var(--input-bg-color);
      color: var(--text-color);
      font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', 'Consolas', monospace;
      font-size: 14px;
      overflow: auto;
      white-space: pre;
      margin: 0;
      line-height: 1.5;
    }

    #result {
      font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', 'Consolas', monospace;
      font-size: 14px;
      color: var(--text-color);
      text-align: left;
      position: relative;
    }

    .button-container {
      display: flex;
      justify-content: center;
      width: 95%;
      max-width: 1600px;
      gap: 10px;
      margin-bottom: 30px;
    }

    .action-button {
      padding: 8px 16px;
      border-radius: 6px;
      background: var(--text-color);
      color: var(--bg-color);
      border: none;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.1s ease;
    }

    .action-button:hover {
      transform: scale(1.05);
    }

    #copy-button {
      position: absolute;
      top: 10px;
      right: 10px;
      background-color: rgba(255, 255, 255, 0.1);
      color: var(--text-color);
      border: none;
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 12px;
      cursor: pointer;
      opacity: 0.7;
      transition: opacity 0.2s ease;
    }

    #copy-button:hover {
      opacity: 1;
    }

    .success-message {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background-color: rgba(0, 150, 0, 0.8);
      color: white;
      padding: 10px 20px;
      border-radius: 4px;
      font-size: 14px;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    #clear-cache:hover {
      transform: scale(1.1);
    }

    .title-area {
      width: 95%;
      max-width: 1600px;
      text-align: center;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>
  <div class="title-area">
    <p>Paste JSON and get a nicely formatted JavaScript object</p>
  </div>
  
  <div class="container">
    <textarea id="jsonInput" oninput="convertJsonToJs()" placeholder='{
  "points": {
    "1": [
      1.1649012131626062,
      -3.3265764030271026
    ],
    "2": [
      2.2611750688787104,
      -2.2679170464475904
    ],
    "3": [
      2.9646221193477764,
      -5.19024195774448
    ]
  },
  "curves": [
    {
      "type": "line",
      "start": 1,
      "end": 2
    },
    {
      "type": "line",
      "start": 3,
      "end": 4
    }
  ]
}'></textarea>
    
    <pre id="result" onclick="selectAllText(this)"></pre>
  </div>

  <script>
    const LOCAL_STORAGE_KEY = 'jsonToJs1';

    function selectAllText(element) {
      const range = document.createRange();
      range.selectNodeContents(element);
      const selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range);
    }

    function convertJsonToJs() {
      let jsonInput = document.getElementById('jsonInput').value;
      if (jsonInput.length === 0) {
        jsonInput = document.getElementById('jsonInput').getAttribute('placeholder');
        console.log(jsonInput);
      } else {
        localStorage.setItem(LOCAL_STORAGE_KEY, jsonInput);
      }
      
      try {
        // First try to parse as regular JSON
        const parsed = JSON.parse(jsonInput);
        const formatted = formatJsObject(parsed, 0);
        document.getElementById('result').textContent = formatted;
      } catch (error) {
        // If parsing fails, try to fix common JSON syntax issues
        try {
          // Try to fix trailing commas with a simple regex
          const fixedJson = jsonInput
            .replace(/,\s*([}\]])/g, '$1') // Remove trailing commas in objects and arrays
            .replace(/'/g, '"'); // Replace single quotes with double quotes

          const parsed = JSON.parse(fixedJson);
          const formatted = formatJsObject(parsed, 0);
          document.getElementById('result').textContent = formatted;
          
          // Show a friendly message that we fixed the JSON
          const errorMessage = document.createElement('div');
          errorMessage.textContent = "Fixed JSON syntax issues automatically";
          errorMessage.style.color = "orange";
          errorMessage.style.marginBottom = "10px";
          errorMessage.style.fontSize = "12px";
          document.getElementById('result').prepend(errorMessage);
        } catch (fixError) {
          // If our fix didn't work, show a more helpful error message
          let errorMsg = `Error: ${error.message}`;
          
          // Check for common JSON errors and provide more helpful messages
          if (error.message.includes("trailing comma")) {
            errorMsg += "\n\nHint: JSON doesn't allow trailing commas after the last item in arrays or objects. Remove any commas just before a closing ] or }.";
          } else if (error.message.includes("double-quoted")) {
            errorMsg += "\n\nHint: In JSON, all property names must be enclosed in double quotes, not single quotes.";
          } else if (error.message.includes("Unexpected token")) {
            errorMsg += "\n\nHint: Check for missing commas between items or extra commas at the end of arrays/objects.";
          }
          
          document.getElementById('result').textContent = errorMsg;
        }
      }
    }
    
    function isSimpleArray(arr) {
      if (arr.length > 2) return false; // Lower threshold to force more multi-line arrays
      
      for (const item of arr) {
        if (typeof item === 'object' && item !== null) {
          return false; // Any nested objects/arrays will force multi-line format
        }
      }
      return true;
    }
    
    function isSimpleObject(obj) {
      const keys = Object.keys(obj);
      if (keys.length > 2) return false; // Lower threshold to force more multi-line objects
      
      for (const key of keys) {
        const value = obj[key];
        if (typeof value === 'object' && value !== null) {
          return false; // Any nested objects/arrays will force multi-line format
        }
      }
      return true;
    }
    
    function shouldRemoveQuotes(key) {
      // Check for numeric keys (can be unquoted in JS)
      if (/^\d+$/.test(key)) {
        return true;
      }
      
      // Check if the key is a valid JS identifier
      // (starts with letter/underscore/$ and contains only letters/numbers/underscore/$)
      if (/^[a-zA-Z_$][a-zA-Z0-9_$]*$/.test(key) && 
          !key.includes('-') && 
          !key.includes(' ')) {
        return true;
      }
      
      return false;
    }
    
    function formatJsObject(obj, indent = 0) {
      if (obj === null) return 'null';
      
      const indentStr = ' '.repeat(indent);
      const innerIndentStr = ' '.repeat(indent + 2);
      
      if (Array.isArray(obj)) {
        if (obj.length === 0) return '[]';
        
        if (isSimpleArray(obj)) {
          // Format simple array on one line
          const items = obj.map(item => formatJsObject(item, 0)).join(', ');
          return `[ ${items} ]`;
        } else {
          // Format complex array on multiple lines
          const items = obj.map(item => `${innerIndentStr}${formatJsObject(item, indent + 2)}`).join(',\n');
          return `[\n${items}\n${indentStr}]`;
        }
      } else if (typeof obj === 'object') {
        const keys = Object.keys(obj);
        
        if (keys.length === 0) return '{}';
        
        if (isSimpleObject(obj)) {
          // Format simple object on one line
          const properties = keys.map(key => {
            const value = formatJsObject(obj[key], 0);
            return shouldRemoveQuotes(key) ? `${key}: ${value}` : `"${key}": ${value}`;
          }).join(', ');
          return `{ ${properties} }`;
        } else {
          // Format complex object on multiple lines
          const properties = keys.map(key => {
            const value = formatJsObject(obj[key], indent + 2);
            return `${innerIndentStr}${shouldRemoveQuotes(key) ? key : `"${key}"`}: ${value}`;
          }).join(',\n');
          return `{\n${properties}\n${indentStr}}`;
        }
      } else if (typeof obj === 'string') {
        return `"${obj}"`;
      } else {
        return String(obj);
      }
    }

    // Theme functionality
    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
    }

    function toggleTheme() {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'light' ? 'dark' : 'light';
      setTheme(newTheme);
    }

    function clearCache() {
      localStorage.removeItem(LOCAL_STORAGE_KEY);
      document.getElementById('jsonInput').value = document.getElementById('jsonInput').getAttribute('placeholder');
      convertJsonToJs();
    }

    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    setTheme(prefersDark ? 'dark' : 'light');

    // Listen for system theme changes
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
      setTheme(e.matches ? 'dark' : 'light');
    });

    // Load saved input when page loads
    window.addEventListener('load', function () {
      const savedInput = localStorage.getItem(LOCAL_STORAGE_KEY);
      if (savedInput) {
        document.getElementById('jsonInput').value = savedInput;
        convertJsonToJs(); // Calculate initial result
      } else {
        document.getElementById('jsonInput').value = document.getElementById('jsonInput').getAttribute('placeholder');
        convertJsonToJs();
      }
    });
  </script>
</body>

</html>
