<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helper Tools</title>
    <style>
        :root {
            --bg-color: #fff;
            --text-color: #333;
            --heading-color: #2c3e50;
            --link-color: #3498db;
            --link-hover: #2980b9;
            --card-bg: #fff;
            --card-shadow: rgba(0,0,0,0.1);
            --card-shadow-hover: rgba(0,0,0,0.15);
        }

        :root[data-theme="dark"] {
            --bg-color: #1a1a1a;
            --text-color: rgba(255, 255, 255, 0.87);
            --heading-color: #eee;
            --link-color: #4fc3f7;
            --link-hover: #29b6f6;
            --card-bg: #2a2a2a;
            --card-shadow: rgba(0,0,0,0.2);
            --card-shadow-hover: rgba(0,0,0,0.3);
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            max-width: 800px;
            margin: 4rem auto;
            line-height: 1.6;
            color: var(--text-color);
            background: var(--bg-color);
            transition: all 0.2s ease;
        }

        h1 {
            color: var(--heading-color);
            margin-bottom: 2rem;
        }

        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
        }

        .tool-card {
            display: block;
            text-decoration: none;
            color: inherit;
            background: var(--card-bg);
            border-radius: 8px;
            padding: 1.5rem;
            box-shadow: 0 2px 4px var(--card-shadow);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .tool-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px var(--card-shadow-hover);
        }

        .tool-title {
            color: var(--link-color);
            font-weight: 500;
            margin: 0 0 0.5rem 0;
            font-size: 1rem;
        }

        .tool-card:hover .tool-title {
            color: var(--link-hover);
        }

        .tool-description {
            margin: 0;
            color: var(--text-color);
        }
    </style>
</head>
<body>
    <div class="tools-grid">
        <a href="days-until.html" class="tool-card">
            <h2 class="tool-title">Days Until Calculator</h2>
            <p class="tool-description">Calculate the number of days until a future date</p>
        </a>
        <a href="estimate-completion.html" class="tool-card">
            <h2 class="tool-title">Completion Estimator</h2>
            <p class="tool-description">Estimate completion time based on progress</p>
        </a>
        <a href="graphing.html" class="tool-card">
            <h2 class="tool-title">Graphing Tool</h2>
            <p class="tool-description">Create and visualize graphs</p>
        </a>
        <a href="json-to-js.html" class="tool-card">
            <h2 class="tool-title">JSON to JavaScript</h2>
            <p class="tool-description">Convert JSON to JavaScript object notation</p>
        </a>
        <a href="pomodoro.html" class="tool-card">
            <h2 class="tool-title">Pomodoro Timer</h2>
            <p class="tool-description">Stay focused with a Pomodoro timer</p>
        </a>
    </div>

    <script>
        // Theme functionality
        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
        }

        // Initialize theme based on system preference
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        setTheme(prefersDark ? 'dark' : 'light');

        // Listen for system theme changes
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
            setTheme(e.matches ? 'dark' : 'light');
        });
    </script>
</body>
</html>
