<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reddit+Mono&display=swap">

  <style>
    :root {
      --bg-color: #1a1a1a;
      --text-color: rgba(255, 255, 255, 0.87);
    }

    :root[data-theme="light"] {
      --bg-color: #f0f0f0;
      --text-color: #000000;
    }

    body {
      position: relative;
      min-height: 100vh;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-color);
      color: var(--text-color);
      transition: all 0.1s ease;
    }

    .timer-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }

    #countdown-timer {
      font-size: 6rem;
      color: var(--text-color);
      transition: all 0.1s ease;
      font-family: 'Reddit Mono', monospace;
      margin-bottom: 1rem;
    }

    #total-timer {
      font-size: 3rem;
      color: var(--text-color);
      opacity: 0.7;
      transition: all 0.1s ease;
      font-family: 'Reddit Mono', monospace;
    }

    #reset-button,
    #ff-button {
      position: absolute;
      bottom: 20px;
      width: 44px;
      height: 44px;
      min-width: 44px;
      max-width: 44px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--text-color);
      color: var(--bg-color);
      opacity: 0;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
      font-size: 1.2rem;
      padding: 0;
      border: none;
      transition: all 0.1s ease;
      overflow: hidden;
      flex-shrink: 0;
    }

    #reset-button {
      right: 20px;
    }

    #ff-button {
      right: 74px;
      font-size: 1rem;
    }

    body:hover #reset-button,
    body:hover #ff-button {
      opacity: 1;
    }

    #reset-button:hover,
    #ff-button:hover {
      transform: scale(1.1);
    }

    #interval-text {
      position: absolute;
      bottom: 20px;
      left: 20px;
      font-size: 0.9rem;
      color: var(--text-color);
      opacity: 0.5;
      font-family: 'Reddit Mono', monospace;
    }

    .volume-container {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0;
      transition: opacity 0.1s ease;
    }

    body:hover .volume-container {
      opacity: 1;
    }

    .volume-container label {
      font-size: 0.9rem;
      color: var(--text-color);
      opacity: 0.7;
      font-family: 'Reddit Mono', monospace;
      white-space: nowrap;
    }

    #volume-slider {
      width: 150px;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
      cursor: pointer;
    }

    #volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      background: var(--text-color);
      border-radius: 50%;
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    #volume-slider::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    #volume-slider::-moz-range-thumb {
      width: 16px;
      height: 16px;
      background: var(--text-color);
      border-radius: 50%;
      cursor: pointer;
      border: none;
      transition: transform 0.1s ease;
    }

    #volume-slider::-moz-range-thumb:hover {
      transform: scale(1.2);
    }

    :root[data-theme="light"] #volume-slider {
      background: rgba(0, 0, 0, 0.2);
    }
  </style>
</head>

<body>
  <div class="timer-container">
    <div id="countdown-timer">00:00</div>
    <div id="total-timer">00:00</div>
  </div>
  <button id="ff-button" onclick="skipToNextInterval()">⏩</button>
  <button id="reset-button" onclick="resetTimer()">↻</button>
  <div id="interval-text"></div>
  <div class="volume-container">
    <label for="volume-slider">Volume:</label>
    <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="1">
  </div>
  <audio id="bell-audio" src="bell.mp3" preload="auto"></audio>
  <canvas id="pip-canvas" style="display: none;"></canvas>

  <script>
    let totalStartTime = null;
    let nextBellTime = null;
    let bellIntervalSeconds = 0;
    let interval;
    let pipWindow = null;
    let canvas = null;
    let ctx = null;
    let volumeDebounceTimer = null;

    // Parse URL parameters
    function getBellIntervalFromParams() {
      const params = new URLSearchParams(window.location.search);
      const minutes = params.get('minutes') ? parseInt(params.get('minutes')) : 5;
      const seconds = params.get('seconds') ? parseInt(params.get('seconds')) : 0;
      return minutes * 60 + seconds;
    }

    bellIntervalSeconds = getBellIntervalFromParams();

    // Update interval text display
    function updateIntervalText() {
      const minutes = Math.floor(bellIntervalSeconds / 60);
      const seconds = bellIntervalSeconds % 60;
      let intervalString = '';
      if (minutes > 0) {
        intervalString += `${minutes} minute${minutes !== 1 ? 's' : ''}`;
      }
      if (seconds > 0) {
        if (intervalString) intervalString += ' ';
        intervalString += `${seconds} second${seconds !== 1 ? 's' : ''}`;
      }
      if (!intervalString) intervalString = '0 seconds';
      document.getElementById('interval-text').textContent = `Interval: ${intervalString}`;
    }
    updateIntervalText();

    // Use system theme preference
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    setTheme(prefersDark ? 'dark' : 'light');

    // Listen for system theme changes
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
      setTheme(e.matches ? 'dark' : 'light');
    });

    // Initialize PIP support
    initializePIP();

    // Listen for visibility changes
    document.addEventListener('visibilitychange', handleVisibilityChange);

    // Load saved state or start new timer
    loadTimerState();

    // Load and setup volume
    loadVolume();
    setupVolumeSlider();

    document.addEventListener('keydown', (e) => {
      if (e.key === 'r' || e.key === 'R') {
        resetTimer();
      }
    });

    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
    }

    function resetTimer() {
      const now = Date.now();
      totalStartTime = now;
      nextBellTime = now + bellIntervalSeconds * 1000;
      saveTimerState();
    }

    function skipToNextInterval() {
      const now = Date.now();
      playBell();
      nextBellTime = now + bellIntervalSeconds * 1000;
      saveTimerState();
    }

    function saveTimerState() {
      if (totalStartTime !== null && nextBellTime !== null) {
        const prefix = `bell_${bellIntervalSeconds}_`;
        localStorage.setItem(prefix + 'totalStartTime', totalStartTime.toString());
        localStorage.setItem(prefix + 'nextBellTime', nextBellTime.toString());
      }
    }

    function loadTimerState() {
      const prefix = `bell_${bellIntervalSeconds}_`;
      const savedTotalStartTime = localStorage.getItem(prefix + 'totalStartTime');
      const savedNextBellTime = localStorage.getItem(prefix + 'nextBellTime');

      const now = Date.now();

      if (savedTotalStartTime && savedNextBellTime) {
        totalStartTime = parseInt(savedTotalStartTime);
        const savedNextBell = parseInt(savedNextBellTime);

        if (now >= savedNextBell) {
          const intervalsPassed = Math.floor((now - savedNextBell) / (bellIntervalSeconds * 1000)) + 1;
          nextBellTime = savedNextBell + intervalsPassed * bellIntervalSeconds * 1000;
        } else {
          nextBellTime = savedNextBell;
        }
      } else {
        startTimer();
        return;
      }

      interval = setInterval(updateTimer, 100);
    }

    function startTimer() {
      const now = Date.now();
      totalStartTime = now;
      nextBellTime = now + bellIntervalSeconds * 1000;
      interval = setInterval(updateTimer, 100);
      saveTimerState();
    }

    function updateTimer() {
      const now = Date.now();

      const totalElapsed = (now - totalStartTime) / 1000;
      const timeUntilBell = Math.max(0, (nextBellTime - now) / 1000);

      if (now >= nextBellTime && (now - nextBellTime) < 100) {
        playBell();
        nextBellTime = now + bellIntervalSeconds * 1000;
        saveTimerState();
      }

      updateDisplay(totalElapsed, timeUntilBell);
    }

    function updateDisplay(totalSeconds, countdownSeconds) {
      // Update countdown timer
      const countdownTotalSeconds = Math.floor(countdownSeconds);
      const countdownMinutes = Math.floor(countdownTotalSeconds / 60);
      const countdownSecs = countdownTotalSeconds % 60;
      const countdownTimeString = `${String(countdownMinutes).padStart(2, '0')}:${String(countdownSecs).padStart(2, '0')}`;
      document.getElementById('countdown-timer').textContent = countdownTimeString;

      // Update total timer
      const totalTotalSeconds = Math.floor(totalSeconds);
      const totalMinutes = Math.floor(totalTotalSeconds / 60);
      const totalSecs = totalTotalSeconds % 60;
      const totalTimeString = `${String(totalMinutes).padStart(2, '0')}:${String(totalSecs).padStart(2, '0')}`;
      document.getElementById('total-timer').textContent = totalTimeString;

      // Update PIP canvas if active
      if (pipWindow && canvas && ctx) {
        updatePIPCanvas(countdownTotalSeconds, countdownMinutes, countdownSecs, totalTotalSeconds, totalMinutes, totalSecs);
      }
    }

    function playBell() {
      const audio = document.getElementById('bell-audio');
      audio.currentTime = 0;
      audio.play().catch(err => {
        console.error('Error playing bell:', err);
      });
    }

    function loadVolume() {
      const savedVolume = localStorage.getItem('bell_volume');
      if (savedVolume !== null) {
        const volume = parseFloat(savedVolume);
        const audio = document.getElementById('bell-audio');
        const slider = document.getElementById('volume-slider');
        audio.volume = volume;
        slider.value = volume;
      }
    }

    function saveVolume(volume) {
      localStorage.setItem('bell_volume', volume.toString());
    }

    function setupVolumeSlider() {
      const slider = document.getElementById('volume-slider');
      const audio = document.getElementById('bell-audio');

      slider.addEventListener('input', (e) => {
        const volume = parseFloat(e.target.value);
        audio.volume = volume;
        saveVolume(volume);

        // Debounce the bell preview
        if (volumeDebounceTimer) {
          clearTimeout(volumeDebounceTimer);
        }
        volumeDebounceTimer = setTimeout(() => {
          playBell();
        }, 300);
      });
    }

    function initializePIP() {
      canvas = document.getElementById('pip-canvas');
      ctx = canvas.getContext('2d');

      // Set high DPI resolution
      const dpr = window.devicePixelRatio || 1;
      canvas.width = 400 * dpr;
      canvas.height = 300 * dpr;
      canvas.style.width = '400px';
      canvas.style.height = '300px';
      ctx.scale(dpr, dpr);
    }

    function handleVisibilityChange() {
      if (document.hidden && 'pictureInPictureEnabled' in document) {
        enterPIP();
      } else if (!document.hidden && pipWindow) {
        exitPIP();
      }
    }

    async function enterPIP() {
      if (!canvas || pipWindow) return;

      try {
        // Calculate current elapsed times
        const now = Date.now();
        const totalElapsed = (now - totalStartTime) / 1000;
        const timeUntilBell = Math.max(0, (nextBellTime - now) / 1000);

        // Initialize canvas with current time display
        const countdownTotalSeconds = Math.floor(timeUntilBell);
        const countdownMinutes = Math.floor(countdownTotalSeconds / 60);
        const countdownSecs = countdownTotalSeconds % 60;
        const totalTotalSeconds = Math.floor(totalElapsed);
        const totalMinutes = Math.floor(totalTotalSeconds / 60);
        const totalSecs = totalTotalSeconds % 60;
        updatePIPCanvas(countdownTotalSeconds, countdownMinutes, countdownSecs, totalTotalSeconds, totalMinutes, totalSecs);

        // Create a video element to stream the canvas
        const video = document.createElement('video');
        video.srcObject = canvas.captureStream(30);
        video.muted = true;

        // Wait for metadata to load before requesting PIP
        await new Promise((resolve) => {
          video.addEventListener('loadedmetadata', resolve, { once: true });
          video.play();
        });

        pipWindow = await video.requestPictureInPicture();

        pipWindow.addEventListener('resize', () => {
          const dpr = window.devicePixelRatio || 1;
          canvas.width = pipWindow.width * dpr;
          canvas.height = pipWindow.height * dpr;
          canvas.style.width = pipWindow.width + 'px';
          canvas.style.height = pipWindow.height + 'px';
          ctx.scale(dpr, dpr);

          // Calculate current elapsed times
          const now = Date.now();
          const totalElapsed = (now - totalStartTime) / 1000;
          const timeUntilBell = Math.max(0, (nextBellTime - now) / 1000);

          // Redraw content after resize
          const countdownTotalSeconds = Math.floor(timeUntilBell);
          const countdownMinutes = Math.floor(countdownTotalSeconds / 60);
          const countdownSecs = countdownTotalSeconds % 60;
          const totalTotalSeconds = Math.floor(totalElapsed);
          const totalMinutes = Math.floor(totalTotalSeconds / 60);
          const totalSecs = totalTotalSeconds % 60;
          updatePIPCanvas(countdownTotalSeconds, countdownMinutes, countdownSecs, totalTotalSeconds, totalMinutes, totalSecs);
        });

      } catch (error) {
        console.error('Failed to enter PIP mode:', error);
      }
    }

    function exitPIP() {
      if (pipWindow) {
        document.exitPictureInPicture();
        pipWindow = null;
      }
    }

    function updatePIPCanvas(countdownTotalSeconds, countdownMinutes, countdownSecs, totalTotalSeconds, totalMinutes, totalSecs) {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const bgColor = currentTheme === 'light' ? '#f0f0f0' : '#1a1a1a';
      const textColor = currentTheme === 'light' ? '#000000' : 'rgba(255, 255, 255, 0.87)';
      const secondaryTextColor = currentTheme === 'light' ? '#666666' : 'rgba(255, 255, 255, 0.5)';

      // Use logical dimensions for drawing
      const logicalWidth = parseInt(canvas.style.width) || 400;
      const logicalHeight = parseInt(canvas.style.height) || 300;

      ctx.fillStyle = bgColor;
      ctx.fillRect(0, 0, logicalWidth, logicalHeight);

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      // Draw countdown timer (top)
      ctx.fillStyle = textColor;
      ctx.font = 'bold 64px "Reddit Mono", monospace';
      const countdownTimeText = `${String(countdownMinutes).padStart(2, '0')}:${String(countdownSecs).padStart(2, '0')}`;
      const centerX = logicalWidth / 2;
      const countdownCenterY = logicalHeight * 0.35;

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(countdownTimeText, centerX, countdownCenterY);

      // Draw total timer (bottom)
      ctx.fillStyle = secondaryTextColor;
      ctx.font = 'bold 48px "Reddit Mono", monospace';
      const totalTimeText = `${String(totalMinutes).padStart(2, '0')}:${String(totalSecs).padStart(2, '0')}`;
      const totalCenterY = logicalHeight * 0.65;

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(totalTimeText, centerX, totalCenterY);
    }
  </script>
</body>

</html>
