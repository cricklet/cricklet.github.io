<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reddit+Mono&display=swap">

  <style>
    :root {
      --bg-color: #1a1a1a;
      --text-color: rgba(255, 255, 255, 0.87);
      --section-fill: rgba(255, 255, 255, 0.07);
      --section-divider: rgba(255, 255, 255, 0.1);
    }

    :root[data-theme="light"] {
      --bg-color: #f0f0f0;
      --text-color: #000000;
      --section-fill: rgba(0, 0, 0, 0.045);
      --section-divider: rgba(0, 0, 0, 0.08);
    }

    body {
      position: relative;
      min-height: 100vh;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-color);
      color: var(--text-color);
      transition: all 0.1s ease;
    }

    .timer-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }

    #countdown-timer {
      font-size: 6rem;
      color: var(--text-color);
      transition: all 0.1s ease;
      font-family: 'Reddit Mono', monospace;
      margin-bottom: 1rem;
    }

    #interval-input {
      font-size: 6rem;
      font-family: 'Reddit Mono', monospace;
      color: var(--text-color);
      background: transparent;
      border: none;
      border-bottom: 2px solid var(--text-color);
      outline: none;
      text-align: center;
      width: 5.5ch;
      opacity: 0.7;
      margin-bottom: 1rem;
      display: none;
    }

    #total-timer {
      font-size: 3rem;
      color: var(--text-color);
      opacity: 0.7;
      transition: all 0.1s ease;
      font-family: 'Reddit Mono', monospace;
    }

    #reset-button,
    #ff-button {
      position: absolute;
      bottom: 20px;
      width: 44px;
      height: 44px;
      min-width: 44px;
      max-width: 44px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--text-color);
      color: var(--bg-color);
      opacity: 0;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
      font-size: 1.2rem;
      padding: 0;
      border: none;
      transition: all 0.1s ease;
      flex-shrink: 0;
    }

    #reset-button {
      right: 20px;
    }

    #ff-button {
      right: 74px;
      font-size: 1rem;
    }

    body:hover #reset-button,
    body:hover #ff-button {
      opacity: 1;
    }

    #reset-button:hover,
    #ff-button:hover {
      transform: scale(1.1);
    }

    [data-tooltip] {
      position: relative;
    }

    [data-tooltip]::after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: 52px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--text-color);
      color: var(--bg-color);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-family: 'Reddit Mono', monospace;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
    }

    [data-tooltip]:hover::after {
      opacity: 1;
    }

    #interval-text {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.9rem;
      color: var(--text-color);
      opacity: 0.5;
      font-family: 'Reddit Mono', monospace;
    }

    .volume-container {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0;
      transition: opacity 0.1s ease;
    }

    body:hover .volume-container {
      opacity: 1;
    }

    #volume-section {
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      width: clamp(40px, 6vw, 72px);
      background: transparent;
      overflow: hidden;
      cursor: pointer;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      border-right: 1px solid var(--section-divider);
      opacity: 0;
      transition: opacity 0.1s ease;
      z-index: 5;
    }

    body:hover #volume-section {
      opacity: 1;
    }

    #volume-fill {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 0%;
      background: var(--section-fill);
      pointer-events: none;
    }

    #volume-readout {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      text-align: center;
      font-family: 'Reddit Mono', monospace;
      font-size: clamp(0.85rem, 2.5vw, 1.5rem);
      color: rgba(128, 128, 128, 0.7);
      pointer-events: none;
    }

    #sound-select {
      font-family: 'Reddit Mono', monospace;
      font-size: 0.9rem;
      color: var(--text-color);
      background: var(--bg-color);
      border: 1px solid var(--text-color);
      border-radius: 4px;
      padding: 2px 6px;
      outline: none;
      cursor: pointer;
      opacity: 0.7;
      transition: opacity 0.1s ease;
    }

    #sound-select:hover {
      opacity: 1;
    }
  </style>
</head>

<body>
  <div class="timer-container">
    <div id="countdown-timer">00:00</div>
    <input type="text" id="interval-input" placeholder="mm:ss">
    <div id="total-timer">00:00</div>
  </div>
  <button id="ff-button" data-tooltip="skip (s)" onclick="skipToNextInterval()">⏩</button>
  <button id="reset-button" data-tooltip="reset (r)" onclick="resetTimer()">↻</button>
  <div id="interval-text"></div>
  <div id="volume-section" aria-label="Volume: drag vertically">
    <div id="volume-fill" aria-hidden="true"></div>
    <div id="volume-readout">100%</div>
  </div>
  <div class="volume-container">
    <select id="sound-select"></select>
  </div>
  <audio id="bell-audio" src="bell.mp3" preload="auto"></audio>
  <canvas id="pip-canvas" style="display: none;"></canvas>

  <script>
    let totalStartTime = null;
    let bellEpoch = null;
    let lastIntervalsPassed = 0;
    let bellIntervalSeconds = 0;
    let interval;
    let pipWindow = null;
    let pipVideo = null;
    let canvas = null;
    let ctx = null;
    let volume = 1;
    let volumeDragging = false;
    let editMode = false;

    // Bell sound options — add more entries here as you drop mp3s into the folder.
    const BELL_SOUNDS = [
      { name: 'Bell', file: 'bell.mp3' },
    ];

    function getBellIntervalFromParams() {
      const params = new URLSearchParams(window.location.search);
      const hasMinutes = params.has('minutes');
      const hasSeconds = params.has('seconds');
      if (!hasMinutes && !hasSeconds) return 5 * 60;
      const minutes = hasMinutes ? parseInt(params.get('minutes')) : 0;
      const seconds = hasSeconds ? parseInt(params.get('seconds')) : 0;
      return minutes * 60 + seconds;
    }

    bellIntervalSeconds = getBellIntervalFromParams();

    function updateIntervalText() {
      const minutes = Math.floor(bellIntervalSeconds / 60);
      const seconds = bellIntervalSeconds % 60;
      let intervalString = '';
      if (minutes > 0) {
        intervalString += `${minutes} minute${minutes !== 1 ? 's' : ''}`;
      }
      if (seconds > 0) {
        if (intervalString) intervalString += ' ';
        intervalString += `${seconds} second${seconds !== 1 ? 's' : ''}`;
      }
      if (!intervalString) intervalString = '0 seconds';
      document.getElementById('interval-text').textContent = intervalString;
    }
    updateIntervalText();

    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    setTheme(prefersDark ? 'dark' : 'light');

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
      setTheme(e.matches ? 'dark' : 'light');
    });

    initializePIP();
    document.addEventListener('visibilitychange', handleVisibilityChange);
    loadTimerState();
    loadSound();
    loadVolume();
    setupVolumeSlider();
    setupSoundSelect();

    window.addEventListener('popstate', () => {
      bellIntervalSeconds = getBellIntervalFromParams();
      updateIntervalText();
      loadTimerState();
    });

    document.addEventListener('keydown', (e) => {
      const inInput = document.activeElement && document.activeElement.tagName === 'INPUT';
      if (e.key === 'r' || e.key === 'R') {
        if (e.metaKey || e.ctrlKey) return;
        if (!inInput) resetTimer();
      } else if (e.key === 's' || e.key === 'S') {
        if (!inInput) skipToNextInterval();
      } else if (e.key === 'Enter') {
        if (!inInput) {
          e.preventDefault();
          enterEditMode();
        }
      } else if (e.key === 'Escape') {
        if (editMode) exitEditMode(false);
      }
    });

    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
    }

    function saveTimerState() {
      if (totalStartTime !== null) {
        localStorage.setItem('bell_totalStartTime', totalStartTime.toString());
      }
      if (bellEpoch !== null) {
        const prefix = `bell_${bellIntervalSeconds}_`;
        localStorage.setItem(prefix + 'bellEpoch', bellEpoch.toString());
      }
    }

    function loadTimerState() {
      clearInterval(interval);
      interval = null;

      const prefix = `bell_${bellIntervalSeconds}_`;
      // totalStartTime is global so changing the interval doesn't reset the
      // bottom stopwatch; legacy per-interval key kept as a migration fallback.
      const savedTotal = localStorage.getItem('bell_totalStartTime')
        ?? localStorage.getItem(prefix + 'totalStartTime');
      const savedEpoch = localStorage.getItem(prefix + 'bellEpoch');
      const now = Date.now();

      totalStartTime = savedTotal !== null ? parseInt(savedTotal) : now;
      bellEpoch = savedEpoch !== null ? parseInt(savedEpoch) : now;
      saveTimerState();

      lastIntervalsPassed = Math.floor((now - bellEpoch) / 1000 / bellIntervalSeconds);
      interval = setInterval(updateTimer, 100);
    }

    function resetTimer() {
      const now = Date.now();
      totalStartTime = now;
      bellEpoch = now;
      lastIntervalsPassed = 0;
      saveTimerState();
    }

    function skipToNextInterval() {
      playBell();
      const now = Date.now();
      bellEpoch = now;
      lastIntervalsPassed = 0;
      saveTimerState();
    }

    function updateTimer() {
      const now = Date.now();
      const totalElapsed = (now - totalStartTime) / 1000;
      const bellElapsed = (now - bellEpoch) / 1000;
      const intervalsPassed = Math.floor(bellElapsed / bellIntervalSeconds);

      if (intervalsPassed > lastIntervalsPassed) {
        playBell();
        lastIntervalsPassed = intervalsPassed;
      }

      const timeUntilBell = bellIntervalSeconds - (bellElapsed % bellIntervalSeconds);
      updateDisplay(totalElapsed, timeUntilBell);
    }

    function updateDisplay(totalSeconds, countdownSeconds) {
      const countdownTotalSeconds = Math.floor(countdownSeconds);
      const countdownMinutes = Math.floor(countdownTotalSeconds / 60);
      const countdownSecs = countdownTotalSeconds % 60;
      const countdownTimeString = `${String(countdownMinutes).padStart(2, '0')}:${String(countdownSecs).padStart(2, '0')}`;
      document.getElementById('countdown-timer').textContent = countdownTimeString;

      const totalTotalSeconds = Math.floor(totalSeconds);
      const totalMinutes = Math.floor(totalTotalSeconds / 60);
      const totalSecs = totalTotalSeconds % 60;
      const totalTimeString = `${String(totalMinutes).padStart(2, '0')}:${String(totalSecs).padStart(2, '0')}`;
      document.getElementById('total-timer').textContent = totalTimeString;

      if (pipWindow && canvas && ctx) {
        updatePIPCanvas(countdownTotalSeconds, countdownMinutes, countdownSecs, totalTotalSeconds, totalMinutes, totalSecs);
      }
    }

    function playBell() {
      const audio = document.getElementById('bell-audio');
      audio.currentTime = 0;
      audio.play().catch(err => {
        console.error('Error playing bell:', err);
      });
    }

    function clampVolume(v) {
      return Math.min(1, Math.max(0, v));
    }

    function volumeFromClientY(clientY) {
      const r = document.getElementById('volume-section').getBoundingClientRect();
      const t = r.height <= 0 ? 1 : (r.bottom - clientY) / r.height;
      return clampVolume(t);
    }

    function setVolume(next) {
      volume = clampVolume(next);
      document.getElementById('volume-readout').textContent = `${Math.round(volume * 100)}%`;
      document.getElementById('volume-fill').style.height = `${volume * 100}%`;
      document.getElementById('bell-audio').volume = volume;
    }

    function loadVolume() {
      const savedVolume = localStorage.getItem('bell_volume');
      const parsed = savedVolume !== null ? parseFloat(savedVolume) : 1;
      setVolume(Number.isFinite(parsed) ? parsed : 1);
    }

    function saveVolume() {
      localStorage.setItem('bell_volume', volume.toString());
    }

    function setupVolumeSlider() {
      const section = document.getElementById('volume-section');

      section.addEventListener('pointerdown', (e) => {
        section.setPointerCapture(e.pointerId);
        volumeDragging = true;
        setVolume(volumeFromClientY(e.clientY));
      });
      section.addEventListener('pointermove', (e) => {
        if (!volumeDragging) return;
        setVolume(volumeFromClientY(e.clientY));
      });

      const endDrag = (e) => {
        if (!volumeDragging) return;
        volumeDragging = false;
        saveVolume();
        try {
          section.releasePointerCapture(e.pointerId);
        } catch (_) {
          /* ignore */
        }
      };
      section.addEventListener('pointerup', endDrag);
      section.addEventListener('pointercancel', endDrag);
    }

    function loadSound() {
      const select = document.getElementById('sound-select');
      BELL_SOUNDS.forEach(sound => {
        const opt = document.createElement('option');
        opt.value = sound.file;
        opt.textContent = sound.name;
        select.appendChild(opt);
      });

      const saved = localStorage.getItem('bell_sound');
      const chosen = (saved && BELL_SOUNDS.some(s => s.file === saved))
        ? saved
        : BELL_SOUNDS[0].file;
      select.value = chosen;

      const audio = document.getElementById('bell-audio');
      if (audio.getAttribute('src') !== chosen) {
        audio.setAttribute('src', chosen);
        audio.load();
      }
    }

    function setupSoundSelect() {
      const select = document.getElementById('sound-select');
      select.addEventListener('change', (e) => {
        const file = e.target.value;
        const audio = document.getElementById('bell-audio');
        audio.setAttribute('src', file);
        audio.load();
        localStorage.setItem('bell_sound', file);
        playBell();
      });
    }

    function enterEditMode() {
      if (editMode) return;
      editMode = true;
      const countdownEl = document.getElementById('countdown-timer');
      const inputEl = document.getElementById('interval-input');
      const mins = Math.floor(bellIntervalSeconds / 60);
      const secs = bellIntervalSeconds % 60;
      inputEl.value = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      countdownEl.style.display = 'none';
      inputEl.style.display = 'block';
      inputEl.focus();
      inputEl.select();
      inputEl.addEventListener('keydown', handleIntervalInputKey);
      inputEl.addEventListener('blur', handleIntervalInputBlur);
    }

    function handleIntervalInputKey(e) {
      if (e.key === 'Enter') {
        e.stopPropagation();
        exitEditMode(true);
      } else if (e.key === 'Escape') {
        e.stopPropagation();
        exitEditMode(false);
      }
    }

    function handleIntervalInputBlur() {
      exitEditMode(false);
    }

    function exitEditMode(confirm) {
      if (!editMode) return;
      editMode = false;
      const countdownEl = document.getElementById('countdown-timer');
      const inputEl = document.getElementById('interval-input');
      inputEl.removeEventListener('keydown', handleIntervalInputKey);
      inputEl.removeEventListener('blur', handleIntervalInputBlur);
      countdownEl.style.display = '';
      inputEl.style.display = 'none';

      if (confirm) {
        const parsed = parseIntervalInput(inputEl.value);
        if (parsed > 0) changeInterval(parsed);
      }
    }

    function parseIntervalInput(value) {
      value = value.trim();
      if (value.includes(':')) {
        const parts = value.split(':');
        const mins = parseInt(parts[0]) || 0;
        const secs = parseInt(parts[1]) || 0;
        return mins * 60 + secs;
      }
      const num = parseFloat(value);
      if (!isNaN(num) && num > 0) return Math.round(num * 60);
      return 0;
    }

    function changeInterval(newSeconds) {
      clearInterval(interval);
      interval = null;
      bellIntervalSeconds = newSeconds;
      updateIntervalText();

      const mins = Math.floor(newSeconds / 60);
      const secs = newSeconds % 60;
      const params = new URLSearchParams();
      if (mins > 0) params.set('minutes', String(mins));
      if (secs > 0) params.set('seconds', String(secs));
      const search = params.toString() ? `?${params.toString()}` : '';
      history.pushState(null, '', window.location.pathname + search);

      loadTimerState();
    }

    function initializePIP() {
      canvas = document.getElementById('pip-canvas');
      ctx = canvas.getContext('2d');

      const dpr = window.devicePixelRatio || 1;
      canvas.width = 400 * dpr;
      canvas.height = 300 * dpr;
      canvas.style.width = '400px';
      canvas.style.height = '300px';
      ctx.scale(dpr, dpr);
    }

    function handleVisibilityChange() {
      if (document.hidden && 'pictureInPictureEnabled' in document) {
        enterPIP();
      } else if (!document.hidden && pipWindow) {
        exitPIP();
      }
    }

    async function enterPIP() {
      if (!canvas || pipWindow) return;

      try {
        const now = Date.now();
        const totalElapsed = (now - totalStartTime) / 1000;
        const bellElapsed = (now - bellEpoch) / 1000;
        const timeUntilBell = bellIntervalSeconds - (bellElapsed % bellIntervalSeconds);

        const countdownTotalSeconds = Math.floor(timeUntilBell);
        const countdownMinutes = Math.floor(countdownTotalSeconds / 60);
        const countdownSecs = countdownTotalSeconds % 60;
        const totalTotalSeconds = Math.floor(totalElapsed);
        const totalMinutes = Math.floor(totalTotalSeconds / 60);
        const totalSecs = totalTotalSeconds % 60;
        updatePIPCanvas(countdownTotalSeconds, countdownMinutes, countdownSecs, totalTotalSeconds, totalMinutes, totalSecs);

        pipVideo = document.createElement('video');
        pipVideo.srcObject = canvas.captureStream(30);
        pipVideo.muted = true;

        await new Promise((resolve) => {
          pipVideo.addEventListener('loadedmetadata', resolve, { once: true });
          pipVideo.play();
        });

        pipWindow = await pipVideo.requestPictureInPicture();

        pipVideo.addEventListener('leavepictureinpicture', () => {
          pipWindow = null;
          pipVideo = null;
        }, { once: true });

        pipWindow.addEventListener('resize', () => {
          const dpr = window.devicePixelRatio || 1;
          canvas.width = pipWindow.width * dpr;
          canvas.height = pipWindow.height * dpr;
          canvas.style.width = pipWindow.width + 'px';
          canvas.style.height = pipWindow.height + 'px';
          ctx.scale(dpr, dpr);

          const now = Date.now();
          const totalElapsed = (now - totalStartTime) / 1000;
          const bellElapsed = (now - bellEpoch) / 1000;
          const timeUntilBell = bellIntervalSeconds - (bellElapsed % bellIntervalSeconds);

          const countdownTotalSeconds = Math.floor(timeUntilBell);
          const countdownMinutes = Math.floor(countdownTotalSeconds / 60);
          const countdownSecs = countdownTotalSeconds % 60;
          const totalTotalSeconds = Math.floor(totalElapsed);
          const totalMinutes = Math.floor(totalTotalSeconds / 60);
          const totalSecs = totalTotalSeconds % 60;
          updatePIPCanvas(countdownTotalSeconds, countdownMinutes, countdownSecs, totalTotalSeconds, totalMinutes, totalSecs);
        });

      } catch (error) {
        console.error('Failed to enter PIP mode:', error);
      }
    }

    function exitPIP() {
      if (pipWindow) {
        document.exitPictureInPicture();
        pipWindow = null;
        pipVideo = null;
      }
    }

    function updatePIPCanvas(countdownTotalSeconds, countdownMinutes, countdownSecs, totalTotalSeconds, totalMinutes, totalSecs) {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const bgColor = currentTheme === 'light' ? '#f0f0f0' : '#1a1a1a';
      const textColor = currentTheme === 'light' ? '#000000' : 'rgba(255, 255, 255, 0.87)';
      const secondaryTextColor = currentTheme === 'light' ? '#666666' : 'rgba(255, 255, 255, 0.5)';

      const logicalWidth = parseInt(canvas.style.width) || 400;
      const logicalHeight = parseInt(canvas.style.height) || 300;

      ctx.fillStyle = bgColor;
      ctx.fillRect(0, 0, logicalWidth, logicalHeight);

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      ctx.fillStyle = textColor;
      ctx.font = 'bold 64px "Reddit Mono", monospace';
      const countdownTimeText = `${String(countdownMinutes).padStart(2, '0')}:${String(countdownSecs).padStart(2, '0')}`;
      const centerX = logicalWidth / 2;
      const countdownCenterY = logicalHeight * 0.35;

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(countdownTimeText, centerX, countdownCenterY);

      ctx.fillStyle = secondaryTextColor;
      ctx.font = 'bold 48px "Reddit Mono", monospace';
      const totalTimeText = `${String(totalMinutes).padStart(2, '0')}:${String(totalSecs).padStart(2, '0')}`;
      const totalCenterY = logicalHeight * 0.65;

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(totalTimeText, centerX, totalCenterY);
    }
  </script>
</body>

</html>
