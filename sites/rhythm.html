<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rhythm Trainer</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reddit+Mono&display=swap">

  <style>
    :root {
      --bg-color: #1a1a1a;
      --text-color: rgba(255, 255, 255, 0.87);
      --border-color: rgba(255, 255, 255, 0.35);
      --section-fill: rgba(255, 255, 255, 0.07);
      --section-divider: rgba(255, 255, 255, 0.1);
      --cell-off: rgba(255, 255, 255, 0.06);
      --cell-on: rgba(122, 170, 245, 0.95);
      --cell-held: rgba(122, 170, 245, 0.4);
      --control-bg: rgba(128, 128, 128, 0.18);
    }

    :root[data-theme="light"] {
      --bg-color: #f0f0f0;
      --text-color: #000000;
      --border-color: rgba(0, 0, 0, 0.28);
      --section-fill: rgba(0, 0, 0, 0.045);
      --section-divider: rgba(0, 0, 0, 0.08);
      --cell-off: rgba(0, 0, 0, 0.06);
      --cell-on: rgba(54, 110, 200, 0.85);
      --control-bg: rgba(128, 128, 128, 0.18);
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; margin: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: row;
      height: 100dvh;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    #main-area {
      flex: 1 1 0;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 18px 22px;
      gap: 14px;
      overflow: hidden;
    }

    /* ---- Controls bar ---- */
    #controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      font-family: 'Reddit Mono', monospace;
      font-size: 0.8rem;
    }
    .ctl-group {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .ctl-group > label {
      font-size: 0.65rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      opacity: 0.55;
    }
    #controls input,
    #controls select {
      font-family: 'Reddit Mono', monospace;
      font-size: 0.78rem;
      height: 30px;            /* match the buttons so the row lines up */
      line-height: 1;
      background: var(--control-bg);
      color: var(--text-color);
      border: none;
      border-radius: 6px;
      padding: 0 8px;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
      cursor: pointer;
    }
    #controls input {
      width: 40px;
      text-align: center;
      cursor: text;
    }
    #controls input[type="number"]::-webkit-outer-spin-button,
    #controls input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none; margin: 0;
    }
    #controls input:focus, #controls select:focus {
      box-shadow: 0 0 0 1.5px rgba(128, 128, 128, 0.55);
    }
    /* appearance:none selects don't auto-center their text — do it explicitly. */
    #controls select { text-align: center; line-height: 30px; }
    #den-select { width: 40px; }   /* match the numerator input */
    .timesig { display: flex; align-items: center; gap: 3px; }
    .timesig .slash { opacity: 0.5; }

    /* Matches the toggle look used across the apps: dim grey fill + muted text,
       and an outlined ring (border = text color) when active/on. */
    button.btn {
      font-family: 'Reddit Mono', monospace;
      font-size: 0.78rem;
      line-height: 1;
      height: 30px;            /* fixed so the ▶/⏸ glyph swap can't change height */
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      color: rgba(128, 128, 128, 0.85);
      background: rgba(128, 128, 128, 0.18);
      border: none;
      border-radius: 6px;
      padding: 0 12px;
      cursor: pointer;
      transition: background 0.12s ease, color 0.12s ease;
    }
    button.btn:hover { background: rgba(128, 128, 128, 0.3); }
    button.btn:focus { outline: none; }

    /* Text buttons share a min-width so similar ones (Play/Clear/Save) match. */
    button.btn { min-width: 64px; }
    #play-btn { font-weight: 600; }
    /* Icon-only buttons are identical squares. */
    #shuffle-btn, #playlist-btn { min-width: 0; width: 30px; padding: 0; }

    /* Playing / toggled-on: outlined ring via inset shadow (no size change). */
    #play-btn.playing,
    button.btn.active {
      background: var(--bg-color);
      color: var(--text-color);
      box-shadow: inset 0 0 0 1.5px var(--text-color);
    }

    /* ---- Step grid ---- */
    /* A spacing hierarchy makes the structure obvious: cells sit tight inside a
       beat, beats are spaced apart, measures more so. Note state only changes a
       cell's COLOR — never the layout — so padding stays perfectly even no
       matter what's placed in each step. */
    #grid {
      display: flex;
      flex-wrap: wrap;
      gap: 16px 22px;
      align-items: flex-start;
      /* Shift left by the measure's left padding so the first step still lines
         up with the play button while the active highlight gets left breathing
         room (the highlight extends into this padding without moving steps). */
      margin-left: -8px;
    }
    .measure {
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding: 8px;
      border-radius: 6px;
    }
    .measure.active {
      background: rgba(122, 170, 245, 0.1);
    }
    /* Per-bar header: bar number + its (overridable) time signature. */
    .measure-head {
      display: flex;
      align-items: center;
      gap: 6px;
      min-height: 22px;
    }
    .measure-num {
      font-family: 'Reddit Mono', monospace;
      font-size: 0.62rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      opacity: 0.45;
    }
    .bar-sig {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      font-family: 'Reddit Mono', monospace;
      font-size: 0.62rem;
      opacity: 0.5;
    }
    .bar-sig.overridden { opacity: 0.95; color: var(--cell-on); }
    .bar-num-input, .bar-den-select {
      font-family: 'Reddit Mono', monospace;
      font-size: 0.66rem;
      height: 20px;
      line-height: 1;
      background: var(--control-bg);
      color: inherit;
      border: none;
      border-radius: 4px;
      padding: 0 3px;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
      cursor: pointer;
    }
    .bar-num-input { width: 26px; text-align: center; cursor: text; }
    .bar-den-select { width: 26px; text-align: center; line-height: 20px; }
    .bar-num-input::-webkit-outer-spin-button,
    .bar-num-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .bar-num-input:focus, .bar-den-select:focus { box-shadow: 0 0 0 1.5px rgba(128, 128, 128, 0.55); }
    .bar-slash { opacity: 0.5; }
    .bar-reset {
      background: none;
      border: none;
      color: var(--cell-on);
      cursor: pointer;
      font-size: 0.72rem;
      padding: 0 2px;
      line-height: 1;
    }
    .bar-reset:focus { outline: none; }
    /* Enable/disable LED: filled accent dot when on, hollow grey when off. */
    .bar-toggle {
      background: none;
      border: none;
      color: var(--cell-on);
      opacity: 0.75;
      cursor: pointer;
      font-size: 0.7rem;
      line-height: 1;
      padding: 0 2px;
    }
    .bar-toggle.off { color: rgba(128, 128, 128, 0.8); }
    .bar-toggle:hover { opacity: 1; }
    .bar-toggle:focus { outline: none; }
    /* A disabled bar stays in place but is dimmed and not graded. */
    .measure.disabled .beats,
    .measure.disabled .measure-num,
    .measure.disabled .bar-sig { opacity: 0.4; }
    .beats { display: flex; gap: 12px; }
    .beat { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .cells { display: flex; gap: 4px; }
    .step {
      width: clamp(20px, 2.8vw, 30px);
      height: clamp(20px, 2.8vw, 30px);
      border-radius: 4px;
      background: var(--cell-off);
      border: 1px solid var(--section-divider);
      cursor: pointer;
      position: relative;
      touch-action: none;
    }
    .step.on { background: var(--cell-on); border-color: transparent; }
    .step.held { background: var(--cell-held); border-color: transparent; }

    /* ---- Notation (rendered by abcjs) ---- */
    #notation-wrap {
      width: 100%;
      /* positioning context for the measure-highlight overlay; visible so the
         overlay can spill into the surrounding gaps (the staff fits the width). */
      position: relative;
      overflow: visible;
    }
    #notation { width: 100%; min-height: 84px; display: flex; justify-content: flex-start; }
    #notation svg { height: auto; max-width: 100%; display: block; }
    /* abcjs paints paths/text black by default; recolor for theme. (No
       !important — per-note accuracy colors are applied via inline style.) */
    #notation svg path { fill: var(--text-color); }
    #notation svg text { fill: var(--text-color); }
    /* Current-measure highlight: a plain HTML overlay (not an svg rect, which the
       svg viewport would clip). Matches the grid's .measure.active fill exactly. */
    .measure-hl {
      position: absolute;
      background: rgba(122, 170, 245, 0.1);
      border-radius: 6px;
      pointer-events: none;
      display: none;
    }

    /* ---- History ---- */
    #history {
      flex: 1 1 0;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 0 4px 0 0;
      /* Tighter than the rest of #main-area's gap (the staff above already has
         vertical breathing built into its render). */
      margin-top: -6px;
    }
    .hist-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .hist-play {
      flex: 0 0 auto;
      width: 28px;
      height: 28px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      line-height: 1;
      color: rgba(128, 128, 128, 0.85);
      background: rgba(128, 128, 128, 0.18);
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.12s ease, color 0.12s ease;
    }
    .hist-play:hover { background: rgba(128, 128, 128, 0.3); color: var(--text-color); }
    .hist-play:focus { outline: none; }
    .hist-play:active { background: rgba(128, 128, 128, 0.38); }
    .hist-track {
      position: relative;
      /* Sized per-row to match the notation staff width (set inline); shrinks
         if the row is too narrow, but never grows to fill the whole row. */
      flex: 0 1 auto;
      width: 280px;
      height: 40px;
      background: rgba(128, 128, 128, 0.08);
      border-radius: 4px;
      overflow: hidden;
    }
    .hist-beat {
      position: absolute;
      top: 0; bottom: 0;
      width: 1px;
      background: rgba(128, 128, 128, 0.25);
    }
    .hist-measure {
      position: absolute;
      top: 0; bottom: 0;
      width: 1px;
      background: rgba(128, 128, 128, 0.6);
    }
    .hist-target {
      position: absolute;
      top: 10px; bottom: 10px;
      width: 2px;
      margin-left: -1px;
      background: rgba(255, 255, 255, 0.45);
      border-radius: 1px;
    }
    :root[data-theme="light"] .hist-target { background: rgba(0, 0, 0, 0.4); }
    /* Your tap: a dot (slightly smaller than before) on a faint vertical line.
       Color is set inline by accuracy. */
    .hist-tap {
      position: absolute;
      top: 50%;
      width: 8px;
      height: 8px;
      margin-left: -4px;
      margin-top: -4px;
      border-radius: 50%;
      box-shadow: 0 0 4px currentColor;
    }
    .hist-tap::before {
      content: '';
      position: absolute;
      left: 50%; top: -12px; bottom: -12px;
      width: 2px;
      margin-left: -1px;
      background: currentColor;
      opacity: 0.5;
    }

    /* ---- Right panel: BPM + volume vertical strips ---- */
    #right-panel {
      display: flex;
      flex-direction: row;
      flex-shrink: 0;
    }
    .control-section {
      position: relative;
      flex: 0 0 clamp(40px, 6vw, 72px);
      height: 100%;
      background: transparent;
      overflow: hidden;
      cursor: pointer;
      touch-action: none;
      border-left: 1px solid var(--section-divider);
    }
    .fill {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      width: 100%;
      height: 0%;
      background: var(--section-fill);
      z-index: 0;
      pointer-events: none;
    }
    .readout {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      z-index: 1;
      font-family: 'Reddit Mono', monospace;
      font-size: clamp(0.85rem, 2.5vw, 1.4rem);
      font-weight: 600;
      text-align: center;
      pointer-events: none;
      color: rgba(128, 128, 128, 0.85);
      line-height: 1.3;
    }
    .readout .unit {
      display: block;
      font-size: 0.6em;
      font-weight: 400;
      opacity: 0.7;
    }

    #toast {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg-color);
      color: var(--text-color);
      border: 1px solid var(--section-divider);
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
      border-radius: 6px;
      padding: 7px 14px;
      font-family: 'Reddit Mono', monospace;
      font-size: 0.78rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
      z-index: 50;
    }
    #toast.show { opacity: 1; }

    /* ---- Top bar ---- */
    #main-col {
      flex: 1 1 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }
    #top-bar {
      flex-shrink: 0;
      height: 44px;
      display: flex;
      align-items: center;
      padding: 0 8px;
      gap: 6px;
      border-bottom: 1px solid var(--section-divider);
    }
    #file-picker-btn {
      font-family: 'Reddit Mono', monospace;
      font-size: 0.82rem;
      background: transparent;
      color: var(--text-color);
      border: none;
      border-radius: 4px;
      padding: 4px 10px;
      cursor: pointer;
      flex: 1 1 0;
      min-width: 0;
      outline: none;
      text-align: left;
      text-overflow: ellipsis;
      overflow: hidden;
      white-space: nowrap;
    }
    #file-picker-btn:hover { background: var(--section-fill); }
    #file-picker-btn .fp-btn-caret { opacity: 0.5; margin-right: 6px; }
    .fp-rename-input {
      flex: 1 1 0; min-width: 0;
      font-family: 'Reddit Mono', monospace; font-size: 0.82rem;
      height: 26px; line-height: 1;
      background: var(--control-bg); color: var(--text-color);
      border: none; border-radius: 6px;
      padding: 0 8px; outline: none;
    }
    .fp-rename-input:focus { box-shadow: 0 0 0 1.5px rgba(128, 128, 128, 0.55); }

    /* ---- File browser: overlay (narrow) / left sidebar (wide) ---- */
    #file-picker-panel {
      position: fixed;
      top: 44px; left: 0; right: 0; bottom: 0;
      background: var(--bg-color);
      border-top: 1px solid var(--section-divider);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      z-index: 60;
    }
    #file-picker-panel[hidden] { display: none; }
    /* Narrow: while the browser overlay is open, hide the bpm/volume bars so the
       full-width header covers that area instead of leaving them peeking out. */
    @media (max-width: 999px) {
      body.fp-open #right-panel,
      body.fp-open #top-bar .btn { display: none; }
    }
    @media (min-width: 1000px) {
      #file-picker-panel {
        display: flex !important;
        position: static;
        width: 380px;
        min-width: 340px;
        flex-shrink: 0;
        height: 100%;
        border-top: none;
        border-right: 1px solid var(--section-divider);
        z-index: auto;
      }
      #file-picker-btn { cursor: text; }
      #file-picker-btn:hover { background: transparent; }
      #file-picker-btn .fp-btn-caret { display: none; }
      /* Sidebar: the top (up / root) row matches the header height so the file
         list lines up with the main content below the header. */
      #file-picker-panel .fp-top { height: 44px; }
    }

    /* ---- Save dialog (modal) ---- */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .overlay[hidden] { display: none; }
    #save-dialog {
      width: min(440px, 92vw);
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      background: var(--bg-color);
      border: 1px solid var(--section-divider);
      border-radius: 8px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
      overflow: hidden;
    }
    #fp-header {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 8px 12px;
      border-bottom: 1px solid var(--section-divider);
    }
    /* The save dialog keeps its titled header. */
    #save-dialog #fp-header { justify-content: space-between; padding: 10px 14px; font-family: 'Reddit Mono', monospace; font-size: 0.8rem; font-weight: 600; }
    .fp-close {
      background: none; border: none; color: var(--text-color);
      opacity: 0.5; cursor: pointer; font-size: 0.9rem; padding: 2px 4px; line-height: 1;
    }
    .fp-close:hover { opacity: 1; }
    .fp-close:focus { outline: none; }
    #fp-list { overflow-y: auto; flex: 1 1 auto; }
    .fp-row {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 34px;
      padding: 0 14px;
      border-bottom: 1px solid var(--section-divider);
      font-family: 'Reddit Mono', monospace;
      font-size: 0.78rem;
      cursor: pointer;
    }
    .fp-row:hover { background: var(--section-fill); }
    .fp-row.fp-dragging { opacity: 0.4; }
    .fp-row.fp-current { background: var(--section-fill); }
    .fp-row.fp-current .fp-name { color: var(--cell-on); font-weight: 600; }
    .fp-row .fp-icon { flex: 0 0 1.1rem; opacity: 0.7; }
    .fp-row .fp-name { flex: 1 1 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .fp-row .fp-date { flex: 0 0 auto; font-size: 0.66rem; opacity: 0.45; }
    .fp-row.fp-up, .fp-row.fp-folder { opacity: 0.92; }
    /* Root hint: not clickable. */
    .fp-row.fp-root { cursor: default; opacity: 0.5; }
    .fp-row.fp-root:hover { background: none; }
    .fp-row .fp-del {
      flex: 0 0 auto;
      width: 20px; height: 20px;
      background: none; border: none;
      color: rgba(128, 128, 128, 0.4);
      cursor: pointer; font-size: 0.95rem; line-height: 1;
      border-radius: 3px;
    }
    .fp-row .fp-del:hover { background: rgba(128, 128, 128, 0.2); color: #e06b6b; }
    .fp-row .fp-del:focus { outline: none; }
    .fp-empty { padding: 18px 14px; font-family: 'Reddit Mono', monospace; font-size: 0.74rem; opacity: 0.45; }
    #file-picker-footer {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 8px 14px;
      border-top: 1px solid var(--section-divider);
      font-family: 'Reddit Mono', monospace;
      font-size: 0.72rem;
    }
    #fp-path { flex: 1 1 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; opacity: 0.7; }
    #fp-footer-actions { display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
    #add-folder-btn, #add-file-btn, #export-btn {
      font-family: 'Reddit Mono', monospace; font-size: 0.72rem;
      color: rgba(128, 128, 128, 0.6); background: none; border: none; cursor: pointer; padding: 0;
      white-space: nowrap;
    }
    #add-folder-btn:hover, #add-file-btn:hover, #export-btn:hover { color: var(--text-color); }
    .save-field {
      display: flex; flex-direction: column; gap: 4px;
      padding: 12px 14px 0;
      font-family: 'Reddit Mono', monospace; font-size: 0.72rem;
    }
    .save-field > span { opacity: 0.55; text-transform: uppercase; letter-spacing: 0.04em; font-size: 0.66rem; }
    .save-field input {
      font-family: 'Reddit Mono', monospace; font-size: 0.82rem;
      height: 32px; line-height: 1;
      background: var(--control-bg); color: var(--text-color);
      border: none; border-radius: 6px;
      padding: 0 10px; outline: none;
    }
    .save-field input:focus { box-shadow: 0 0 0 1.5px rgba(128, 128, 128, 0.55); }
    .save-hint {
      padding: 8px 14px 0;
      font-family: 'Reddit Mono', monospace;
      font-size: 0.66rem;
      opacity: 0.45;
      line-height: 1.4;
    }
    .save-actions {
      display: flex; justify-content: flex-end; gap: 8px;
      padding: 14px;
    }
  </style>
</head>

<body>
  <!-- Saved patterns: full overlay when narrow, left sidebar when wide -->
  <div id="file-picker-panel" hidden>
    <div id="fp-list"></div>
    <div id="file-picker-footer">
      <div id="fp-path" title="Current folder">/</div>
      <div id="fp-footer-actions">
        <button id="add-file-btn" type="button" title="New blank pattern" onclick="newFile()">+ file</button>
        <button id="add-folder-btn" type="button" title="New folder" onclick="addFolderPrompt()">+ folder</button>
        <button id="export-btn" type="button" title="Download this folder's patterns as JSON (drag the file back in to import)" onclick="exportFolder()">↓ json</button>
      </div>
    </div>
  </div>

  <div id="main-col">
    <div id="top-bar">
      <button type="button" id="file-picker-btn" onclick="toggleFileBrowser()" title="Saved patterns"><span class="fp-btn-caret">▾</span><span id="fp-btn-name">Untitled</span></button>
      <button type="button" class="btn" id="play-btn" onclick="togglePlay()">Play</button>
      <button type="button" class="btn" id="shuffle-btn" onclick="toggleShuffle()" title="Practice mode: repeat each saved clip until you nail it green twice, then jump to a random one">🔀</button>
      <button type="button" class="btn" id="playlist-btn" onclick="togglePlaylist()" title="Practice mode: like shuffle, but goes through saved clips in order">📋</button>
    </div>
    <div id="main-area">
    <div id="controls">
      <div class="ctl-group timesig">
        <input type="number" id="num-input" min="1" max="16" value="4" aria-label="Beats per measure">
        <span class="slash">/</span>
        <select id="den-select" aria-label="Beat unit">
          <option value="2">2</option>
          <option value="4" selected>4</option>
          <option value="8">8</option>
          <option value="16">16</option>
        </select>
      </div>
      <div class="ctl-group">
        <input type="text" id="measures-input" inputmode="numeric" value="x1" aria-label="Number of measures">
      </div>
      <div class="ctl-group">
        <select id="subdiv-select" aria-label="Subdivision">
          <option value="1">♩ 1</option>
          <option value="2">♪ 2</option>
          <option value="4" selected>♬ 4</option>
        </select>
      </div>
      <button type="button" class="btn" onclick="fillPattern(false)">Clear</button>
      <button type="button" class="btn" onclick="openSaveDialog()">Save</button>
      <button type="button" class="btn" id="tapsound-btn" onclick="toggleTapSound()" title="Play a little sound on every tap">Tap ♪</button>
      <button type="button" class="btn" id="countin-btn" onclick="toggleCountIn()" title="Count-in: spoken voice when on, two soft clicks when off">Voice</button>
    </div>

    <div id="grid"></div>

    <div id="notation-wrap">
      <div id="notation"></div>
    </div>

    <div id="history"></div>
    </div>
  </div>

  <div id="right-panel">
    <div id="bpm-section" class="control-section" aria-label="Tempo: drag vertically">
      <div id="bpm-fill" class="fill" aria-hidden="true"></div>
      <div class="readout"><span id="bpm-readout">120</span><span class="unit">BPM</span></div>
    </div>
    <div id="volume-section" class="control-section" aria-label="Volume: drag vertically">
      <div id="volume-fill" class="fill" aria-hidden="true"></div>
      <div class="readout"><span id="volume-readout">100</span><span class="unit">VOL</span></div>
    </div>
  </div>

  <div id="toast"></div>

  <!-- Save dialog -->
  <div id="save-overlay" class="overlay" hidden>
    <div id="save-dialog">
      <div id="fp-header">
        <span id="fp-title">Save pattern</span>
        <button type="button" class="fp-close" onclick="closeSaveDialog()" aria-label="Close">✕</button>
      </div>
      <label class="save-field">
        <span>Name</span>
        <input type="text" id="save-name" autocomplete="off" spellcheck="false">
      </label>
      <label class="save-field">
        <span>Folder</span>
        <input type="text" id="save-folder" list="save-folder-list" autocomplete="off" spellcheck="false" placeholder="(root)">
        <datalist id="save-folder-list"></datalist>
      </label>
      <div class="save-hint">Tip: end the name with a number to set its tempo, e.g. "Groove 125".</div>
      <div class="save-actions">
        <button type="button" class="btn" onclick="closeSaveDialog()">Cancel</button>
        <button type="button" class="btn" id="save-confirm-btn" onclick="doSave()">Save</button>

  </div>

  <audio id="click-audio" src="click.mp3" preload="auto"></audio>
  <audio id="click-soft-audio" src="click-soft.mp3" preload="auto"></audio>

  <script src="https://cdn.jsdelivr.net/npm/abcjs@6.4.4/dist/abcjs-basic-min.js"></script>
  <script>
    const BPM_MIN = 30;
    const BPM_MAX = 300;
    const STORAGE_BPM = 'rhythm_bpm';
    const STORAGE_VOLUME = 'rhythm_volume';
    const STORAGE_NUM = 'rhythm_num';      // default numerator
    const STORAGE_DEN = 'rhythm_den';      // default denominator
    const STORAGE_MEASURES = 'rhythm_measures';
    const STORAGE_SUBDIV = 'rhythm_subdiv';
    const STORAGE_PATTERN = 'rhythm_pattern';
    const STORAGE_BARSIG = 'rhythm_barsig';
    const STORAGE_BARDISABLED = 'rhythm_bardisabled';
    const STORAGE_SAVES = 'rhythm_saves';
    const STORAGE_TAPSOUND = 'rhythm_tapsound';
    const STORAGE_COUNTIN = 'rhythm_countin';   // '1' = spoken voice, '0' = soft clicks
    const MAX_HISTORY_ROWS = 20;
    const CUTTIME_BPM = 140;   // at/above this, 4/4 counts in "1 2" (cut time)
    const COUNT_VOLUME = 0.2;  // count-in plays at 20% of the metronome volume
    const GREEN_FRAC = 0.25;   // a note counts as "green" within this fraction of the window

    function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }
    // Single timebase: once the audio engine exists, use its clock so scheduling
    // and tap timestamps share the same reference.
    function nowSec() { return audioCtx ? audioCtx.currentTime : performance.now() / 1000; }

    // ---- Sequence state ----
    // A default time signature applies to every bar; any bar may override it
    // (barSig[m] = {num, den} or null). Subdivision (steps per beat) is global.
    // A "beat" is always 60/bpm; the denominator only affects how it's written.
    let defNum = 4;       // default numerator (beats per bar)
    let defDen = 4;       // default denominator (beat unit; notation only)
    let measures = 1;     // number of bars
    let subdiv = 4;       // steps per beat (default: 16th notes)
    let barSig = [];      // per-bar {num, den} override, or null = use default
    let barDisabled = []; // per-bar disable flag (kept in the loop, but not graded)
    let pattern = [];     // flat step states across all bars: 0 rest, 1 onset, 2 held
    let stepEls = [];
    let measureEls = [];

    let bpm = 120;
    let volumePct = 100;
    let running = false;
    let tapSoundOn = false;   // play a short blip on each tap
    let countInSpoken = false;   // true = spoken "3 4" count-in; false = two soft clicks

    function barNum(m) { const s = barSig[m]; return s ? s.num : defNum; }
    function barDen(m) { const s = barSig[m]; return s ? s.den : defDen; }
    function barOff(m) { return !!barDisabled[m]; }
    function stepDisabled(i) { return barOff(barOfStep(i)); }
    // subdiv = steps per QUARTER note (the grid resolution), so a step is always
    // a 1/(4*subdiv) note regardless of the time-sig denominator. A bar's beat is
    // a 1/den note, so it spans (4*subdiv)/den steps — e.g. in x/8 a beat (eighth)
    // is 2 steps with subdiv=4, letting you draw eighths + sixteenths, and it
    // clicks twice as often as a quarter beat (BPM counts quarter notes).
    function stepsPerBeat(m) { return Math.max(1, Math.round((4 * subdiv) / barDen(m))); }
    function barSteps(m) { return barNum(m) * stepsPerBeat(m); }
    function barStartSteps() { const a = []; let s = 0; for (let m = 0; m < measures; m++) { a.push(s); s += barSteps(m); } return a; }
    function totalSteps() { let s = 0; for (let m = 0; m < measures; m++) s += barSteps(m); return s; }
    function totalBeats() { let s = 0; for (let m = 0; m < measures; m++) s += barNum(m); return s; }
    function barOfStep(idx) { let s = 0; for (let m = 0; m < measures; m++) { s += barSteps(m); if (idx < s) return m; } return Math.max(0, measures - 1); }
    function stepSec() { return (60 / bpm) / subdiv; }   // step = quarter / subdiv
    function beatSecOf(m) { return stepsPerBeat(m) * stepSec(); }
    function barSecOf(m) { return barSteps(m) * stepSec(); }
    // The "active" sequence is the enabled bars only, concatenated — disabled
    // bars are temporarily skipped from playback, grading, and notation.
    function activeSeq() {
      const seq = [];
      const starts = barStartSteps();
      for (let m = 0; m < measures; m++) {
        if (barOff(m)) continue;
        const sz = barSteps(m);
        for (let k = 0; k < sz; k++) seq.push(starts[m] + k);
      }
      return seq;
    }
    function activeBeats() { let s = 0; for (let m = 0; m < measures; m++) if (!barOff(m)) s += barNum(m); return s; }
    function activeStepCount() { let s = 0; for (let m = 0; m < measures; m++) if (!barOff(m)) s += barSteps(m); return s; }
    function cycleDur() { return activeStepCount() * stepSec(); }

    // ---- Playback scheduler ----
    let scheduleRaf = null;
    let nextStepTime = 0;
    let stepIndex = 0;
    let currentRow = null;        // the live accuracy row for the cycle in progress
    let pendingCycleStarts = [];  // audio-clock times of upcoming cycle downbeats

    // ---- Audio: Web Audio API for low-latency, sample-accurate clicks. ----
    // HTMLAudioElement.play() + setTimeout has large, variable output latency;
    // scheduling AudioBufferSourceNodes on the audio clock is tight and stable.
    let audioCtx = null;
    let clickBuf = null, softBuf = null;
    let clickOffset = 0, softOffset = 0;   // leading silence to skip (seconds)
    let audioLoadPromise = null;
    let startPending = false;
    // Fallback HTMLAudio pools, used only if Web Audio / fetch is unavailable.
    const clickPool = [], softPool = [];
    const POOL_SIZE = 8;
    let clickIdx = 0, softIdx = 0, useFallback = false;

    // Spoken count-in (reuses the metronome's counts_final/ voice clips).
    let countVoice = null;
    let countVoiceLoading = null;
    const countOffsets = {};            // 'count-N' -> lead-in ms (align attack to beat)
    const countNumBuffers = new Map();  // N -> AudioBuffer

    function ensureCountVoice() {
      if (countVoice) return Promise.resolve();
      if (!countVoiceLoading) {
        countVoiceLoading = (async () => {
          try {
            const r = await fetch('counts_final/index.json');
            const data = await r.json();
            countVoice = (data.voices && data.voices[0]) || null;
            if (countVoice) {
              try {
                const or = await fetch(`counts_final/${countVoice}/offsets.json`);
                Object.assign(countOffsets, await or.json());
              } catch (_) {}
            }
          } catch (_) { countVoice = null; }
        })();
      }
      return countVoiceLoading;
    }

    async function ensureCountNum(n) {
      if (!audioCtx || !countVoice || countNumBuffers.has(n)) return;
      try {
        const r = await fetch(`counts_final/${countVoice}/count-${n}.mp3`);
        const buf = await audioCtx.decodeAudioData(await r.arrayBuffer());
        countNumBuffers.set(n, buf);
      } catch (_) {}
    }

    // Schedule a spoken number to land on `beatTime` (audio clock). Returns
    // false if its clip isn't available (so the caller can fall back to a click).
    function playCountNum(beatTime, n) {
      const buf = countNumBuffers.get(n);
      if (!audioCtx || !buf) return false;
      const lead = (countOffsets['count-' + n] || 0) / 1000;
      const src = audioCtx.createBufferSource();
      src.buffer = buf;
      const g = audioCtx.createGain();
      g.gain.value = clamp((volumePct / 100) * COUNT_VOLUME, 0, 1);
      src.connect(g).connect(audioCtx.destination);
      src.start(Math.max(audioCtx.currentTime, beatTime - lead));
      return true;
    }

    function initFallbackPools() {
      if (clickPool.length) return;
      const c = document.getElementById('click-audio');
      const s = document.getElementById('click-soft-audio');
      for (let i = 0; i < POOL_SIZE; i++) {
        const cn = c.cloneNode(); cn.preload = 'auto'; cn.load(); clickPool.push(cn);
        const sn = s.cloneNode(); sn.preload = 'auto'; sn.load(); softPool.push(sn);
      }
    }

    // The mp3s carry a little MP3 encoder leading silence; skip it so the click
    // transient lands exactly on the scheduled beat.
    function leadingSilence(buf) {
      const ch = buf.getChannelData(0);
      for (let i = 0; i < ch.length; i++) {
        if (Math.abs(ch[i]) > 0.01) return Math.max(0, i / buf.sampleRate - 0.0005);
      }
      return 0;
    }

    async function decodeUrl(url) {
      const resp = await fetch(url);
      const arr = await resp.arrayBuffer();
      return await audioCtx.decodeAudioData(arr);
    }

    // Init/resume on a user gesture; resolves once clicks are ready to schedule.
    function ensureAudio() {
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) {
          try { audioCtx = new AC({ latencyHint: 'interactive' }); }
          catch (_) { audioCtx = new AC(); }
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      if (!audioLoadPromise) {
        if (audioCtx) {
          audioLoadPromise = Promise.all([decodeUrl('click.mp3'), decodeUrl('click-soft.mp3')])
            .then(([cb, sb]) => {
              clickBuf = cb; softBuf = sb;
              clickOffset = leadingSilence(cb); softOffset = leadingSilence(sb);
            })
            .catch(() => { useFallback = true; initFallbackPools(); });
        } else {
          useFallback = true; initFallbackPools();
          audioLoadPromise = Promise.resolve();
        }
      }
      return audioLoadPromise;
    }

    // Delay between audioCtx.currentTime and sound reaching the speakers — used
    // to align grading with what the player actually hears.
    function outputLatency() {
      if (!audioCtx) return 0;
      return audioCtx.outputLatency || audioCtx.baseLatency || 0;
    }

    // `sink`, if given, receives the created source node so callers (e.g. row
    // playback) can stop it early.
    function playClick(when, accent, sink) {
      if (audioCtx && !useFallback) {
        const buf = accent ? clickBuf : softBuf;
        if (!buf) return;
        const src = audioCtx.createBufferSource();
        src.buffer = buf;
        const g = audioCtx.createGain();
        g.gain.value = clamp(volumePct / 100, 0, 1);
        src.connect(g).connect(audioCtx.destination);
        src.start(Math.max(when, audioCtx.currentTime), accent ? clickOffset : softOffset);
        if (sink) sink.push(src);
        return;
      }
      // Fallback: HTMLAudio + setTimeout (higher latency, but always plays).
      const delayMs = Math.max(0, (when - nowSec()) * 1000);
      window.setTimeout(() => {
        const pool = accent ? clickPool : softPool;
        if (!pool.length) return;
        const node = pool[accent ? clickIdx : softIdx];
        if (accent) clickIdx = (clickIdx + 1) % pool.length;
        else softIdx = (softIdx + 1) % pool.length;
        node.volume = clamp(volumePct / 100, 0, 1);
        node.currentTime = 0;
        void node.play().catch(() => {});
      }, delayMs);
    }
    // A short synthesized blip on each tap (distinct from the metronome click,
    // and needs no audio asset). Scales with the volume control.
    // `when` lets callers schedule it on the audio clock (used by row playback);
    // omit it for an immediate blip on a live tap.
    function playTapSound(when, sink) {
      ensureAudio();
      if (!audioCtx || useFallback) return;
      const t = Math.max(audioCtx.currentTime, when != null ? when : nowSec());
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      const peak = clamp(volumePct / 100, 0, 1) * 0.1;
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(1100, t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t + 0.004);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
      osc.connect(g).connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + 0.09);
      if (sink) sink.push(osc);
    }

    // Highlight the whole measure currently playing (not the individual step).
    function flashStep(when, idx) {
      const delayMs = Math.max(0, (when - nowSec()) * 1000);
      const m = barOfStep(idx);
      window.setTimeout(() => {
        for (const el of measureEls) el.classList.remove('active');
        const el = measureEls[m];
        if (el && running) el.classList.add('active');
        highlightNotationMeasure(running ? m : -1);
      }, delayMs);
    }

    function scheduleLoop() {
      if (!running) return;
      const lookahead = 0.1;
      const now = nowSec();
      // Play through the enabled bars only (disabled ones are skipped).
      const seq = activeSeq();
      if (seq.length === 0) { scheduleRaf = requestAnimationFrame(scheduleLoop); return; }
      // Click positions and bar downbeats (accented) within the active sequence.
      // Quarter meters click every beat; eighth-denominated meters click on each
      // metric group start (e.g. 6/8 → 3+3, 7/8 → 3+2+2).
      const beatSet = new Set(), downSet = new Set();
      {
        let acc = 0;
        for (let m = 0; m < measures; m++) {
          if (barOff(m)) continue;
          const spb = stepsPerBeat(m);
          downSet.add(acc);
          if (barDen(m) >= 8) {
            let bs = acc;
            for (const g of beatGroups(barNum(m), barDen(m))) { beatSet.add(bs); bs += g * spb; }
          } else {
            for (let b = 0; b < barNum(m); b++) beatSet.add(acc + b * spb);
          }
          acc += barSteps(m);
        }
      }
      while (nextStepTime < now + lookahead) {
        if (stepIndex >= seq.length) stepIndex = 0;   // safety if the sequence shrank
        const gstep = seq[stepIndex];
        // Metronome pulse on each beat, accented on each bar's downbeat.
        if (beatSet.has(stepIndex)) {
          playClick(nextStepTime, downSet.has(stepIndex));
        }
        flashStep(nextStepTime, gstep);
        nextStepTime += stepSec();
        stepIndex += 1;
        // On wrap, nextStepTime is now the next cycle's downbeat — record it as
        // the real cycle boundary for row advancement.
        if (stepIndex >= seq.length) { stepIndex = 0; pendingCycleStarts.push(nextStepTime); }
      }
      ensureCycleRow(now);
      if (practiceTriggered) { practiceTriggered = false; scheduleRaf = null; advanceClip(); return; }
      scheduleRaf = requestAnimationFrame(scheduleLoop);
    }

    // Decide what the count-in says, based on the first enabled bar + tempo:
    //   normal: the last two beats, e.g. 4/4 -> "3 4", 3/4 -> "2 3"
    //   fast 4/4 (>= CUTTIME_BPM): cut-time feel -> "1 2" at the half-note pulse
    function countInPlan() {
      let fe = 0;
      for (let m = 0; m < measures; m++) { if (!barOff(m)) { fe = m; break; } }
      const fnum = barNum(fe), fden = barDen(fe), beat = beatSecOf(fe);
      if (fnum === 4 && fden === 4 && bpm >= CUTTIME_BPM) {
        return { nums: [1, 2], spacing: 2 * beat };
      }
      if (fnum >= 2) return { nums: [fnum - 1, fnum], spacing: beat };
      return { nums: [1], spacing: beat };
    }

    async function startPlay(extraDelay = 0) {
      if (running || startPending) return;
      stopPlayback();   // a play/pause toggle cuts off any row playback
      startPending = true;
      await ensureAudio();          // decode clicks + resume context first
      const plan = countInPlan();
      if (countInSpoken) {
        await ensureCountVoice();
        await Promise.all(plan.nums.map(n => ensureCountNum(n)));
      }
      startPending = false;
      if (running) return;          // toggled off while we were waiting
      running = true;
      document.getElementById('play-btn').classList.add('playing');
      document.getElementById('play-btn').textContent = 'Pause';
      stepIndex = 0;
      pendingCycleStarts = [];
      // Highlight the first bar (grid + notation) through the count-in; flashStep
      // takes over once the first beat plays.
      let firstEnabled = 0;
      for (let m = 0; m < measures; m++) { if (!barOff(m)) { firstEnabled = m; break; } }
      for (const el of measureEls) el.classList.remove('active');
      if (measureEls[firstEnabled]) measureEls[firstEnabled].classList.add('active');
      highlightNotationMeasure(firstEnabled);
      // Extra lead so the first spoken clip (which starts early by its offset)
      // isn't clipped against the context's current time. `extraDelay` adds the
      // shuffle silence before the count-in.
      const startAt = nowSec() + 0.35 + Math.max(0, extraDelay);
      let spoke = countInSpoken;
      if (countInSpoken) {
        for (let i = 0; i < plan.nums.length; i++) {
          if (!playCountNum(startAt + i * plan.spacing, plan.nums[i])) spoke = false;
        }
      }
      if (!spoke) {   // soft-click count-in (or no spoken clips available)
        for (let i = 0; i < plan.nums.length; i++) playClick(startAt + i * plan.spacing, false);
      }
      nextStepTime = startAt + plan.nums.length * plan.spacing;
      currentRow = beginCycleRow(0, nextStepTime, cycleDur());
      scheduleLoop();
    }
    function stopPlay() {
      running = false;
      stopPlayback();   // a play/pause toggle cuts off any row playback
      document.getElementById('play-btn').classList.remove('playing');
      document.getElementById('play-btn').textContent = 'Play';
      if (scheduleRaf != null) { cancelAnimationFrame(scheduleRaf); scheduleRaf = null; }
      for (const el of measureEls) el.classList.remove('active');
      highlightNotationMeasure(-1);
      currentRow = null;
      pendingCycleStarts = [];
      greenStreak = 0;
      practiceTriggered = false;
    }
    function togglePlay() { running ? stopPlay() : startPlay(); }

    function syncTapSoundBtn() {
      document.getElementById('tapsound-btn').classList.toggle('active', tapSoundOn);
    }
    function toggleTapSound() {
      tapSoundOn = !tapSoundOn;
      syncTapSoundBtn();
      try { localStorage.setItem(STORAGE_TAPSOUND, tapSoundOn ? '1' : '0'); } catch (_) {}
      if (tapSoundOn) playTapSound();   // preview the sound when turning it on
    }

    function syncCountInBtn() {
      document.getElementById('countin-btn').classList.toggle('active', countInSpoken);
    }
    function toggleCountIn() {
      countInSpoken = !countInSpoken;
      syncCountInBtn();
      try { localStorage.setItem(STORAGE_COUNTIN, countInSpoken ? '1' : '0'); } catch (_) {}
    }

    // ---- Tapping ----
    function registerTap() {
      if (tapSoundOn) playTapSound();
      if (!running || !currentRow) return;
      const t = nowSec();
      if (t < currentRow.startT) return;   // ignore taps during the count-in
      ensureCycleRow(t);
      gradeTap(t);
    }

    // ---- Scoring + live history rows ----
    // Targets are the note ONSETS (state 1) only. Held/rest steps aren't graded:
    // we judge whether you struck each new note at the right moment, not how
    // long you held it.
    // Onsets as fractions of the ACTIVE cycle (enabled bars only).
    function targetFracs() {
      const seq = activeSeq();
      const fracs = [];
      for (let j = 0; j < seq.length; j++) if (pattern[seq[j]] === 1) fracs.push(j / seq.length);
      return fracs;
    }
    // Smallest circular gap between consecutive targets — defines "far off".
    function tightestGap(fracs) {
      if (fracs.length < 2) return 1;
      let min = 1;
      for (let i = 0; i < fracs.length; i++) {
        const a = fracs[i];
        const b = fracs[(i + 1) % fracs.length];
        let d = (b - a + 1) % 1;
        if (d > 0 && d < min) min = d;
      }
      return min;
    }

    // Beat onsets of the active cycle as fractions, flagged accented on each
    // bar's downbeat — mirrors the click placement in scheduleLoop so a row can
    // be replayed with the same metronome feel it was recorded against.
    function cycleBeatFracs() {
      const seqLen = activeStepCount();
      if (!seqLen) return [];
      const beats = [];
      let acc = 0;
      for (let m = 0; m < measures; m++) {
        if (barOff(m)) continue;
        const spb = stepsPerBeat(m);
        beats.push({ step: acc, accent: true });   // downbeat
        if (barDen(m) >= 8) {
          let bs = acc;
          const groups = beatGroups(barNum(m), barDen(m));
          for (let gi = 0; gi < groups.length; gi++) {
            if (gi > 0) beats.push({ step: bs, accent: false });
            bs += groups[gi] * spb;
          }
        } else {
          for (let b = 1; b < barNum(m); b++) beats.push({ step: acc + b * spb, accent: false });
        }
        acc += barSteps(m);
      }
      return beats.map(b => ({ frac: b.step / seqLen, accent: b.accent }));
    }

    // Source nodes from the in-flight row playback, so it can be cut short.
    let playbackNodes = [];
    function stopPlayback() {
      for (const n of playbackNodes) {
        try { n.stop(); } catch (_) {}
        try { n.disconnect(); } catch (_) {}
      }
      playbackNodes = [];
    }

    // Replay one history row: the cycle's metronome clicks plus the taps the
    // user actually made, at their recorded positions. No count-in.
    function playbackRow(r) {
      ensureAudio().then(() => {
        if (!audioCtx || useFallback) return;
        stopPlayback();   // only one playback at a time
        const t0 = audioCtx.currentTime + 0.15;
        for (const b of (r.beats || [])) playClick(t0 + b.frac * r.dur, b.accent, playbackNodes);
        for (const f of r.tapFracs) playTapSound(t0 + f * r.dur, playbackNodes);
      });
    }

    // Spawn a fresh row for cycle `cIdx`, drawing the target ticks up front so
    // taps can be graded and shown against them in real time.
    function beginCycleRow(cIdx, startT, dur) {
      // Onsets and their fractions within the ACTIVE cycle (enabled bars only).
      const seq = activeSeq();
      const fracs = [], onsetSteps = [];
      for (let j = 0; j < seq.length; j++) if (pattern[seq[j]] === 1) { fracs.push(j / seq.length); onsetSteps.push(seq[j]); }
      const gap = fracs.length ? tightestGap(fracs) : 1 / Math.max(1, seq.length);
      const maxErrSec = Math.max(0.04, gap * dur * 0.5);

      const row = document.createElement('div');
      row.className = 'hist-row';
      const playBtn = document.createElement('button');
      playBtn.className = 'hist-play';
      playBtn.type = 'button';
      playBtn.title = 'Play this back';
      playBtn.setAttribute('aria-label', 'Play this back');
      playBtn.textContent = '▶';   // ▶
      const track = document.createElement('div');
      track.className = 'hist-track';
      track.style.width = lastStaffWidth + 'px';
      // Targets sit exactly on their noteheads' measured x.
      for (let k = 0; k < onsetSteps.length; k++) {
        const tk = document.createElement('div');
        tk.className = 'hist-target';
        const xf = onsetXFrac[onsetSteps[k]];
        tk.style.left = (100 * (xf != null ? xf : fracs[k])) + '%';
        track.appendChild(tk);
      }
      row.appendChild(track);
      row.appendChild(playBtn);
      const hist = document.getElementById('history');
      hist.insertBefore(row, hist.firstChild);
      while (hist.children.length > MAX_HISTORY_ROWS) hist.removeChild(hist.lastChild);

      const r = { cIdx, startT, dur, fracs, onsetSteps, onsetBest: onsetSteps.map(() => Infinity), tapFracs: [], maxErrSec, taps: 0, errSum: 0, el: row, track, beats: cycleBeatFracs() };
      // Stop pointerdown too: the #history container turns pointerdown into a
      // tap, which would otherwise fire when you press the button.
      playBtn.addEventListener('pointerdown', (e) => e.stopPropagation());
      playBtn.addEventListener('click', (e) => { e.stopPropagation(); playbackRow(r); });

      // Start the cycle with every note greyed (= not played yet); taps light
      // them up live as they land.
      onsetColors = {};
      for (const s of onsetSteps) onsetColors[s] = MISS_GREY;
      colorNotation();
      return r;
    }

    // Advance rows at the scheduler's ACTUAL cycle boundaries (queued by
    // scheduleLoop). Anchoring to real downbeat times keeps grading in sync even
    // when the tempo changes — a fixed duration snapshot would drift.
    function ensureCycleRow(now) {
      if (!currentRow) return;
      let guard = 0;
      while (pendingCycleStarts.length && now >= pendingCycleStarts[0] && guard++ < 64) {
        const startT = pendingCycleStarts.shift();
        // Shuffle: track consecutive green cycles; on the 2nd, hand off to the
        // shuffler (leave the finished row in place and let scheduleLoop switch).
        if (practiceMode) {
          greenStreak = isGreenCycle(currentRow) ? greenStreak + 1 : 0;
          if (greenStreak >= 2 && loadSaves().items.length > 0) { practiceTriggered = true; return; }
        }
        currentRow = beginCycleRow(currentRow.cIdx + 1, startT, cycleDur());
      }
    }

    // Grade one tap against the current row immediately (live feedback).
    function gradeTap(t) {
      const r = currentRow;
      if (!r) return;
      // Compensate for output latency: the click was heard a bit after it was
      // scheduled, so shift the tap back by that amount before judging it.
      let frac = ((t - outputLatency()) - r.startT) / r.dur;
      frac = ((frac % 1) + 1) % 1;
      r.tapFracs.push(frac);
      let best = 1, bestOi = -1;
      for (let oi = 0; oi < r.fracs.length; oi++) {
        const raw = Math.abs(frac - r.fracs[oi]);
        const circ = Math.min(raw, 1 - raw);
        if (circ < best) { best = circ; bestOi = oi; }
      }
      const errSec = best * r.dur;
      r.errSum += errSec;
      r.taps += 1;
      // Live-color the nearest note if this tap landed within its window and is
      // the closest tap to it so far this cycle. Misses stay grey.
      if (bestOi >= 0 && errSec <= r.maxErrSec && errSec < r.onsetBest[bestOi]) {
        r.onsetBest[bestOi] = errSec;
        const nn = Math.pow(clamp(errSec / r.maxErrSec, 0, 1), 0.7);
        onsetColors[r.onsetSteps[bestOi]] = `hsl(${120 * (1 - nn)}, 75%, 50%)`;
        colorNotation();
      }
      // Curve with exponent < 1 shifts small errors toward yellow sooner than
      // linear (0.7 splits the difference — firm, but not punishing).
      const norm = Math.pow(clamp(errSec / r.maxErrSec, 0, 1), 0.7);
      const hue = 120 * (1 - norm);   // 120 green -> 0 red
      const dot = document.createElement('div');
      dot.className = 'hist-tap';
      dot.style.left = (100 * timeToX(frac)) + '%';
      dot.style.background = `hsl(${hue}, 75%, 50%)`;
      dot.style.color = `hsl(${hue}, 75%, 50%)`;
      r.track.appendChild(dot);
    }

    // ---- Step model: 0 = rest, 1 = note onset, 2 = held (sustain) ----
    // An eighth note is (4*subdiv)/8 = subdiv/2 steps, regardless of meter.
    function defaultNoteSteps() { return Math.max(1, Math.round(subdiv / 2)); }

    // A held step is only meaningful if preceded by a note/held; otherwise it's
    // an orphan and we treat it as a rest.
    function normalizeSteps() {
      for (let i = 0; i < pattern.length; i++) {
        if (pattern[i] === 2 && (i === 0 || pattern[i - 1] === 0)) pattern[i] = 0;
      }
    }

    // Make [start, start+len) one note: onset at start, held after, and trim any
    // held tail that used to belong to this note beyond the new end.
    function setNoteSpan(start, len) {
      const T = totalSteps();
      const end = Math.min(T, start + Math.max(1, len));
      pattern[start] = 1;
      for (let k = start + 1; k < end; k++) pattern[k] = 2;
      for (let k = end; k < T && pattern[k] === 2; k++) pattern[k] = 0;
    }

    function deleteNoteAt(start) {
      const T = totalSteps();
      pattern[start] = 0;
      for (let k = start + 1; k < T && pattern[k] === 2; k++) pattern[k] = 0;
    }

    // ---- Step grid rendering ----
    function stepClass(idx) {
      return 'step'
        + (pattern[idx] === 1 ? ' on' : '')
        + (pattern[idx] === 2 ? ' held' : '');
    }

    // Nested layout: measure -> beats -> cells, so each level can carry its own
    // even spacing and its own label. Each measure header has a per-bar time
    // signature that overrides the default when changed.
    function buildGrid() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      stepEls = [];
      measureEls = [];
      const starts = barStartSteps();
      for (let m = 0; m < measures; m++) {
        const bn = barNum(m), bd = barDen(m), start = starts[m];
        const mEl = document.createElement('div');
        mEl.className = 'measure' + (barOff(m) ? ' disabled' : '');
        measureEls[m] = mEl;
        mEl.appendChild(buildMeasureHeader(m, bn, bd));

        const spb = stepsPerBeat(m);
        const beatsEl = document.createElement('div');
        beatsEl.className = 'beats';
        for (let bt = 0; bt < bn; bt++) {
          const beatEl = document.createElement('div');
          beatEl.className = 'beat' + (bt === 0 ? ' downbeat' : '');
          const cellsEl = document.createElement('div');
          cellsEl.className = 'cells';
          for (let sub = 0; sub < spb; sub++) {
            const idx = start + bt * spb + sub;
            const cell = document.createElement('div');
            cell.className = stepClass(idx);
            cell.dataset.idx = idx;
            cellsEl.appendChild(cell);
            stepEls[idx] = cell;
          }
          beatEl.appendChild(cellsEl);
          beatsEl.appendChild(beatEl);
        }
        mEl.appendChild(beatsEl);
        grid.appendChild(mEl);
      }
    }

    // Per-bar time-signature editor: "M{n}  [num]/[den]  (↺ if overridden)".
    function buildMeasureHeader(m, bn, bd) {
      const head = document.createElement('div');
      head.className = 'measure-head';

      const tag = document.createElement('span');
      tag.className = 'measure-num';
      tag.textContent = 'M' + (m + 1);
      head.appendChild(tag);

      const sig = document.createElement('span');
      sig.className = 'bar-sig' + (barSig[m] ? ' overridden' : '');

      const ni = document.createElement('input');
      ni.type = 'number'; ni.min = 1; ni.max = 16; ni.value = bn;
      ni.className = 'bar-num-input';
      ni.addEventListener('change', () => setBarSig(m, parseInt(ni.value, 10), bd));

      const slash = document.createElement('span');
      slash.className = 'bar-slash'; slash.textContent = '/';

      const ds = document.createElement('select');
      ds.className = 'bar-den-select';
      for (const d of [2, 4, 8, 16]) {
        const o = document.createElement('option');
        o.value = d; o.textContent = d; if (d === bd) o.selected = true;
        ds.appendChild(o);
      }
      ds.addEventListener('change', () => setBarSig(m, bn, parseInt(ds.value, 10)));

      sig.append(ni, slash, ds);
      if (barSig[m]) {
        const rs = document.createElement('button');
        rs.type = 'button'; rs.className = 'bar-reset'; rs.textContent = '↺';
        rs.title = 'Use default time signature';
        rs.addEventListener('click', () => clearBarSig(m));
        sig.appendChild(rs);
      }
      head.appendChild(sig);

      // Enable/disable toggle (a small LED dot): a disabled bar stays in the
      // loop and keeps clicking, but it isn't graded and shows dimmed.
      const tg = document.createElement('button');
      tg.type = 'button';
      tg.className = 'bar-toggle' + (barOff(m) ? ' off' : '');
      tg.textContent = barOff(m) ? '○' : '●';
      tg.title = barOff(m) ? 'Enable this measure' : 'Disable this measure';
      tg.addEventListener('click', () => toggleMeasureDisabled(m));
      head.appendChild(tg);
      return head;
    }

    // Toggle a bar's disabled state. Takes effect on the next cycle for grading;
    // the grid/notation update immediately. Playback keeps running.
    function toggleMeasureDisabled(m) {
      if (!barOff(m)) {
        // About to disable — keep at least one bar enabled.
        let enabled = 0;
        for (let i = 0; i < measures; i++) if (!barOff(i)) enabled++;
        if (enabled <= 1) return;
      }
      barDisabled[m] = !barOff(m);
      buildGrid();
      buildNotation();
      persistSettings();
      scheduleUrlSync();
    }

    // Cheap class refresh during a drag (cells already exist).
    function refreshGrid() {
      for (let i = 0; i < stepEls.length; i++) {
        const el = stepEls[i];
        if (!el) continue;
        el.classList.toggle('on', pattern[i] === 1);
        el.classList.toggle('held', pattern[i] === 2);
      }
    }

    // ---- Step editing interactions ----
    //   click empty step -> new note of the default length (an eighth)
    //   click a note onset -> delete the note
    //   click a held step  -> split there (it becomes a new onset)
    //   drag from a step    -> set the note's length to the dragged span
    let gridDrag = { active: false, anchor: 0, moved: false, downState: 0 };

    function stepIdxFromPoint(x, y) {
      const el = document.elementFromPoint(x, y);
      const cell = el && el.closest ? el.closest('.step') : null;
      if (!cell) return -1;
      const idx = parseInt(cell.dataset.idx, 10);
      return Number.isInteger(idx) ? idx : -1;
    }

    function onGridDown(e) {
      const idx = stepIdxFromPoint(e.clientX, e.clientY);
      if (idx < 0) return;
      e.preventDefault();
      gridDrag = { active: true, anchor: idx, moved: false, downState: pattern[idx] };
      if (pattern[idx] !== 1) setNoteSpan(idx, 1);   // rest/held -> onset
      refreshGrid();
      buildNotation();
    }
    function onGridMove(e) {
      if (!gridDrag.active) return;
      const idx = stepIdxFromPoint(e.clientX, e.clientY);
      if (idx < 0 || idx < gridDrag.anchor) return;
      if (idx !== gridDrag.anchor) gridDrag.moved = true;
      setNoteSpan(gridDrag.anchor, idx - gridDrag.anchor + 1);
      refreshGrid();
      buildNotation();
    }
    function onGridUp() {
      if (!gridDrag.active) return;
      gridDrag.active = false;
      if (!gridDrag.moved) {
        if (gridDrag.downState === 1) {
          deleteNoteAt(gridDrag.anchor);
        } else if (gridDrag.downState === 0) {
          // Place a default-length note, but never clobber a following note —
          // if one starts sooner, shorten this note to butt up against it
          // (e.g. a sixteenth right before the next onset).
          const T = totalSteps();
          let len = defaultNoteSteps();
          for (let k = gridDrag.anchor + 1; k < gridDrag.anchor + len && k < T; k++) {
            if (pattern[k] === 1) { len = k - gridDrag.anchor; break; }
          }
          setNoteSpan(gridDrag.anchor, len);
        }
        // held -> already turned into a length-1 onset (the split)
      }
      normalizeSteps();
      refreshGrid();
      buildNotation();
      persistPattern();
    }

    function fillPattern(on) {
      pattern = new Array(totalSteps()).fill(on ? 1 : 0);
      normalizeSteps();
      buildGrid();
      buildNotation();
      persistPattern();
      scheduleUrlSync();
    }

    // Recompute the flat pattern to match the current bar structure, preserving
    // each retained bar's overlapping steps (per-bar, so resizing or overriding
    // one bar leaves the others intact).
    function reshape(oldSizes, oldStarts) {
      const newSizes = [], newStarts = [];
      { let s = 0; for (let m = 0; m < measures; m++) { newStarts.push(s); const sz = barSteps(m); newSizes.push(sz); s += sz; } }
      const T = newSizes.reduce((a, b) => a + b, 0);
      const np = new Array(T).fill(0);
      for (let m = 0; m < newSizes.length && m < oldSizes.length; m++) {
        const c = Math.min(oldSizes[m], newSizes[m]);
        for (let k = 0; k < c; k++) np[newStarts[m] + k] = pattern[oldStarts[m] + k] || 0;
      }
      pattern = np;
      normalizeSteps();
    }

    function syncControls() {
      document.getElementById('num-input').value = defNum;
      document.getElementById('den-select').value = String(defDen);
      document.getElementById('measures-input').value = 'x' + measures;
      document.getElementById('subdiv-select').value = String(subdiv);
    }

    // Apply a structural mutation (default sig / measures / subdivision / a bar
    // override) while keeping the bar-aligned pattern as intact as possible.
    function applyStructureChange(mutate) {
      if (running) stopPlay();
      const oldSizes = [], oldStarts = [];
      { let s = 0; for (let m = 0; m < measures; m++) { oldStarts.push(s); const sz = barSteps(m); oldSizes.push(sz); s += sz; } }
      mutate();
      barSig.length = measures;
      barDisabled.length = measures;
      for (let m = 0; m < measures; m++) {
        if (barSig[m] === undefined) barSig[m] = null;
        if (barDisabled[m] === undefined) barDisabled[m] = false;
      }
      reshape(oldSizes, oldStarts);
      syncControls();
      buildGrid();
      buildNotation();
      persistSettings();
      persistPattern();
      scheduleUrlSync();
    }

    function setBarSig(m, n, d) {
      applyStructureChange(() => {
        barSig[m] = {
          num: clamp(parseInt(n, 10) || barNum(m), 1, 16),
          den: [2, 4, 8, 16].includes(d) ? d : defDen,
        };
      });
    }
    function clearBarSig(m) {
      applyStructureChange(() => { barSig[m] = null; });
    }

    // ---- Music notation (engraved by abcjs) ----
    // Convert the step model into an ABC tune string and let abcjs draw it
    // (beaming, ties, dotted notes, rests, time signature). Pitch is irrelevant
    // for rhythm, so every note sits on the same line with the clef hidden.

    // For accuracy coloring: the onset step each rendered notehead belongs to
    // (in document order), and the color to paint each onset's notes.
    let lastNoteheadOnsets = [];
    let onsetXFrac = {};   // onset step -> notehead x as a fraction of staff width
    let onsetColors = {};
    const MISS_GREY = '#5a5a5a';   // note you didn't play near
    const DISABLED_GREY = '#3f3f3f';   // note in a disabled measure
    let lastStaffWidth = 280;      // notation width; history tracks match it
    // Per-measure boxes (px, relative to #notation-wrap), keyed by global measure
    // index (enabled measures only), + the HTML overlay we move to highlight one.
    let measureSpans = {};
    let measureHlEl = null;

    // Group the step model into note/rest events:
    //   note event = an onset (1) plus its trailing held (2) steps
    //   rest event = a maximal run of non-onset steps
    function parseEvents() {
      const T = totalSteps();
      const evs = [];
      let i = 0;
      while (i < T) {
        if (pattern[i] === 1) {
          let len = 1;
          while (i + len < T && pattern[i + len] === 2) len++;
          evs.push({ note: true, start: i, len });
          i += len;
        } else {
          let len = 1;
          while (i + len < T && pattern[i + len] !== 1) len++;
          evs.push({ note: false, start: i, len });
          i += len;
        }
      }
      return evs;
    }

    // Break a step-length into clean note values (each a power of two, or a
    // dotted value), largest first, so every ABC token maps to one notehead.
    function abcDurTokens(stepsLen) {
      const out = [];
      let L = stepsLen, guard = 0;
      while (L > 0 && guard++ < 64) {
        let p = 1;
        while (p * 2 <= L) p *= 2;
        if (p >= 2 && L >= p + p / 2) { out.push(p + p / 2); L -= p + p / 2; }  // dotted
        else { out.push(p); L -= p; }
      }
      return out;
    }

    // Beat groupings per meter (group sizes in beats): 4/4 -> [2,2] (strong
    // mid-bar), 6/8 -> [3,3] (compound), 7/8 -> [2,2,3], 3/4 -> [1,1,1], etc.
    function beatGroups(bn, den) {
      if (den >= 8) {
        if (bn % 3 === 0) return Array(bn / 3).fill(3);
        // Irregular (5/8, 7/8, …): lead with a group of 3 eighths so a dotted
        // quarter is one note at the start of the bar, then groups of 2.
        const out = []; let r = bn;
        if (r % 2 === 1) { out.push(3); r -= 3; }
        while (r > 0) { out.push(2); r -= 2; }
        return out;
      }
      if (bn === 4) return [2, 2];
      if (bn === 6) return [3, 3];
      if (bn % 2 === 0 && bn > 4) return [bn / 2, bn / 2];
      return Array(bn).fill(1);
    }

    // Recursively split [a,b) within a metric node spanning `beats` beats
    // (compound = a ternary group). A note is one notehead if it fills a node,
    // or is a dotted value (node + half its sibling); otherwise it's split at
    // the strongest boundary it crosses (the caller ties the pieces).
    function metricPieces(a, b, lo, hi, beats, compound) {
      if (b <= a) return [];
      if (a === lo && b === hi) return [[a, b]];
      let kids;
      if (compound) {
        kids = []; const w = (hi - lo) / beats;
        for (let i = 0; i < beats; i++) kids.push([lo + i * w, lo + (i + 1) * w, 1, false]);
      } else if (beats >= 2) {
        if (beats % 2 === 0) { const h = (lo + hi) / 2; kids = [[lo, h, beats / 2, false], [h, hi, beats / 2, false]]; }
        else { kids = []; const w = (hi - lo) / beats; for (let i = 0; i < beats; i++) kids.push([lo + i * w, lo + (i + 1) * w, 1, false]); }
      } else {
        if (hi - lo <= 1) return [[a, b]];
        const h = (lo + hi) / 2; kids = [[lo, h, 1, false], [h, hi, 1, false]];
      }
      for (const [cl, ch, cb, cc] of kids) if (a >= cl && b <= ch) return metricPieces(a, b, cl, ch, cb, cc);
      // Dotted-note exceptions across one child boundary:
      //   forward  (any level): child start .. midpoint of next child  (dotted on the beat)
      //   backward (within a beat only): midpoint of a child .. end of next child
      //     (e.g. a sixteenth + dotted-eighth inside a 4/4 beat)
      if (!compound) {
        const subBeat = beats < 2;
        for (let i = 0; i + 1 < kids.length; i++) {
          const cl = kids[i][0], ch = kids[i][1], nl = kids[i + 1][0], nh = kids[i + 1][1];
          if (a === cl && b === (nl + nh) / 2) return [[a, b]];
          if (subBeat && a === (cl + ch) / 2 && b === nh) return [[a, b]];
        }
      }
      let res = [];
      for (const [cl, ch, cb, cc] of kids) { const s = Math.max(a, cl), e = Math.min(b, ch); if (e > s) res = res.concat(metricPieces(s, e, cl, ch, cb, cc)); }
      return res;
    }

    // Split a note/rest [a,b) (bar-local steps) into single-notehead pieces by
    // the bar's metric tree.
    function splitInBar(a, b, bn, den, spb) {
      const groups = beatGroups(bn, den);
      const kids = []; let p = 0;
      for (const g of groups) { kids.push([p * spb, (p + g) * spb, g, (den >= 8 && g === 3)]); p += g; }
      const barHi = bn * spb;
      if (a === 0 && b === barHi) return [[a, b]];
      for (const [cl, ch, cb, cc] of kids) if (a >= cl && b <= ch) return metricPieces(a, b, cl, ch, cb, cc);
      let res = [];
      for (const [cl, ch, cb, cc] of kids) { const s = Math.max(a, cl), e = Math.min(b, ch); if (e > s) res = res.concat(metricPieces(s, e, cl, ch, cb, cc)); }
      return res;
    }

    function buildAbc() {
      const starts = barStartSteps();
      const startSet = new Set(starts);
      // One global default note length covers every bar; finer denominators just
      // use larger multiples of it. L = 1/(maxDen * subdiv). Disabled bars are
      // omitted from the notation, so only enabled bars affect maxDen.
      let firstEnabled = 0;
      for (let m = 0; m < measures; m++) { if (!barOff(m)) { firstEnabled = m; break; } }
      // Every step is a 1/(4*subdiv) note regardless of meter, so one default
      // note length covers all bars and each step is exactly one L-unit; the
      // denominator only changes how many steps a beat spans.
      const Lden = 4 * subdiv;
      const PITCH = 'B';   // B4 — the middle line of the treble staff

      // Flatten into atoms following standard metric notation: a note is one
      // notehead only if it spans a node of the bar's metric tree (or a dotted
      // node); otherwise it's split at the strongest boundary it crosses and the
      // pieces are tied. Notes never cross a barline.
      const atoms = [];
      for (const ev of parseEvents()) {
        const evAtoms = [];
        let pos = ev.start, rem = ev.len;
        while (rem > 0) {
          const bm = barOfStep(pos), barLo = starts[bm], barHi = barLo + barSteps(bm);
          const take = Math.min(rem, barHi - pos);
          for (const [s, e] of splitInBar(pos - barLo, pos - barLo + take, barNum(bm), barDen(bm), stepsPerBeat(bm))) {
            let p = barLo + s;
            for (const st of abcDurTokens(e - s)) {
              evAtoms.push({ note: ev.note, pos: p, units: st, tie: false, onset: ev.start });
              p += st;
            }
          }
          pos += take; rem -= take;
        }
        if (ev.note) for (let k = 0; k + 1 < evAtoms.length; k++) evAtoms[k].tie = true;
        for (const a of evAtoms) atoms.push(a);
      }

      let body = '';
      let prevBar = -1;          // bar of the previous EMITTED atom
      const noteOnsets = [];     // onset step per emitted notehead (render order)
      for (let ai = 0; ai < atoms.length; ai++) {
        const a = atoms[ai];
        const m = barOfStep(a.pos);
        if (barOff(m)) continue;   // disabled bar: omit from the notation entirely
        const isBarStart = startSet.has(a.pos);
        // Barline + (only-if-changed) meter whenever we enter a new emitted bar.
        if (prevBar !== -1 && m !== prevBar) {
          body += ' |';
          if (barNum(m) !== barNum(prevBar) || barDen(m) !== barDen(prevBar)) {
            body += `[M:${barNum(m)}/${barDen(m)}]`;
          }
        }
        // Break beams at beat boundaries with a space — except a bar's downbeat,
        // which the barline already separates.
        const lbm = barOfStep(a.pos);
        const isBeatStart = ((a.pos - starts[lbm]) % stepsPerBeat(lbm)) === 0;
        if (isBeatStart && !isBarStart) body += ' ';
        // A tie only survives if the next atom is also emitted (same event, and
        // not in a disabled bar).
        const next = atoms[ai + 1];
        const tie = a.tie && next && !barOff(barOfStep(next.pos));
        body += (a.note ? PITCH : 'z') + (a.units === 1 ? '' : a.units) + (tie ? '-' : '');
        if (a.note) noteOnsets.push(a.onset);
        prevBar = m;
      }
      body += ' |]';

      lastNoteheadOnsets = noteOnsets;
      return `X:1\nM:${barNum(firstEnabled)}/${barDen(firstEnabled)}\nL:1/${Lden}\nK:C clef=none\n${body}\n`;
    }

    function buildNotation() {
      if (!window.ABCJS) return;
      const el = document.getElementById('notation');
      const contW = el.clientWidth || (el.parentElement && el.parentElement.clientWidth) || 700;
      const abc = buildAbc();
      // Size the staff to its content so short patterns stay compact and get
      // centered (flex) rather than stretched edge-to-edge; long ones fill /
      // wrap. Each note/rest token is one 'B' or 'z' in the body.
      const glyphs = (abc.match(/[Bz]/g) || []).length;
      const want = 96 + glyphs * 34;
      const w = clamp(want, 200, Math.max(220, contW - 6));
      lastStaffWidth = w;   // history tracks size themselves to match the staff
      onsetColors = {};   // re-rendering (edit/resize) clears any accuracy tint
      // Explicit staffwidth (+ a single resize listener) instead of abcjs's
      // 'responsive' mode, so re-rendering on every drag move stays cheap.
      ABCJS.renderAbc('notation', abc, {
        add_classes: true,
        staffwidth: w,
        paddingtop: 6, paddingbottom: 6, paddingleft: 0, paddingright: 0,
      });
      colorNotation();
      measureNoteX();
      computeMeasureSpans();
    }

    // Measure the staff's barlines so we can highlight whichever measure is
    // playing. abcjs has no per-measure container, so each enabled measure spans
    // from the previous barline (or the staff's left edge) to its own barline.
    // We work in screen pixels (getBoundingClientRect) relative to #notation-wrap,
    // because the highlight is an HTML overlay there — drawing it inside the svg
    // gets clipped by the svg viewport no matter what overflow we set.
    function computeMeasureSpans() {
      measureSpans = {};
      const wrap = document.getElementById('notation-wrap');
      const svg = document.querySelector('#notation svg');
      if (!wrap || !svg) { highlightNotationMeasure(-1); return; }
      ensureMeasureHl(wrap);
      const staff = svg.querySelector('.abcjs-staff');
      const bars = Array.from(svg.querySelectorAll('.abcjs-bar'));
      if (!staff || !bars.length) { highlightNotationMeasure(-1); return; }
      const wr = wrap.getBoundingClientRect();
      const stf = staff.getBoundingClientRect();
      // Vertical span hugs the staff + every note (so stems and flags are
      // included), but the above/below-staff overhang is symmetric: stems all
      // point one way, so otherwise the highlight looks lopsided.
      let cTop = stf.top, cBot = stf.bottom;
      for (const n of svg.querySelectorAll('.abcjs-note')) {
        const r = n.getBoundingClientRect();
        if (r.height <= 0) continue;
        if (r.top < cTop) cTop = r.top;
        if (r.bottom > cBot) cBot = r.bottom;
      }
      const overhang = Math.max(stf.top - cTop, cBot - stf.bottom, 0);
      cTop = stf.top - overhang;
      cBot = stf.bottom + overhang;
      // Barline center x's (screen px), sorted and deduped (a final |] is 2 lines).
      const xs = bars.map(b => { const r = b.getBoundingClientRect(); return r.left + r.width / 2; }).sort((a, b) => a - b);
      const bnd = [];
      for (const x of xs) if (!bnd.length || x - bnd[bnd.length - 1] > 6) bnd.push(x);
      const enabled = [];
      for (let m = 0; m < measures; m++) if (!barOff(m)) enabled.push(m);
      // Pad past the bounds exactly like the grid's .measure (padding: 8px),
      // so the highlight spills equally on x and y, matching the steps.
      const padX = 8, padY = 8;
      const top = (cTop - wr.top) - padY, height = (cBot - cTop) + 2 * padY;
      for (let j = 0; j < enabled.length && j < bnd.length; j++) {
        const left = (j === 0 ? stf.left : bnd[j - 1]) - padX;
        const right = bnd[j] + padX;
        measureSpans[enabled[j]] = { left: left - wr.left, top, width: Math.max(2, right - left), height };
      }
    }

    // The overlay div lives in #notation-wrap (which abcjs never clears), so we
    // create it once and reuse it across re-renders.
    function ensureMeasureHl(wrap) {
      if (measureHlEl && measureHlEl.parentElement === wrap) return;
      measureHlEl = document.createElement('div');
      measureHlEl.className = 'measure-hl';
      wrap.insertBefore(measureHlEl, wrap.firstChild);
    }

    // Show the highlight over global measure m (or hide it when m < 0 / unknown).
    function highlightNotationMeasure(m) {
      if (!measureHlEl) return;
      const s = measureSpans[m];
      if (m < 0 || !s) { measureHlEl.style.display = 'none'; return; }
      measureHlEl.style.left = s.left + 'px';
      measureHlEl.style.top = s.top + 'px';
      measureHlEl.style.width = s.width + 'px';
      measureHlEl.style.height = s.height + 'px';
      measureHlEl.style.display = 'block';
    }

    // Record each onset's notehead x as a fraction of the staff width, so the
    // history track can line its targets/taps up with the engraved notes (abcjs
    // spaces notes non-linearly, not by time).
    // x-center of a note's stem (a tall, thin path); falls back to the whole
    // note's center for stemless notes (e.g. whole notes).
    function noteStemX(noteEl) {
      const paths = noteEl.tagName.toLowerCase() === 'path' ? [noteEl] : noteEl.querySelectorAll('path');
      let stem = null;
      for (const p of paths) {
        const b = p.getBoundingClientRect();
        if (b.height > b.width * 2.5 && b.height > 12 && (!stem || b.height > stem.height)) stem = b;
      }
      const ref = stem || noteEl.getBoundingClientRect();
      return (ref.left + ref.right) / 2;
    }
    function measureNoteX() {
      onsetXFrac = {};
      const svg = document.querySelector('#notation svg');
      if (!svg) return;
      const notes = svg.querySelectorAll('.abcjs-note');
      if (notes.length !== lastNoteheadOnsets.length) return;
      const sr = svg.getBoundingClientRect();
      if (sr.width <= 0) return;
      for (let k = 0; k < notes.length; k++) {
        const onset = lastNoteheadOnsets[k];
        if (onset in onsetXFrac) continue;   // first (attack) notehead wins
        onsetXFrac[onset] = (noteStemX(notes[k]) - sr.left) / sr.width;
      }
    }

    // Map a cycle time-fraction to an x-fraction on the staff, piecewise-linear
    // through the onset (time -> notehead-x) anchor points. Identity fallback.
    function timeToX(frac) {
      const seq = activeSeq(); const N = seq.length;
      if (!N) return frac;
      const A = [];
      for (let j = 0; j < N; j++) if (pattern[seq[j]] === 1 && onsetXFrac[seq[j]] != null) A.push([j / N, onsetXFrac[seq[j]]]);
      if (!A.length) return frac;
      // Anchor the measure boundaries to the track edges (rests are engraved, so
      // the staff spans the whole measure). Without this, taps landing before the
      // first note or after the last clamp flat onto that notehead instead of
      // spreading across the leading/trailing rest into the full measure width.
      if (A[0][0] > 0) A.unshift([0, 0]);
      if (A[A.length - 1][0] < 1) A.push([1, 1]);
      for (let i = 0; i + 1 < A.length; i++) {
        if (frac >= A[i][0] && frac <= A[i + 1][0]) {
          const [t0, x0] = A[i], [t1, x1] = A[i + 1];
          return t1 > t0 ? x0 + (x1 - x0) * (frac - t0) / (t1 - t0) : x0;
        }
      }
      return frac;
    }

    // Paint each notehead by the last graded cycle (or default when uncolored).
    function colorNotation() {
      const svg = document.querySelector('#notation svg');
      if (!svg) return;
      const notes = svg.querySelectorAll('.abcjs-note');
      if (notes.length !== lastNoteheadOnsets.length) return;   // mapping mismatch: skip
      notes.forEach((noteEl, k) => {
        const onset = lastNoteheadOnsets[k];
