        // Notes in a disabled bar render dimmed unless they got a live color.
        let color = onsetColors[onset] || '';
        if (!color && stepDisabled(onset)) color = DISABLED_GREY;
        const paths = noteEl.tagName.toLowerCase() === 'path' ? [noteEl] : noteEl.querySelectorAll('path');
        paths.forEach(p => { p.style.fill = color; });
      });
    }


    // ---- BPM / Volume vertical strips ----
    const bpmSection = document.getElementById('bpm-section');
    const volumeSection = document.getElementById('volume-section');
    const bpmFill = document.getElementById('bpm-fill');
    const volumeFill = document.getElementById('volume-fill');
    const bpmReadout = document.getElementById('bpm-readout');
    const volumeReadout = document.getElementById('volume-readout');
    let dragTarget = null;

    function setBpm(next) {
      bpm = clamp(next, BPM_MIN, BPM_MAX);
      bpmReadout.textContent = `${Math.round(bpm)}`;
      const frac = (bpm - BPM_MIN) / (BPM_MAX - BPM_MIN);
      bpmFill.style.height = `${clamp(frac, 0, 1) * 100}%`;
    }
    function setVolumePct(next) {
      volumePct = clamp(next, 0, 100);
      volumeReadout.textContent = `${Math.round(volumePct)}`;
      volumeFill.style.height = `${volumePct}%`;
    }
    function bpmFromY(clientY) {
      const r = bpmSection.getBoundingClientRect();
      const t = r.height <= 0 ? 0.5 : (r.bottom - clientY) / r.height;
      return BPM_MIN + clamp(t, 0, 1) * (BPM_MAX - BPM_MIN);
    }
    function volumeFromY(clientY) {
      const r = volumeSection.getBoundingClientRect();
      const t = r.height <= 0 ? 1 : (r.bottom - clientY) / r.height;
      return clamp(t, 0, 1) * 100;
    }
    function persistBpm() { try { localStorage.setItem(STORAGE_BPM, String(bpm)); } catch (_) {} scheduleUrlSync(); }
    function persistVolume() { try { localStorage.setItem(STORAGE_VOLUME, String(volumePct)); } catch (_) {} scheduleUrlSync(); }

    bpmSection.addEventListener('pointerdown', e => {
      bpmSection.setPointerCapture(e.pointerId); dragTarget = 'bpm'; setBpm(bpmFromY(e.clientY));
    });
    bpmSection.addEventListener('pointermove', e => { if (dragTarget === 'bpm') setBpm(bpmFromY(e.clientY)); });
    volumeSection.addEventListener('pointerdown', e => {
      volumeSection.setPointerCapture(e.pointerId); dragTarget = 'volume'; setVolumePct(volumeFromY(e.clientY));
    });
    volumeSection.addEventListener('pointermove', e => { if (dragTarget === 'volume') setVolumePct(volumeFromY(e.clientY)); });
    function endDrag() {
      if (dragTarget === 'bpm') persistBpm();
      else if (dragTarget === 'volume') persistVolume();
      dragTarget = null;
    }
    for (const sec of [bpmSection, volumeSection]) {
      sec.addEventListener('pointerup', endDrag);
      sec.addEventListener('pointercancel', endDrag);
    }

    // ---- Controls wiring (the top control sets the DEFAULT time signature) ----
    function readControls() {
      applyStructureChange(() => {
        defNum = clamp(parseInt(document.getElementById('num-input').value, 10) || defNum, 1, 16);
        const d = parseInt(document.getElementById('den-select').value, 10);
        defDen = [2, 4, 8, 16].includes(d) ? d : defDen;
        measures = clamp(parseInt((document.getElementById('measures-input').value || '').replace(/\D/g, ''), 10) || measures, 1, 8);
        const sd = parseInt(document.getElementById('subdiv-select').value, 10);
        subdiv = [1, 2, 4].includes(sd) ? sd : subdiv;
      });
    }

    function serializeBarSig() { return JSON.stringify(barSig.map(s => s ? [s.num, s.den] : 0)); }
    function parseBarSig(str, count) {
      let arr = [];
      try {
        const a = JSON.parse(str);
        if (Array.isArray(a)) arr = a.map(e =>
          (Array.isArray(e) && e.length === 2)
            ? { num: clamp(parseInt(e[0], 10) || defNum, 1, 16), den: [2, 4, 8, 16].includes(e[1]) ? e[1] : defDen }
            : null);
      } catch (_) {}
      arr.length = count;
      for (let i = 0; i < count; i++) if (arr[i] === undefined) arr[i] = null;
      return arr;
    }

    function persistSettings() {
      try {
        localStorage.setItem(STORAGE_NUM, String(defNum));
        localStorage.setItem(STORAGE_DEN, String(defDen));
        localStorage.setItem(STORAGE_MEASURES, String(measures));
        localStorage.setItem(STORAGE_SUBDIV, String(subdiv));
        localStorage.setItem(STORAGE_BARSIG, serializeBarSig());
        localStorage.setItem(STORAGE_BARDISABLED, barDisabled.map(b => b ? 1 : 0).join(''));
      } catch (_) {}
      scheduleUrlSync();
    }
    function persistPattern() {
      try { localStorage.setItem(STORAGE_PATTERN, pattern.join('')); } catch (_) {}
      scheduleUrlSync();
    }
    function clearHistory() { document.getElementById('history').innerHTML = ''; }

    // ---- Saved patterns: localStorage library with one level of folders ----
    // Shape: { items: [{id, name, folder, addedAt, state}], folders: [name] }
    let fpFolder = '';   // folder currently shown in the browser ('' = root)
    let currentClipName = '';   // name shown in the top bar
    let currentClipId = null;   // saved-item id the title renames, if any
    let fpDragId = null;        // file being dragged to reorder

    // Inline-rename a saved clip from its sidebar row.
    function renameSavedItem(id, row) {
      const nameEl = row.querySelector('.fp-name');
      if (!nameEl || row.querySelector('.fp-rename-input')) return;
      const cur = loadSaves().items.find(x => x.id === id);
      if (!cur) return;
      const input = document.createElement('input');
      input.type = 'text'; input.className = 'fp-rename-input'; input.value = cur.name;
      row.draggable = false;
      nameEl.replaceWith(input);
      input.focus(); input.select();
      let done = false;
      const commit = (save) => {
        if (done) return; done = true;
        const v = input.value.trim();
        if (save && v) {
          const s = loadSaves();
          const it = s.items.find(x => x.id === id);
          if (it) { it.name = v; persistSaves(s); if (id === currentClipId) { currentClipName = v; updateTopBar(); } }
        }
        renderFiles();
      };
      input.addEventListener('click', (e) => e.stopPropagation());
      input.addEventListener('keydown', (e) => {
        e.stopPropagation();
        if (e.key === 'Enter') { e.preventDefault(); commit(true); }
        else if (e.key === 'Escape') { e.preventDefault(); commit(false); }
      });
      input.addEventListener('blur', () => commit(true));
    }

    // Move the dragged clip to just before the drop target in the saved order.
    function reorderSave(dragId, targetId) {
      if (!dragId || dragId === targetId) return;
      const s = loadSaves();
      const from = s.items.findIndex(x => x.id === dragId);
      if (from < 0) return;
      const [moved] = s.items.splice(from, 1);
      const to = s.items.findIndex(x => x.id === targetId);
      s.items.splice(to < 0 ? s.items.length : to, 0, moved);
      persistSaves(s);
      renderFiles();
    }

    function updateTopBar() {
      const el = document.getElementById('fp-btn-name');
      if (el) el.textContent = currentClipName || 'Untitled';
    }

    // Double-click the title to rename the loaded clip in place.
    function renameClip() {
      const nameEl = document.getElementById('fp-btn-name');
      if (!nameEl || document.getElementById('fp-rename-input')) return;
      const input = document.createElement('input');
      input.type = 'text';
      input.id = 'fp-rename-input';
      input.className = 'fp-rename-input';
      input.value = currentClipName || '';
      nameEl.replaceWith(input);
      input.focus(); input.select();
      let done = false;
      const commit = (save) => {
        if (done) return; done = true;
        const v = input.value.trim();
        const span = document.createElement('span');
        span.id = 'fp-btn-name';
        input.replaceWith(span);
        if (save && v) applyRename(v);
        updateTopBar();
      };
      input.addEventListener('keydown', e => {
        e.stopPropagation();   // don't let the global handler grab Enter/Esc/keys
        if (e.key === 'Enter') { e.preventDefault(); commit(true); }
        else if (e.key === 'Escape') { e.preventDefault(); commit(false); }
      });
      input.addEventListener('blur', () => commit(true));
    }
    function applyRename(newName) {
      currentClipName = newName;
      if (currentClipId != null) {
        const s = loadSaves();
        const it = s.items.find(x => x.id === currentClipId);
        if (it) { it.name = newName; persistSaves(s); renderFiles(); }
      }
    }

    function loadSaves() {
      try {
        const o = JSON.parse(localStorage.getItem(STORAGE_SAVES) || '{}');
        return { items: Array.isArray(o.items) ? o.items : [], folders: Array.isArray(o.folders) ? o.folders : [] };
      } catch (_) { return { items: [], folders: [] }; }
    }
    function persistSaves(s) { try { localStorage.setItem(STORAGE_SAVES, JSON.stringify(s)); } catch (_) {} }

    function allFolders(s) {
      const set = new Set(s.folders);
      for (const it of s.items) if (it.folder) set.add(it.folder);
      return [...set].sort((a, b) => a.localeCompare(b));
    }

    // Identify a clip by its musical content (ignoring live tempo/volume, so a
    // name-derived-BPM clip still matches its saved entry).
    function contentKey(obj) {
      return JSON.stringify({
        num: obj.num, den: obj.den, measures: obj.measures, subdiv: obj.subdiv,
        bars: obj.bars || [], off: obj.off || [], pattern: obj.pattern || '',
      });
    }
    function findMatchingSave() {
      const cur = JSON.parse(serializeState().slice('rhythm:'.length));
      const ck = contentKey(cur);
      return loadSaves().items.find(it => contentKey(it.state) === ck) || null;
    }

    function isWideLayout() { return window.matchMedia('(min-width: 1000px)').matches; }
    // "Open" means the narrow overlay is covering the app. On wide screens the
    // panel is a permanent sidebar, so it never blocks keyboard play/tapping.
    function fileBrowserOpen() {
      return !isWideLayout() && !document.getElementById('file-picker-panel').hidden;
    }
    function saveDialogOpen() { return !document.getElementById('save-overlay').hidden; }
    function toggleFileBrowser() {
      if (isWideLayout()) return;   // sidebar is always visible
      const el = document.getElementById('file-picker-panel');
      if (el.hidden) openFileBrowser(); else closeFileBrowser();
    }
    function openFileBrowser() { document.getElementById('file-picker-panel').hidden = false; document.body.classList.add('fp-open'); renderFiles(); }
    function closeFileBrowser() { document.getElementById('file-picker-panel').hidden = true; document.body.classList.remove('fp-open'); }

    function fmtSaveDate(ts) {
      try { const d = new Date(ts); return `${d.getMonth() + 1}/${d.getDate()}`; } catch (_) { return ''; }
    }

    function fpRow(cls, icon, name, right) {
      const row = document.createElement('div');
      row.className = 'fp-row ' + cls;
      row.innerHTML = `<span class="fp-icon">${icon}</span><span class="fp-name"></span><span class="fp-date">${right || ''}</span>`;
      row.querySelector('.fp-name').textContent = name;
      return row;
    }

    function renderFiles() {
      const s = loadSaves();
      const list = document.getElementById('fp-list');
      list.innerHTML = '';
      document.getElementById('fp-path').textContent = fpFolder ? '/' + fpFolder : '/';

      if (fpFolder) {
        const up = fpRow('fp-up fp-top', '↩', '..', '');
        up.addEventListener('click', () => { fpFolder = ''; renderFiles(); scheduleUrlSync(); });
        list.appendChild(up);
      } else {
        // Root: an unclickable hint that we're at the top level.
        list.appendChild(fpRow('fp-root fp-top', '/', 'root', ''));
        for (const f of allFolders(s)) {
          const count = s.items.filter(it => (it.folder || '') === f).length;
          const row = fpRow('fp-folder', '📁', f, String(count));
          row.addEventListener('click', () => { fpFolder = f; renderFiles(); scheduleUrlSync(); });
          const del = document.createElement('button');
          del.type = 'button'; del.className = 'fp-del'; del.title = 'Delete folder'; del.textContent = '✕';
          del.addEventListener('click', (e) => { e.stopPropagation(); deleteFolder(f); });
          row.appendChild(del);
          list.appendChild(row);
        }
      }

      // Files in their stored order (drag a row to reorder).
      const items = s.items.filter(it => (it.folder || '') === fpFolder);
      for (const it of items) {
        const row = fpRow('fp-file' + (it.id === currentClipId ? ' fp-current' : ''), '♪', it.name, fmtSaveDate(it.addedAt));
        row.draggable = true;
        row.dataset.id = it.id;
        // Single click loads (delayed so a double-click can cancel it and rename).
        let ct = null;
        row.addEventListener('click', () => {
          if (ct) return;
          ct = setTimeout(() => { ct = null; loadSavedItem(it.id); }, 220);
        });
        row.addEventListener('dblclick', (e) => {
          e.preventDefault();
          if (ct) { clearTimeout(ct); ct = null; }
          renameSavedItem(it.id, row);
        });
        row.addEventListener('dragstart', (e) => { fpDragId = it.id; e.dataTransfer.effectAllowed = 'move'; row.classList.add('fp-dragging'); });
        row.addEventListener('dragend', () => { fpDragId = null; row.classList.remove('fp-dragging'); });
        row.addEventListener('dragover', (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; });
        row.addEventListener('drop', (e) => { e.preventDefault(); reorderSave(fpDragId, it.id); });
        const del = document.createElement('button');
        del.type = 'button'; del.className = 'fp-del'; del.title = 'Delete'; del.textContent = '✕';
        del.addEventListener('click', (e) => { e.stopPropagation(); deleteSavedItem(it.id); });
        row.appendChild(del);
        list.appendChild(row);
      }

      if (!list.children.length) {
        const empty = document.createElement('div');
        empty.className = 'fp-empty';
        empty.textContent = 'No saved patterns here yet.';
        list.appendChild(empty);
      }
    }

    // A trailing number in the clip name sets its tempo, e.g. "Groove 125".
    function bpmFromName(name) {
      const m = String(name || '').trim().match(/(\d{2,3})\s*(?:bpm)?\s*$/i);
      if (!m) return null;
      const n = parseInt(m[1], 10);
      return (n >= BPM_MIN && n <= BPM_MAX) ? n : null;
    }

    function loadSavedItem(id) {
      const s = loadSaves();
      const it = s.items.find(x => x.id === id);
      if (!it) return;
      applyState(it.state);
      const nb = bpmFromName(it.name);
      if (nb != null) { setBpm(nb); persistBpm(); }
      currentClipId = it.id;
      currentClipName = it.name;
      updateTopBar();
      renderFiles();
      closeFileBrowser();
      showToast('Loaded "' + it.name + '"');
    }
    function deleteSavedItem(id) {
      const s = loadSaves();
      s.items = s.items.filter(x => x.id !== id);
      persistSaves(s);
      renderFiles();
    }
    function deleteFolder(name) {
      const s = loadSaves();
      const n = s.items.filter(it => (it.folder || '') === name).length;
      if (!confirm(`Delete folder "${name}"${n ? ` and its ${n} pattern(s)` : ''}?`)) return;
      s.items = s.items.filter(it => (it.folder || '') !== name);
      s.folders = (s.folders || []).filter(f => f !== name);
      persistSaves(s);
      renderFiles();
    }
    function addFolderPrompt() {
      const name = (prompt('New folder name:') || '').trim();
      if (!name) return;
      const s = loadSaves();
      if (!s.folders.includes(name)) s.folders.push(name);
      persistSaves(s);
      fpFolder = name;
      renderFiles();
      scheduleUrlSync();
    }

    // Download the current folder's clips as JSON (root = everything). Drag the
    // file back onto the app to import.
    function exportFolder() {
      const s = loadSaves();
      const items = (fpFolder ? s.items.filter(it => (it.folder || '') === fpFolder) : s.items)
        .map(it => ({ name: it.name, folder: it.folder || '', state: it.state }));
      const folders = fpFolder ? [] : allFolders(s);
      const data = { type: 'rhythm-clips', version: 1, items, folders };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = (fpFolder || 'patterns') + '.json';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }

    function importClips(obj) {
      if (!obj || obj.type !== 'rhythm-clips' || !Array.isArray(obj.items)) return false;
      const s = loadSaves();
      let n = 0;
      for (const it of obj.items) {
        if (!it || typeof it.state !== 'object') continue;
        s.items.push({
          id: 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6) + (n++),
          name: String(it.name || 'Untitled'),
          folder: typeof it.folder === 'string' ? it.folder : '',
          addedAt: Date.now(),
          state: it.state,
        });
      }
      if (Array.isArray(obj.folders)) for (const f of obj.folders) if (f && !s.folders.includes(f)) s.folders.push(f);
      persistSaves(s);
      renderFiles();
      showToast('Imported ' + n + ' pattern' + (n === 1 ? '' : 's'));
      return true;
    }

    // Start a fresh, unsaved blank pattern (in the current folder).
    function newFile() {
      if (running) stopPlay();
      pattern = new Array(totalSteps()).fill(0);
      normalizeSteps();
      buildGrid();
      buildNotation();
      currentClipId = null;
      currentClipName = '';
      updateTopBar();
      renderFiles();
      persistPattern();
      scheduleUrlSync();
      if (!isWideLayout()) closeFileBrowser();
    }

    // ---- Save dialog ----
    function openSaveDialog() {
      const s = loadSaves();
      const dl = document.getElementById('save-folder-list');
      dl.innerHTML = '';
      for (const f of allFolders(s)) { const o = document.createElement('option'); o.value = f; dl.appendChild(o); }
      document.getElementById('save-name').value = currentClipName || 'Pattern ' + (s.items.length + 1);
      document.getElementById('save-folder').value = fpFolder;   // default: current folder
      document.getElementById('save-overlay').hidden = false;
      const ni = document.getElementById('save-name');
      ni.focus(); ni.select();
    }
    function closeSaveDialog() { document.getElementById('save-overlay').hidden = true; }
    function doSave() {
      const name = (document.getElementById('save-name').value || '').trim() || 'Untitled';
      const folder = (document.getElementById('save-folder').value || '').trim();
      const id = 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      const st = JSON.parse(serializeState().slice('rhythm:'.length));
      delete st.folder;   // folder is browser context, not part of the clip
      const s = loadSaves();
      s.items.push({ id, name, folder, addedAt: Date.now(), state: st });
      if (folder && !s.folders.includes(folder)) s.folders.push(folder);
      persistSaves(s);
      currentClipId = id;
      currentClipName = name;
      updateTopBar();
      closeSaveDialog();
      showToast('Saved "' + name + '"');
      renderFiles();
    }

    // ---- Practice modes: shuffle (random) / playlist (in order) ----
    // Repeat the current clip until two consecutive "green" cycles, then advance
    // to another saved clip after a short random silence + count-in.
    let practiceMode = '';   // '' | 'shuffle' | 'playlist'
    let greenStreak = 0;
    let practiceTriggered = false;

    // A cycle is "green" if every note was hit within the green window.
    function isGreenCycle(r) {
      if (!r || r.onsetSteps.length === 0) return false;
      const thresh = r.maxErrSec * GREEN_FRAC;
      for (const e of r.onsetBest) if (!(e <= thresh)) return false;
      return true;
    }

    function setPractice(mode) {
      practiceMode = (practiceMode === mode) ? '' : mode;
      document.getElementById('shuffle-btn').classList.toggle('active', practiceMode === 'shuffle');
      document.getElementById('playlist-btn').classList.toggle('active', practiceMode === 'playlist');
      greenStreak = 0;
      practiceTriggered = false;
      if (practiceMode && !running) startPlay();
    }
    function toggleShuffle() { setPractice('shuffle'); }
    function togglePlaylist() { setPractice('playlist'); }

    // Move to the next clip (random for shuffle, in-order for playlist), then
    // start it after a random silent gap (0.5–1.5 bars) + count-in.
    function advanceClip() {
      const s = loadSaves();
      if (!s.items.length) { greenStreak = 0; if (!running) startPlay(); else scheduleRaf = requestAnimationFrame(scheduleLoop); return; }
      let it;
      if (practiceMode === 'playlist') {
        const idx = s.items.findIndex(x => x.id === currentClipId);
        it = idx < 0 ? s.items[0] : s.items[(idx + 1) % s.items.length];
      } else {
        let pool = s.items;
        if (pool.length > 1 && currentClipId) pool = pool.filter(x => x.id !== currentClipId);
        it = pool[Math.floor(Math.random() * pool.length)];
      }
      greenStreak = 0;
      applyState(it.state);   // stops play + rebuilds to the new clip
      const nb = bpmFromName(it.name);   // a trailing number in the name sets tempo
      if (nb != null) { setBpm(nb); persistBpm(); }
      currentClipId = it.id;
      currentClipName = it.name;
      updateTopBar();
      renderFiles();
      let fe = 0; for (let m = 0; m < measures; m++) { if (!barOff(m)) { fe = m; break; } }
      const silence = barSecOf(fe) * (0.5 + Math.random());   // 0.5 .. 1.5 bars
      showToast((practiceMode === 'playlist' ? 'Next: "' : 'Shuffled to "') + it.name + '"');
      startPlay(silence);
    }

    // ---- URL state: keep the location hash in sync (debounced) so the page is
    // bookmarkable and reopens in the same state. ----
    let urlTimer = null;
    function scheduleUrlSync() {
      if (urlTimer) clearTimeout(urlTimer);
      urlTimer = setTimeout(() => {
        try { history.replaceState(null, '', '#' + encodeURIComponent(serializeState())); } catch (_) {}
      }, 500);
    }
    function stateFromUrl() {
      try {
        const h = location.hash;
        if (!h || h.length < 2) return null;
        return parseState(decodeURIComponent(h.slice(1)));
      } catch (_) { return null; }
    }

    // ---- Clipboard: Cmd/Ctrl+C copies the full state, Cmd/Ctrl+V applies it ----
    function isTypingTarget(el) {
      return !!el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.isContentEditable);
    }

    function serializeState() {
      return 'rhythm:' + JSON.stringify({
        v: 1, num: defNum, den: defDen, measures, subdiv,
        bars: barSig.map(s => s ? [s.num, s.den] : 0),
        off: barDisabled.map(b => b ? 1 : 0),
        bpm: Math.round(bpm), volume: Math.round(volumePct),
        pattern: pattern.join(''),
        folder: fpFolder,
      });
    }

    function parseState(text) {
      try {
        const s = (text || '').trim();
        const obj = JSON.parse(s.startsWith('rhythm:') ? s.slice(7) : s);
        if (obj && typeof obj === 'object' && typeof obj.pattern === 'string') return obj;
      } catch (_) {}
      return null;
    }

    // Load a state object into the variables (no DOM/persist side effects).
    function stateToVars(obj) {
      defNum = clamp(parseInt(obj.num, 10) || defNum, 1, 16);
      defDen = [2, 4, 8, 16].includes(obj.den) ? obj.den : defDen;
      measures = clamp(parseInt(obj.measures, 10) || measures, 1, 8);
      subdiv = [1, 2, 4].includes(obj.subdiv) ? obj.subdiv : subdiv;
      barSig = Array.isArray(obj.bars)
        ? obj.bars.map(e => (Array.isArray(e) && e.length === 2)
            ? { num: clamp(parseInt(e[0], 10) || defNum, 1, 16), den: [2, 4, 8, 16].includes(e[1]) ? e[1] : defDen }
            : null)
        : [];
      barSig.length = measures;
      for (let m = 0; m < measures; m++) if (barSig[m] === undefined) barSig[m] = null;
      barDisabled = Array.isArray(obj.off) ? obj.off.map(x => !!x) : [];
      barDisabled.length = measures;
      for (let m = 0; m < measures; m++) if (barDisabled[m] === undefined) barDisabled[m] = false;
      const T = totalSteps();
      pattern = (typeof obj.pattern === 'string' && /^[012]+$/.test(obj.pattern) && obj.pattern.length === T)
        ? obj.pattern.split('').map(c => parseInt(c, 10))
        : new Array(T).fill(0);
      if (Number.isFinite(obj.bpm)) bpm = clamp(obj.bpm, BPM_MIN, BPM_MAX);
      if (Number.isFinite(obj.volume)) volumePct = clamp(obj.volume, 0, 100);
      if (typeof obj.folder === 'string') fpFolder = obj.folder;
    }

    function applyState(obj) {
      if (running) stopPlay();
      clearHistory();   // a different pattern's accuracy log doesn't belong on this one
      stateToVars(obj);
      setBpm(bpm);
      setVolumePct(volumePct);
      normalizeSteps();
      syncControls();
      buildGrid();
      buildNotation();
      persistSettings(); persistPattern(); persistBpm(); persistVolume();
      // Reflect a matching saved clip in the title (e.g. after a paste).
      const m = findMatchingSave();
      currentClipId = m ? m.id : null;
      currentClipName = m ? m.name : '';
      updateTopBar();
      renderFiles();
    }

    let toastTimer = null;
    function showToast(msg) {
      const t = document.getElementById('toast');
      if (!t) return;
      t.textContent = msg;
      t.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 1200);
    }

    // The shareable link: current page URL with the state encoded in the hash.
    function stateUrl() {
      return location.href.split('#')[0] + '#' + encodeURIComponent(serializeState());
    }
    // Accept a pasted full URL (take the hash) or a bare state string.
    function parseClipboard(text) {
      let s = (text || '').trim();
      if (!s) return null;
      const hashIdx = s.indexOf('#');
      if (hashIdx >= 0) s = s.slice(hashIdx + 1);
      try { s = decodeURIComponent(s); } catch (_) {}
      return parseState(s);
    }

    document.addEventListener('copy', (e) => {
      if (isTypingTarget(document.activeElement)) return;
      const sel = window.getSelection && window.getSelection().toString();
      if (sel) return;   // let the user copy a real text selection instead
      e.preventDefault();
      e.clipboardData.setData('text/plain', stateUrl());
      showToast('Link copied');
    });
    document.addEventListener('paste', (e) => {
      if (isTypingTarget(document.activeElement)) return;
      const obj = parseClipboard(e.clipboardData.getData('text/plain'));
      if (!obj) return;
      e.preventDefault();
      applyState(obj);
      showToast('Pattern pasted');
    });

    document.getElementById('num-input').addEventListener('change', readControls);
    document.getElementById('den-select').addEventListener('change', readControls);
    document.getElementById('measures-input').addEventListener('change', readControls);
    document.getElementById('subdiv-select').addEventListener('change', readControls);
    // Select the measures value on focus so you can just type a number over the "x5".
    document.getElementById('measures-input').addEventListener('focus', (e) => e.target.select());

    document.addEventListener('keydown', e => {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const tag = e.target && e.target.tagName;
      const typing = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (e.target && e.target.isContentEditable);
      if (e.key === 'Escape') {
        if (fileBrowserOpen()) { closeFileBrowser(); return; }
        if (saveDialogOpen()) { closeSaveDialog(); return; }
        clearHistory();
        return;
      }
      // While an overlay is open it owns the keyboard (inputs still type).
      if (fileBrowserOpen() || saveDialogOpen()) return;
      if (e.code === 'Space') {
        if (typing) return;
        e.preventDefault();
        togglePlay();
        return;
      }
      if (typing) return;
      // BPM nudges: - = = ∓1, [ ] = ∓5 (repeat on hold)
      if (e.key === '-') { e.preventDefault(); setBpm(bpm - 1); persistBpm(); return; }
      if (e.key === '=') { e.preventDefault(); setBpm(bpm + 1); persistBpm(); return; }
      if (e.key === '[') { e.preventDefault(); setBpm(bpm - 5); persistBpm(); return; }
      if (e.key === ']') { e.preventDefault(); setBpm(bpm + 5); persistBpm(); return; }
      if (e.repeat) return;
      // any other printable key = a tap along with the beat
      // (length 1 excludes Tab, arrows, F-keys, etc.)
      if (e.key.length !== 1) return;
      e.preventDefault();
      registerTap();
    });

    // Allow clicking anywhere in the history area (or its empty space) to tap too.
    document.getElementById('history').addEventListener('pointerdown', () => registerTap());

    // ---- Load persisted state (URL hash wins, else localStorage) ----
    function loadState() {
      const urlObj = stateFromUrl();
      if (urlObj) { stateToVars(urlObj); return; }
      try {
        const b = parseFloat(localStorage.getItem(STORAGE_BPM));
        if (Number.isFinite(b)) bpm = clamp(b, BPM_MIN, BPM_MAX);
        const v = parseFloat(localStorage.getItem(STORAGE_VOLUME));
        if (Number.isFinite(v)) volumePct = clamp(v, 0, 100);
        const n = parseInt(localStorage.getItem(STORAGE_NUM), 10); if (Number.isFinite(n)) defNum = clamp(n, 1, 16);
        const d = parseInt(localStorage.getItem(STORAGE_DEN), 10); if ([2,4,8,16].includes(d)) defDen = d;
        const m = parseInt(localStorage.getItem(STORAGE_MEASURES), 10); if (Number.isFinite(m)) measures = clamp(m, 1, 8);
        const sd = parseInt(localStorage.getItem(STORAGE_SUBDIV), 10); if ([1,2,4].includes(sd)) subdiv = sd;
        barSig = parseBarSig(localStorage.getItem(STORAGE_BARSIG), measures);
        const bd = localStorage.getItem(STORAGE_BARDISABLED);
        barDisabled = (bd && /^[01]+$/.test(bd)) ? bd.split('').map(c => c === '1') : [];
        const pat = localStorage.getItem(STORAGE_PATTERN);
        if (pat && /^[012]+$/.test(pat) && pat.length === totalSteps()) {
          pattern = pat.split('').map(c => parseInt(c, 10));
        }
        const ts = localStorage.getItem(STORAGE_TAPSOUND);
        if (ts === '0' || ts === '1') tapSoundOn = ts === '1';
        const ci = localStorage.getItem(STORAGE_COUNTIN);
        if (ci === '0' || ci === '1') countInSpoken = ci === '1';
      } catch (_) {}
    }

    function applySystemTheme() {
      document.documentElement.setAttribute('data-theme',
        window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    }

    function init() {
      applySystemTheme();
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applySystemTheme);
      loadState();
      barSig.length = measures;
      barDisabled.length = measures;
      for (let m = 0; m < measures; m++) {
        if (barSig[m] === undefined) barSig[m] = null;
        if (barDisabled[m] === undefined) barDisabled[m] = false;
      }
      if (!barDisabled.some(b => !b)) barDisabled[0] = false;   // never all-disabled
      // If the loaded (URL/localStorage) state exactly matches a saved clip,
      // adopt its name + folder so the top bar and browser reflect it.
      const match = findMatchingSave();
      if (match) { currentClipId = match.id; currentClipName = match.name; }
      syncControls();
      syncTapSoundBtn();
      syncCountInBtn();
      setBpm(bpm);
      setVolumePct(volumePct);
      if (pattern.length !== totalSteps()) pattern = new Array(totalSteps()).fill(0);
      normalizeSteps();
      buildGrid();
      buildNotation();
      // Audio initializes lazily on the first Play (needs a user gesture anyway).
      // Step editing: pointer down on the grid, drag/release tracked on document
      // so a drag that leaves a cell still resizes the note.
      document.getElementById('grid').addEventListener('pointerdown', onGridDown);
      document.addEventListener('pointermove', onGridMove);
      document.addEventListener('pointerup', onGridUp);
      document.addEventListener('pointercancel', onGridUp);
      for (const id of ['save-name', 'save-folder']) {
        document.getElementById(id).addEventListener('keydown', e => {
          if (e.key === 'Enter') { e.preventDefault(); doSave(); }
        });
      }
      document.getElementById('save-overlay').addEventListener('click', e => { if (e.target.id === 'save-overlay') closeSaveDialog(); });
      document.getElementById('file-picker-btn').addEventListener('dblclick', renameClip);
      // Drag a JSON export file anywhere onto the page to import its clips.
      window.addEventListener('dragover', (e) => {
        if (e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files')) e.preventDefault();
      });
      window.addEventListener('drop', (e) => {
        const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
        if (!f || !(/\.json$/i.test(f.name) || f.type === 'application/json')) return;
        e.preventDefault();
        const reader = new FileReader();
        reader.onload = () => { try { importClips(JSON.parse(reader.result)); } catch (_) { showToast('Could not import file'); } };
        reader.readAsText(f);
      });
      renderFiles();    // populate the sidebar (wide) / overlay contents
      updateTopBar();
      let resizeRaf = null;
      window.addEventListener('resize', () => {
        if (resizeRaf) cancelAnimationFrame(resizeRaf);
        resizeRaf = requestAnimationFrame(buildNotation);
      });
    }

    init();
  </script>
</body>

</html>
